<title>Camera Models Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: fixed left sidebar (module/lesson nav) + wide scrolling lesson page.
   Fixed colour meaning everywhere:
   red = camera's RIGHT x-axis · green = camera's DOWN y-axis · blue = camera's FORWARD/look z-axis
   orange = the point · grey = world axes · purple = image plane. */
:root{
  --bg:#f5f3ec; --surface:#ffffff; --surface2:#f1eee5; --fg:#1a1920; --muted:#67626f;
  --line:#e3ddcf; --accent:#6b46ff; --accent-ink:#fff;
  --xr:#e23b2e;  --yg:#179a5a;  --zb:#1f6fe0;  --pt:#ef8a12; --world:#8b8679; --plane:#9b59ff;
  --good:#179a5a; --bad:#e23b2e; --star:#f0a500;
  --r:14px; --shadow:0 1px 0 var(--line),0 12px 30px rgba(20,18,30,.06);
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:'Space Grotesk','Inter',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131118; --surface:#1d1a24; --surface2:#262130; --fg:#f1ecfb; --muted:#a49cb6;
  --line:#322c40; --accent:#a88dff; --accent-ink:#17102b;
  --xr:#ff6a5c; --yg:#36c982; --zb:#5ea0ff; --pt:#ffb046; --world:#8a849a; --plane:#b989ff;
  --good:#36c982; --bad:#ff6a5c; --star:#ffcf3f;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131118; --surface:#1d1a24; --surface2:#262130; --fg:#f1ecfb; --muted:#a49cb6;
  --line:#322c40; --accent:#a88dff; --accent-ink:#17102b;
  --xr:#ff6a5c; --yg:#36c982; --zb:#5ea0ff; --pt:#ffb046; --world:#8a849a; --plane:#b989ff;
  --good:#36c982; --bad:#ff6a5c; --star:#ffcf3f;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:18px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
h1,h2,h3,h4{font-family:var(--disp);line-height:1.18;text-wrap:balance;margin:0}
button{font-family:inherit}
code,.mono{font-family:var(--mono)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:8px;max-width:1280px;margin:0 auto;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:9px}
.brand{font-family:var(--disp);font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit;cursor:pointer;margin-right:auto}
.menu-btn{display:none}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:999px;font-size:.82rem;font-weight:600;padding:7px 12px;cursor:pointer;white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:11px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}

/* shell */
.shell{display:flex;max-width:1280px;margin:0 auto;gap:0;align-items:flex-start}
.sidebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);align-self:flex-start;
  width:290px;flex:none;height:calc(100vh - 56px - env(safe-area-inset-top,0px));overflow:auto;
  border-right:1px solid var(--line);padding:16px 12px 40px}
.sidebar h4{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 6px 7px}
.navlink{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;
  border-radius:10px;padding:8px 10px;cursor:pointer;font-size:.92rem}
.navlink:hover{background:var(--surface2)}
.navlink.active{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:600}
.navlink .tick{font-size:.8rem;width:16px;flex:none;color:var(--good)}
.navlink .ls{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.82rem;width:28px;flex:none}
.navtop{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.navtop .chip{flex:1;text-align:center}
.content{flex:1;min-width:0;padding:22px max(16px,env(safe-area-inset-right,0px)) 90px max(20px,env(safe-area-inset-left,0px))}

/* lesson page */
.crumbs{font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.lesson-title{font-size:clamp(1.6rem,4vw,2.3rem);margin:6px 0 2px;letter-spacing:-.4px}
.lesson-sub{color:var(--muted);font-size:1.05rem;margin-bottom:10px}
.sec{margin:30px 0}
.sec > h3{font-size:1.25rem;display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sec > h3 .ic{font-size:1.1rem}
.sec p{margin:12px 0}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-height:46vh;display:flex;flex-direction:column}
.diagram svg,.diagram canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:8px}
.controls{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.ctl{display:flex;flex-direction:column;gap:3px;min-width:150px;flex:1}
.ctl .cl{font-size:.82rem;font-weight:600;display:flex;justify-content:space-between}
.ctl .cl b{font-family:var(--mono);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-family:var(--mono);font-size:1.05rem;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 22px}
.readout b{color:var(--accent)}
.story{font-size:1.08rem;background:var(--surface);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:14px 18px;box-shadow:var(--shadow)}
.work{font-family:var(--mono);font-size:1.12rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto;box-shadow:var(--shadow);line-height:1.9}
.work .line{white-space:pre}
.work .res{color:var(--accent);font-weight:700}
.plain{color:var(--muted);font-style:italic;font-size:.98rem}
.remind{font-size:.92rem;background:color-mix(in srgb,var(--pt) 13%,transparent);border:1px solid color-mix(in srgb,var(--pt) 38%,var(--line));border-radius:10px;padding:9px 13px}
kbd.t{font-family:var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.symtab{width:100%;border-collapse:collapse;font-size:1rem}
.symtab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
.symtab td:first-child{font-family:var(--mono);color:var(--accent);font-weight:700;white-space:nowrap;width:1%}
ol.why{padding-left:22px}ol.why li{margin:9px 0}
.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);background:var(--surface)}
.box.warn{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.box.exam{border-color:color-mix(in srgb,var(--zb) 40%,var(--line));background:color-mix(in srgb,var(--zb) 7%,var(--surface))}
.box h3{font-size:1.1rem;margin-bottom:8px}
.box ul{margin:6px 0;padding-left:20px}.box li{margin:6px 0}

/* matrix grid */
.mx{display:inline-grid;grid-auto-flow:row;gap:4px 0;font-family:var(--mono);font-weight:700;font-size:1.15rem;
  padding:7px 12px;position:relative;margin:4px 6px;vertical-align:middle;font-variant-numeric:tabular-nums}
.mx::before,.mx::after{content:"";position:absolute;top:3px;bottom:3px;width:8px;border:2.5px solid var(--fg)}
.mx::before{left:0;border-right:0;border-radius:4px 0 0 4px}
.mx::after{right:0;border-left:0;border-radius:0 4px 4px 0}
.mx .mrow{display:grid;grid-auto-flow:column;gap:0 16px;justify-items:center}
.mx .mrow span{min-width:34px;text-align:center}
.mxcap{font-size:.84rem;color:var(--muted);display:block;text-align:center;margin-top:2px}
.xr{color:var(--xr)}.yg{color:var(--yg)}.zb{color:var(--zb)}.pt{color:var(--pt)}.pl{color:var(--plane)}
.b{font-weight:700}

/* practice */
.practice{border:2px solid var(--accent);border-radius:16px;padding:0;overflow:hidden;box-shadow:var(--shadow)}
.practice .phead{background:color-mix(in srgb,var(--accent) 12%,var(--surface));padding:13px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.practice .phead h3{font-size:1.15rem}
.practice .pbody{padding:16px}
.stageband{display:flex;gap:6px;margin-bottom:12px}
.stagepill{flex:1;text-align:center;font-size:.78rem;font-weight:700;padding:6px;border-radius:8px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.stagepill.on{background:var(--accent);color:var(--accent-ink)}
.stagepill.done{background:color-mix(in srgb,var(--good) 20%,var(--surface));color:var(--good);border-color:var(--good)}
.pstep{border:1px solid var(--line);border-radius:12px;padding:13px;margin:11px 0;background:var(--surface)}
.pstep.locked{opacity:.4;pointer-events:none}
.pstep .ask{font-size:1.04rem;margin-bottom:9px}
.fields{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:.76rem;color:var(--muted);font-weight:600}
.field input{width:100px;font-family:var(--mono);font-size:1.2rem;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--fg)}
.field input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opt{text-align:left;background:var(--surface2);border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;cursor:pointer;font-size:1rem;color:inherit}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent)}.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.prow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;padding:11px 18px;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 13px;font-size:.88rem}
.fb{margin-top:10px;border-radius:10px;padding:10px 13px;font-size:.98rem}
.fb.ok{background:color-mix(in srgb,var(--good) 15%,var(--surface));border:1px solid var(--good)}
.fb.no{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid var(--bad)}
.hintwrap{margin-top:8px}
.hintline{font-size:.93rem;background:var(--surface2);border:1px dashed var(--line);border-radius:9px;padding:8px 11px;margin:6px 0}
.hintline b{color:var(--accent)}
.workpanel{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;font-family:var(--mono);font-size:1.02rem;line-height:1.8;min-height:40px}
.workpanel .wl{white-space:pre-wrap}
.workpanel .ph{color:var(--muted)}

/* notes */
.searchbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;background:var(--bg);padding:8px 0}
.searchbar input{width:100%;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
.note{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;box-shadow:var(--shadow);background:var(--surface)}
.note h4{font-size:1.12rem;margin-bottom:6px}
.note .meaning{font-size:.98rem}
.note .ex{font-family:var(--mono);font-size:1rem;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-top:9px;overflow-x:auto}
.note .gotolesson{font-size:.85rem;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:6px 0;margin-top:6px}
.notesec-h{font-family:var(--disp);font-size:1.3rem;margin:26px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--line)}

/* exam & home */
.hero h1{font-size:clamp(2rem,6vw,3rem);letter-spacing:-.6px}
.lede{color:var(--muted);font-size:1.12rem;max-width:62ch}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:20px}
.modcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px}
.modcard .mn{font-family:var(--disp);font-weight:700;color:var(--accent);font-size:1.3rem}
.modcard .bar{height:7px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:auto}
.modcard .bar i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--mono);font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
.exam-q{border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0;background:var(--surface);box-shadow:var(--shadow)}
.exam-q .qh{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.part{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.marks{color:var(--muted);font-size:.85rem;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0;font-size:.9rem}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:13px;height:13px;border-radius:50%}
.director{display:flex;gap:11px;align-items:flex-start;margin:4px 0 14px}
.director .face{font-size:1.9rem}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.hidden{display:none!important}
a{color:var(--accent)}

@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;height:100%;z-index:70;width:84%;max-width:320px;background:var(--surface);
    transform:translateX(-102%);transition:transform .22s;padding-top:calc(16px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.4)}
  .sidebar.open{transform:none}
  .menu-btn{display:grid;place-items:center}
  .content{padding-top:18px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:65}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">

<div class="topbar"><div class="topbar-in">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  <button class="brand" id="homeBtn">🎥 Camera Trainer</button>
  <button class="chip" id="starsChip"><span style="color:var(--star)">★</span> <span id="starsTotal">0</span></button>
  <button class="chip" id="notesBtn">📓 Notes</button>
  <button class="icon-btn" id="themeBtn" aria-label="Theme">🌙</button>
</div></div>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="content"></main>
</div>
<canvas class="confetti hidden" id="confetti"></canvas>

<script>
"use strict";
/* ========== helpers ========== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function parseNum(s){
  if(s==null)return NaN; s=String(s).trim().replace(/−/g,'-').replace(/\s+/g,'');
  if(s==='')return NaN;
  if(s.includes('/')){const[a,b]=s.split('/');const n=Number(a),d=Number(b);return(!isNaN(n)&&!isNaN(d)&&d!==0)?n/d:NaN;}
  const v=Number(s);return isNaN(v)?NaN:v;
}
const approx=(a,b,t=0.03)=>!isNaN(a)&&Math.abs(a-b)<=(Math.abs(b)>1e-9?Math.abs(b)*t+0.05:t+0.05);
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const fmt=x=>{const r=Math.round(x*100)/100;return Object.is(r,-0)?0:r;};

/* matrix render. rows: array of arrays (strings allowed). opt.colors: per-row css var; opt.cap caption */
function MX(rows,opt={}){
  let h=`<span class="mx">`;
  rows.forEach((row,i)=>{
    const c=opt.colors&&opt.colors[i]?`style="color:${opt.colors[i]}"`:'';
    h+=`<span class="mrow" ${c}>`+row.map(v=>`<span>${v}</span>`).join('')+`</span>`;
  });
  h+=`</span>`;
  if(opt.cap)h+=`<span class="mxcap">${opt.cap}</span>`;
  return h;
}
const CAMAX='<span class="xr">red = camera right (x)</span>, <span class="yg">green = down (y)</span>, <span class="zb">blue = forward/look (z)</span>, <span class="pt">orange = the point</span>';
const REMIND=`<div class="remind">✋ <b>CAPITAL X, Y, Z</b> = the real world. <b>small x, y, u, v</b> = the image. Axes: ${CAMAX}.</div>`;

/* ========== state ========== */
const SKEY='camtrainer_v1';
let S={stars:{},theme:null,lastLesson:null};
try{const r=localStorage.getItem(SKEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}};
function recordStar(id,n){const c=S.stars[id];if(c==null||n>c)S.stars[id]=n;save();renderStarsTotal();}
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+(b||0),0);
const renderStarsTotal=()=>{const e=$('#starsTotal');if(e)e.textContent=totalStars();};

function applyTheme(){const root=document.documentElement;
  if(S.theme==='light'){root.setAttribute('data-theme','light');$('#themeBtn').textContent='🌙';}
  else if(S.theme==='dark'){root.setAttribute('data-theme','dark');$('#themeBtn').textContent='☀️';}
  else{root.removeAttribute('data-theme');$('#themeBtn').textContent=matchMedia('(prefers-color-scheme:dark)').matches?'☀️':'🌙';}}
$('#themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();applyTheme();};
applyTheme();renderStarsTotal();

/* confetti */
function confetti(){const c=$('#confetti');c.classList.remove('hidden');const ctx=c.getContext('2d');
  const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cols=['#e23b2e','#179a5a','#1f6fe0','#ef8a12','#6b46ff','#f0a500'];
  const P=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,
    g:.33+Math.random()*.18,s:5+Math.random()*7,c:cols[(Math.random()*cols.length)|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let t=0;(function run(){t++;ctx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
    if(t<120)requestAnimationFrame(run);else c.classList.add('hidden');})();}

/* ========== DIAGRAMS registry ========== */
const DIAGRAMS={};
function ctl(id,label,min,max,step,val){return `<div class="ctl"><span class="cl">${label} <b id="${id}o">${val}</b></span>
  <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;}

/* (a) pinhole side view + similar triangles */
DIAGRAMS.pinhole=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 520 300" id="ph"></svg>
   <div class="controls">${ctl('pZ','Depth Z',6,40,1,20)}${ctl('pY','Height Y',2,14,1,10)}${ctl('pf','Focal f',1,7,1,3)}</div>
   <div class="readout" id="pho"></div>`;
  const draw=()=>{const Z=+$('#pZ').value,Y=+$('#pY').value,f=+$('#pf').value;
   $('#pZo').textContent=Z;$('#pYo').textContent=Y;$('#pfo').textContent=f;
   const img=f*Y/Z, pin=300,g=210, tX=pin-Z*6, tTop=g-Y*11, wX=pin+f*26, ip=img*11;
   $('#ph').innerHTML=`

/* (f) 3D orbit scene */
DIAGRAMS.orbit=(box)=>{
  box.innerHTML=`<canvas id="ob" width="520" height="340" style="max-width:100%"></canvas>
   <div class="controls">${ctl('obx','Rotate about x',-90,90,5,0)}${ctl('oby','Rotate about y',-90,90,5,30)}${ctl('obz','Rotate about z',-90,90,5,0)}
   ${ctl('obCx','Camera Cx',-3,3,0.5,0)}${ctl('obCz','Camera Cz',-6,0,0.5,-4)}</div>
   <div class="readout"><span style="width:100%" class="plain">Drag to orbit the whole scene. Grey = world axes. The camera's own axes are ${CAMAX.replace(/, <span class="pt">.*/,'')}. Purple square = image plane. Change the x/y/z dials and watch the camera axes swing — rotations do not commute, so the order matters.</span></div>`;
  const cv=$('#ob'),ctx=cv.getContext('2d');let viewX=-0.5,viewY=0.6,drag=null;
  const mul=(A,v)=>[A[0][0]*v[0]+A[0][1]*v[1]+A[0][2]*v[2],A[1][0]*v[0]+A[1][1]*v[1]+A[1][2]*v[2],A[2][0]*v[0]+A[2][1]*v[1]+A[2][2]*v[2]];
  const mm=(A,B)=>A.map((r,i)=>B[0].map((_,j)=>r.reduce((s,_,k)=>s+A[i][k]*B[k][j],0)));
  const Rx=a=>[[1,0,0],[0,Math.cos(a),-Math.sin(a)],[0,Math.sin(a),Math.cos(a)]];
  const Ry=a=>[[Math.cos(a),0,Math.sin(a)],[0,1,0],[-Math.sin(a),0,Math.cos(a)]];
  const Rz=a=>[[Math.cos(a),-Math.sin(a),0],[Math.sin(a),Math.cos(a),0],[0,0,1]];
  function proj(p){const V=mm(Rx(viewX),Ry(viewY));const q=mul(V,p);return[260+q[0]*46,180-q[1]*46-q[2]*10];}
  function line(a,b,col,w){const A=proj(a),B=proj(b);ctx.strokeStyle=col;ctx.lineWidth=w||2;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
  function dot(a,col,r){const A=proj(a);ctx.fillStyle=col;ctx.beginPath();ctx.arc(A[0],A[1],r||5,0,7);ctx.fill();}
  function cs(v){return getComputedStyle(document.documentElement).getPropertyValue(v);}
  function draw(){
    const ax=rad(+$('#obx').value),ay=rad(+$('#oby').value),az=rad(+$('#obz').value);
    $('#obxo').textContent=$('#obx').value+'°';$('#obyo').textContent=$('#oby').value+'°';$('#obzo').textContent=$('#obz').value+'°';
    const Cx=+$('#obCx').value,Cz=+$('#obCz').value;$('#obCxo').textContent=Cx;$('#obCzo').textContent=Cz;
    const R=mm(mm(Rz(az),Ry(ay)),Rx(ax));const C=[Cx,0,Cz];
    ctx.clearRect(0,0,520,340);
    // world axes
    line([0,0,0],[2.4,0,0],cs('--world'),1.5);line([0,0,0],[0,2.4,0],cs('--world'),1.5);line([0,0,0],[0,0,2.4],cs('--world'),1.5);
    dot([0,0,0],cs('--world'),4);
    // camera axes = rows of R, drawn from C
    const right=[R[0][0],R[0][1],R[0][2]],down=[R[1][0],R[1][1],R[1][2]],fwd=[R[2][0],R[2][1],R[2][2]];
    const add=(a,b,s)=>[a[0]+b[0]*s,a[1]+b[1]*s,a[2]+b[2]*s];
    line(C,add(C,right,1.4),cs('--xr'),3);line(C,add(C,down,1.4),cs('--yg'),3);line(C,add(C,fwd,1.8),cs('--zb'),3);
    dot(C,cs('--fg'),6);
    // image plane square at f in front
    const ctr=add(C,fwd,1.2);const c1=add(add(ctr,right,.7),down,.5),c2=add(add(ctr,right,-.7),down,.5),c3=add(add(ctr,right,-.7),down,-.5),c4=add(add(ctr,right,.7),down,-.5);
    ctx.fillStyle=cs('--plane')+'33';const P=[c1,c2,c3,c4].map(proj);ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);P.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.strokeStyle=cs('--plane');ctx.lineWidth=1.5;ctx.stroke();
    // a world point (orange)
    dot([1,1,1],cs('--pt'),7);line([1,1,1],[1,1,0],cs('--pt')+'77',1);
    ctx.fillStyle=cs('--muted');ctx.font='12px monospace';ctx.fillText('point (1,1,1)',proj([1,1,1])[0]+8,proj([1,1,1])[1]);
  }
  cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!drag)return;viewY+=(e.clientX-drag.x)*.01;viewX+=(e.clientY-drag.y)*.01;drag={x:e.clientX,y:e.clientY};draw();};
  cv.onpointerup=()=>drag=null;
  $$('#obx,#oby,#obz,#obCx,#obCz',box).forEach(i=>i.oninput=draw);draw();
};

/* (g) pixel rectangle 640x480 */

   <div class="controls">${ctl('kf','f',100,600,20,400)}${ctl('kx','Xc',-3,3,.5,2)}${ctl('ky','Yc',-3,3,.5,1)}${ctl('kz','Depth Zc',2,12,1,8)}</div>

    const u=f*X/Z+cx,v=f*Y/Z+cy;const ox=40,oy=20,W=440,H=270*480/640;const sx=W/640,sy=H/480;
    const clx=Math.max(ox,Math.min(ox+W,ox+u*sx)),cly=Math.max(oy,Math.min(oy+H,oy+v*sy));

     <circle cx="${ox+cx*sx}" cy="${oy+cy*sy}" r="5" fill="var(--yg)"/><text x="${ox+cx*sx+7}" y="${oy+cy*sy+4}" font-size="12" fill="var(--yg)">centre (cx,cy)</text>
     <line x1="${ox+cx*sx}" y1="${oy+cy*sy}" x2="${clx}" y2="${oy+cy*sy}" stroke="var(--xr)" stroke-width="2" stroke-dasharray="3 2"/>

  $$('#kf,#kx,#ky,#kz',box).forEach(i=>i.oninput=draw);draw();

    <div><div class="plain" style="text-align:center">[R | t] rows r₁ r₂ r₃</div><div id="rtrows">${MX([['r₁→','1','0','0','|','0'],['r₂→','0','0','−1','|','0'],['r₃→','0','1','0','|','−5']])}</div></div>

/* (k) back-projection: click a pixel, ray leaves camera */
DIAGRAMS.backproj=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 520 280" id="bp"></svg><div class="readout" id="bpo">Click anywhere on the purple image plane. A ray fires from the camera through that pixel into the scene — every point on it maps to the same pixel, so one image cannot tell depth.</div>`;
  const C=90,cy=140;let px=360,py=110;
  function draw(){
    const dx=px-C,dy=py-cy;const ex=C+dx*2.2,ey=cy+dy*2.2;
    $('#bp').innerHTML=`
     <circle cx="${C}" cy="${cy}" r="7" fill="var(--fg)"/><text x="${C}" y="${cy+22}" font-size="12" text-anchor="middle" fill="var(--muted)">camera C</text>
     <line x1="300" y1="40" x2="300" y2="240" stroke="var(--plane)" stroke-width="3"/><text x="300" y="30" font-size="12" text-anchor="middle" fill="var(--plane)">image plane</text>
     <line x1="${C}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="var(--pt)" stroke-width="2"/>
     <circle cx="${px}" cy="${py}" r="6" fill="var(--pt)"/>
     <circle cx="${C+dx*1.5}" cy="${cy+dy*1.5}" r="5" fill="var(--pt)" opacity=".5"/>
     <circle cx="${C+dx*1.9}" cy="${cy+dy*1.9}" r="5" fill="var(--pt)" opacity=".5"/>
     <text x="${ex-10}" y="${ey}" font-size="12" fill="var(--pt)">ray dir = Rᵀ K⁻¹ (u,v,1)</text>`;}
  $('#bp').addEventListener('pointerdown',e=>{const r=$('#bp').getBoundingClientRect();const sx=520/r.width,sy=280/r.height;
    px=Math.max(300,(e.clientX-r.left)*sx);py=Math.min(240,Math.max(40,(e.clientY-r.top)*sy));draw();});
  draw();
};

/* (l) calibration: add points -> equation rows */
DIAGRAMS.calib=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 520 240" id="cb"></svg>
   <div class="prow"><button class="btn sm" id="cbAdd">+ Add a known point</button><button class="btn sm ghost" id="cbReset">Reset</button>
     <span id="cbCount" class="marks"></span></div>
   <div class="readout" id="cbo" style="display:block"></div>`;
  let n=0;let sq='';for(let r=0;r<5;r++)for(let c=0;c<7;c++)if((r+c)%2===0)sq+=`<rect x="${30+c*24}" y="${30+r*24}" width="24" height="24" fill="var(--fg)" opacity=".8"/>`;
  const pts=[[30,30],[102,54],[174,30],[54,126],[150,150],[126,78]];
  function draw(){
    let mk='';for(let i=0;i<n;i++)mk+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="5" fill="var(--pt)" stroke="var(--surface)" stroke-width="1.5"/>`;
    $('#cb').innerHTML=`<rect x="28" y="28" width="172" height="124" fill="var(--surface2)" stroke="var(--line)"/>${sq}${mk}
      <text x="300" y="60" font-size="13" fill="var(--muted)">known 3D Xᵢ</text><text x="300" y="80" font-size="13" fill="var(--muted)">↕ matched to</text><text x="300" y="100" font-size="13" fill="var(--muted)">known pixel xᵢ</text>`;
    $('#cbCount').textContent=`${n} points → ${2*n} equations (need ≥ 12 rows / 6 points)`;
    let rows='';for(let i=0;i<n;i++)rows+=`row ${2*i+1}: ( 0ᵀ  −wᵢXᵢᵀ  yᵢXᵢᵀ )·p = 0\nrow ${2*i+2}: ( wᵢXᵢᵀ  0ᵀ  −xᵢXᵢᵀ )·p = 0\n`;
    $('#cbo').innerHTML=`<div class="mono" style="white-space:pre-wrap;font-size:.95rem">${rows||'Add points to stack the equations A·p = 0.'}</div>
      ${n>=6?'<div style="margin-top:8px;color:var(--good);font-weight:700">✓ Enough! Solve A·p = 0 by SVD → smallest singular vector = P.</div>':''}`;}
  $('#cbAdd',box).onclick=()=>{if(n<6){n++;draw();}};
  $('#cbReset',box).onclick=()=>{n=0;draw();};draw();
};
/* (6.6) vanishing point of a direction */
DIAGRAMS.vanish=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 520 300" id="vn"></svg>
   <div class="controls">${ctl('vndx','direction dx',-2,2,0.25,1)}${ctl('vndy','direction dy',-1.5,1.5,0.25,0)}</div>
   <div class="readout" id="vno"></div>`;
  const f=400,cx=320,cy=240;
  const draw=()=>{const dx=+$('#vndx').value,dy=+$('#vndy').value;$('#vndxo').textContent=dx;$('#vndyo').textContent=dy;
    const u=f*dx+cx,v=f*dy+cy; const ox=30,oy=18,W=460,H=460*480/640,sx=W/640,sy=H/480;
    const vx=Math.max(ox,Math.min(ox+W,ox+u*sx)),vy=Math.max(oy,Math.min(oy+H,oy+v*sy));
    let lines='';[0.12,0.3,0.5,0.7,0.88].forEach(fr=>{lines+=`<line x1="${ox+fr*W}" y1="${oy+H}" x2="${vx}" y2="${vy}" stroke="var(--world)" stroke-width="1.4"/>`;});
    $('#vn').innerHTML=`<rect x="${ox}" y="${oy}" width="${W}" height="${H}" fill="var(--surface2)" stroke="var(--plane)" stroke-width="2"/>
      ${lines}<circle cx="${vx}" cy="${vy}" r="8" fill="var(--pt)"/>
      <text x="${vx>ox+W-90?vx-12:vx+12}" y="${vy<oy+20?vy+18:vy-8}" font-size="12" fill="var(--pt)" ${vx>ox+W-90?'text-anchor="end"':''}>vanishing point</text>`;
    $('#vno').innerHTML=`<span>v = K R d = K·(${dx}, ${dy}, 1) = (f·dx+cx, f·dy+cy) = <b>(${fmt(u)}, ${fmt(v)})</b></span>
      <span style="width:100%" class="plain">Every world line pointing along d meets at this one pixel. Try dx=1, dy=0 → (720, 240). Translation drops out — only the direction matters.</span>`;};
  $$('#vndx,#vndy',box).forEach(i=>i.oninput=draw);draw();
};

/* (6.3) two routes, one pixel */
DIAGRAMS.tworoutes=(box)=>{
  box.innerHTML=`<div class="readout" style="display:block"><div class="plain">Midterm camera. Move the world point; both routes must give the same pixel.</div></div>
   <div class="controls">${ctl('trX','world X',-4,4,1,2)}${ctl('trZ','world Z',2,14,1,10)}</div>
   <div class="readout" id="tro" style="display:block"></div>`;
  const K=[[400,0,320],[0,400,240]],R=[[1,0,0],[0,0,-1],[0,1,0]],t=[0,0,-5],
    P=[[400,320,0,-1600],[0,240,-400,-1200],[0,1,0,-5]];
  const draw=()=>{const X=+$('#trX').value,Z=+$('#trZ').value;$('#trXo').textContent=X;$('#trZo').textContent=Z;
    const W=[X,0,Z];
    const Xc=R.map((row,i)=>row[0]*W[0]+row[1]*W[1]+row[2]*W[2]+t[i]);
    const u1=K[0][0]*Xc[0]/Xc[2]+K[0][2],v1=K[1][1]*Xc[1]/Xc[2]+K[1][2];
    const h=P.map(row=>row[0]*X+row[2]*Z+row[3]);
    const u2=h[0]/h[2],v2=h[1]/h[2];
    const match=approx(u1,u2,0.001)&&approx(v1,v2,0.001);
    $('#tro').innerHTML=`<div style="display:flex;gap:28px;flex-wrap:wrap">
      <div style="min-width:170px"><div class="plain">① Step route</div><div class="mono">X_cam = (${fmt(Xc[0])}, ${fmt(Xc[1])}, ${fmt(Xc[2])})<br>÷ depth → ×f → +centre<br>→ (<b>${fmt(u1)}</b>, <b>${fmt(v1)}</b>)</div></div>
      <div style="min-width:170px"><div class="plain">② Matrix route</div><div class="mono">P·X = (${fmt(h[0])}, ${fmt(h[1])}, ${fmt(h[2])})<br>÷ third number<br>→ (<b>${fmt(u2)}</b>, <b>${fmt(v2)}</b>)</div></div></div>
      <div style="margin-top:10px;font-weight:700;color:${match?'var(--good)':'var(--bad)'}">${match?'✓ Same pixel — the two routes agree.':'mismatch'}</div>
      ${Xc[2]<0?'<div class="plain">Depth is negative → the point is behind the camera (ghost pixel).</div>':''}`;};
  $$('#trX,#trZ',box).forEach(i=>i.oninput=draw);draw();
};

/* (6.5) camera centre: PC = 0 */
DIAGRAMS.centernull=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 520 170" id="cn"></svg>
   <div class="controls">${ctl('cnY','slide the point: world Y',0,10,0.5,2)}</div>
   <div class="readout" id="cno" style="display:block"></div>`;
  const P=[[400,320,0,-1600],[0,240,-400,-1200],[0,1,0,-5]];
  const draw=()=>{const Y=+$('#cnY').value;$('#cnYo').textContent=Y;
    const X=[0,Y,0,1];const r=P.map(row=>row[0]*X[0]+row[1]*X[1]+row[2]*X[2]+row[3]*X[3]);
    const atC=Math.abs(Y-5)<0.01;const ox=40,oy=90,sc=42;
    $('#cn').innerHTML=`<line x1="${ox}" y1="${oy}" x2="${ox+10*sc}" y2="${oy}" stroke="var(--world)" stroke-width="2"/>
      <text x="${ox}" y="${oy+24}" font-size="11" fill="var(--muted)">Y=0</text><text x="${ox+10*sc}" y="${oy+24}" font-size="11" fill="var(--muted)">Y=10</text>
      <circle cx="${ox+5*sc}" cy="${oy}" r="7" fill="var(--fg)"/><text x="${ox+5*sc}" y="${oy-14}" font-size="12" text-anchor="middle" fill="var(--muted)">camera C (Y=5)</text>
      <circle cx="${ox+Y*sc}" cy="${oy}" r="8" fill="${atC?'var(--good)':'var(--pt)'}"/><text x="${ox+Y*sc}" y="${oy+40}" font-size="12" text-anchor="middle" fill="var(--pt)">point Y=${Y}</text>`;
    $('#cno').innerHTML=`<div class="mono">P·(0, ${Y}, 0, 1) = (${fmt(r[0])}, ${fmt(r[1])}, ${fmt(r[2])})</div>
      <div class="plain" style="margin-top:6px">${atC?'<b style="color:var(--good)">All zeros! The point is exactly at the camera centre C = (0,5,0). So P·(C,1) = 0 — the centre is the null vector of P.</b>':'Slide the point onto C (Y = 5) and watch P·X collapse to (0, 0, 0).'}</div>`;};
  $('#cnY',box).oninput=draw;draw();
};

/* (6.4) degrees of freedom counter */
DIAGRAMS.dof=(box)=>{
  box.innerHTML=`<div class="readout" style="display:block">
    <div class="plain" style="text-align:center">Tap each block to add up where P's freedoms come from.</div>
    <div class="prow" style="justify-content:center;margin-top:12px">
      <button class="btn sm ghost" data-d="K">K intrinsics</button>
      <button class="btn sm ghost" data-d="R">R rotation</button>
      <button class="btn sm ghost" data-d="t">t translation</button></div>
    <div style="text-align:center;margin-top:16px;font-size:1.4rem;font-weight:700;font-family:var(--disp)" id="dofc">0 DOF</div>
    <div id="dofm" style="text-align:center;margin-top:8px"></div></div>`;
  const vals={K:5,R:3,t:3};
  const msgs={K:'K: focal (fx,fy), principal point (cx,cy), skew s → 5.',R:'R: a 3D rotation → 3.',t:'t: a 3D position → 3.'};
  const picked=new Set();
  $$('[data-d]',box).forEach(b=>b.onclick=()=>{const k=b.dataset.d;
    if(picked.has(k)){picked.delete(k);b.style.background='';}else{picked.add(k);b.style.background='color-mix(in srgb,var(--accent) 25%,transparent)';}
    const sum=[...picked].reduce((a,k)=>a+vals[k],0);
    $('#dofc',box).textContent=`${sum} DOF${picked.size===3?'  =  11  =  5 + 3 + 3':''}`;
    $('#dofm',box).innerHTML=`<span class="plain">${[...picked].map(k=>msgs[k]).join(' ')||'P has 12 entries, minus 1 for overall scale = 11 DOF.'}</span>`;});
};

      ['<span data-bk="M">400</span>','<span data-bk="M">320</span>','<span data-bk="M">0</span>','<span data-bk="p">−1600</span>'],
      ['<span data-bk="M">0</span>','<span data-bk="M">240</span>','<span data-bk="M">−400</span>','<span data-bk="p">−1200</span>'],
      ['<span data-bk="M">0</span>','<span data-bk="M">1</span>','<span data-bk="M">0</span>','<span data-bk="p">−5</span>']])}</div>

  const msgs={M:'The left 3×3 block M. RQ-decompose it: M = K·R — K is the upper-triangular intrinsics, R the orthogonal rotation.',
    p:'The last column p₄ = the image of the world origin.',

/* (7.4) live radial distortion grid */
DIAGRAMS.distort=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 320 320" id="ds" style="max-width:360px;margin:0 auto"></svg>
   <div class="controls">${ctl('dsk','distortion k₁',-0.6,0.6,0.05,0.3)}</div>
   <div class="readout" id="dso"></div>`;
  const cx=160,cy=160,R=140,N=8;
  const draw=()=>{const k=+$('#dsk').value;$('#dsko').textContent=k;
    const map=(x,y)=>{const nx=(x-cx)/R,ny=(y-cy)/R,r2=nx*nx+ny*ny,L=1+k*r2;return[cx+nx*L*R,cy+ny*L*R];};
    let s='';
    for(let i=0;i<=N;i++){let hp=[],vp=[];
      for(let j=0;j<=N;j++){hp.push(map(cx-R+2*R*j/N, cy-R+2*R*i/N));vp.push(map(cx-R+2*R*i/N, cy-R+2*R*j/N));}
      s+=`<polyline points="${hp.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--world)" stroke-width="1.3"/>`;
      s+=`<polyline points="${vp.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--world)" stroke-width="1.3"/>`;}
    s+=`<circle cx="${cx}" cy="${cy}" r="3" fill="var(--pt)"/>`;
    $('#ds').innerHTML=s;
    $('#dso').innerHTML=`<span>L(r) = 1 + k₁·r² ,  k₁ = ${k}</span>
      <span style="width:100%" class="plain">${k>0.02?'Positive k₁: the grid bows outward — straight world lines become curved.':k<-0.02?'Negative k₁: the grid bows inward.':'k₁ = 0: perfectly straight (ideal pinhole).'} The centre stays fixed; the effect grows toward the edges. P does not model this — you undistort first.</span>`;};
  $('#dsk',box).oninput=draw;draw();
};

/* (2.5) affine maps keep lines straight */
DIAGRAMS.affine=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 520 300" id="af"></svg>
   <div class="controls">${ctl('afA','rotate',-60,60,5,20)}${ctl('afS','scale',0.5,1.8,0.1,1.2)}${ctl('afH','shear',-0.8,0.8,0.1,0.3)}</div>
   <div class="readout" id="afo"></div>`;
  const mm=(A,B)=>[[A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],[A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]];
  const draw=()=>{const a=rad(+$('#afA').value),s=+$('#afS').value,h=+$('#afH').value;
    $('#afAo').textContent=(+$('#afA').value)+'°';$('#afSo').textContent=s;$('#afHo').textContent=h;
    const p0=[-3,-1],d=[6,3];const pts=[];for(let tt=0;tt<=1.0001;tt+=0.1)pts.push([p0[0]+d[0]*tt,p0[1]+d[1]*tt]);
    const sh=[[1,h],[0,1]],sc=[[s,0],[0,s]],ro=[[Math.cos(a),-Math.sin(a)],[Math.sin(a),Math.cos(a)]];
    const A=mm(ro,mm(sc,sh)),t=[1,0.5];
    const ap=pts.map(p=>[A[0][0]*p[0]+A[0][1]*p[1]+t[0],A[1][0]*p[0]+A[1][1]*p[1]+t[1]]);
    const ox=250,oy=160,SC=28,xy=p=>[ox+p[0]*SC,oy-p[1]*SC];
    const poly=arr=>arr.map(p=>{const q=xy(p);return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');
    $('#af').innerHTML=`<line x1="20" y1="${oy}" x2="500" y2="${oy}" stroke="var(--world)"/><line x1="${ox}" y1="20" x2="${ox}" y2="290" stroke="var(--world)"/>
      <polyline points="${poly(pts)}" fill="none" stroke="var(--world)" stroke-width="2" stroke-dasharray="5 4"/>
      <polyline points="${poly(ap)}" fill="none" stroke="var(--pt)" stroke-width="3"/>
      ${pts.map(p=>{const q=xy(p);return `<circle cx="${q[0]}" cy="${q[1]}" r="2.5" fill="var(--world)"/>`;}).join('')}
      ${ap.map(p=>{const q=xy(p);return `<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--pt)"/>`;}).join('')}`;
    $('#afo').innerHTML=`<span style="width:100%" class="plain">Grey dashed = the original straight line. Orange = after x' = A·x + t (rotate × scale × shear, then shift). It is <b>still straight</b>, and evenly spaced dots stay evenly spaced — affine maps never bend a line.</span>`;};
  $$('#afA,#afS,#afH',box).forEach(i=>i.oninput=draw);draw();
};

/* (3.4) is it a valid rotation? */
DIAGRAMS.rotcheck=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 320 300" id="rc" style="max-width:360px;margin:0 auto"></svg>
   <div class="controls">${ctl('rcA1','row 1 angle',0,350,10,0)}${ctl('rcA2','row 2 angle',0,350,10,90)}${ctl('rcL2','row 2 length',0.4,1.8,0.1,1)}</div>
   <div class="readout" id="rco" style="display:block"></div>`;
  const draw=()=>{const a1=rad(+$('#rcA1').value),a2=rad(+$('#rcA2').value),l2=+$('#rcL2').value;
    $('#rcA1o').textContent=(+$('#rcA1').value)+'°';$('#rcA2o').textContent=(+$('#rcA2').value)+'°';$('#rcL2o').textContent=l2;
    const r1=[Math.cos(a1),Math.sin(a1)],r2=[l2*Math.cos(a2),l2*Math.sin(a2)];
    const dot=r1[0]*r2[0]+r1[1]*r2[1],len2=Math.hypot(r2[0],r2[1]);
    const ok=Math.abs(len2-1)<0.06&&Math.abs(dot)<0.06;const ox=160,oy=160,SC=90;
    $('#rc').innerHTML=`<line x1="20" y1="${oy}" x2="300" y2="${oy}" stroke="var(--world)"/><line x1="${ox}" y1="20" x2="${ox}" y2="290" stroke="var(--world)"/>
      <line x1="${ox}" y1="${oy}" x2="${ox+r1[0]*SC}" y2="${oy-r1[1]*SC}" stroke="var(--xr)" stroke-width="4"/>
      <line x1="${ox}" y1="${oy}" x2="${ox+r2[0]*SC}" y2="${oy-r2[1]*SC}" stroke="var(--zb)" stroke-width="4"/>
      <text x="${ox+r1[0]*SC}" y="${oy-r1[1]*SC-6}" font-size="12" fill="var(--xr)">row 1</text>
      <text x="${ox+r2[0]*SC}" y="${oy-r2[1]*SC-6}" font-size="12" fill="var(--zb)">row 2</text>`;
    $('#rco').innerHTML=`<div class="mono">|row 1| = 1.00  ·  |row 2| = ${fmt(len2)}  ·  row1·row2 = ${fmt(dot)}</div>
      <div style="margin-top:6px;font-weight:700;color:${ok?'var(--good)':'var(--bad)'}">${ok?'✓ Valid rotation: both rows unit length and perpendicular (90° apart).':'✗ Not a rotation: you need |row 2| = 1 and row1·row2 = 0 (perpendicular).'}</div>`;};
  $$('#rcA1,#rcA2,#rcL2',box).forEach(i=>i.oninput=draw);draw();
};

/* (3.5) fix a broken rotation with SVD */
DIAGRAMS.svdfix=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 320 300" id="sv" style="max-width:360px;margin:0 auto"></svg>
   <div class="controls">${ctl('svA','row 2 angle',40,140,5,70)}${ctl('svL','row 2 length',0.5,1.6,0.1,1.3)}</div>
   <div class="prow"><button class="btn sm" id="svFix">✨ Fix with SVD → U Vᵀ</button><button class="btn sm ghost" id="svReset">reset</button></div>
   <div class="readout" id="svo" style="display:block"></div>`;
  let fixed=false;
  const draw=()=>{const a2=rad(+$('#svA').value),l2=+$('#svL').value;$('#svAo').textContent=(+$('#svA').value)+'°';$('#svLo').textContent=l2;
    const r1=[1,0],r2=[l2*Math.cos(a2),l2*Math.sin(a2)];const ox=100,oy=170,SC=90;let g='';
    if(fixed){const sign=r2[1]>=0?1:-1;g=`<line x1="${ox}" y1="${oy}" x2="${ox+SC}" y2="${oy}" stroke="var(--good)" stroke-width="5"/>
      <line x1="${ox}" y1="${oy}" x2="${ox}" y2="${oy-sign*SC}" stroke="var(--good)" stroke-width="5"/>`;}
    $('#sv').innerHTML=`<line x1="20" y1="${oy}" x2="300" y2="${oy}" stroke="var(--world)"/><line x1="${ox}" y1="20" x2="${ox}" y2="290" stroke="var(--world)"/>
      <line x1="${ox}" y1="${oy}" x2="${ox+r1[0]*SC}" y2="${oy-r1[1]*SC}" stroke="var(--xr)" stroke-width="3" opacity="${fixed?.3:1}"/>
      <line x1="${ox}" y1="${oy}" x2="${ox+r2[0]*SC}" y2="${oy-r2[1]*SC}" stroke="var(--zb)" stroke-width="3" opacity="${fixed?.3:1}"/>${g}`;
    const len2=Math.hypot(r2[0],r2[1]),dot=r1[0]*r2[0]+r1[1]*r2[1];
    $('#svo').innerHTML=`<div class="mono">before:  |row 2| = ${fmt(len2)},  dot = ${fmt(dot)}  ${Math.abs(len2-1)<0.05&&Math.abs(dot)<0.05?'':'← broken'}</div>
      ${fixed?'<div style="color:var(--good);font-weight:700;margin-top:6px">✓ Snapped to the nearest true rotation (green): unit length, perpendicular. That is R = U Vᵀ.</div>':'<div class="plain" style="margin-top:6px">Red/blue rows are not a rotation. Press Fix: SVD writes R = U S Vᵀ, we drop the stretch S and keep U Vᵀ.</div>'}`;};
  $$('#svA,#svL',box).forEach(i=>i.oninput=()=>{fixed=false;draw();});
  $('#svFix',box).onclick=()=>{fixed=true;draw();};$('#svReset',box).onclick=()=>{fixed=false;draw();};draw();
};

/* (4.2) the extrinsic matrix [R|t], 6 DOF */
DIAGRAMS.extrinsic6=(box)=>{
  box.innerHTML=`<div class="readout" style="display:block"><div class="plain" style="text-align:center">Turn the 3 rotation dials and move the camera — the 6 numbers of pose fill [R | t]. (t = −R·C.)</div></div>
   <div class="controls">${ctl('exrx','rot x',-60,60,15,0)}${ctl('exry','rot y',-60,60,15,30)}${ctl('exrz','rot z',-60,60,15,0)}${ctl('exCx','Cx',-3,3,1,0)}${ctl('exCy','Cy',-3,3,1,0)}${ctl('exCz','Cz',-3,3,1,2)}</div>
   <div id="exg" style="text-align:center;margin-top:12px;overflow-x:auto"></div>`;
  const Rx=a=>[[1,0,0],[0,Math.cos(a),-Math.sin(a)],[0,Math.sin(a),Math.cos(a)]];
  const Ry=a=>[[Math.cos(a),0,Math.sin(a)],[0,1,0],[-Math.sin(a),0,Math.cos(a)]];
  const Rz=a=>[[Math.cos(a),-Math.sin(a),0],[Math.sin(a),Math.cos(a),0],[0,0,1]];
  const mm=(A,B)=>A.map((r,i)=>B[0].map((_,j)=>r.reduce((s,_,k)=>s+A[i][k]*B[k][j],0)));
  const draw=()=>{const rx=rad(+$('#exrx').value),ry=rad(+$('#exry').value),rz=rad(+$('#exrz').value);
    ['exrx','exry','exrz'].forEach(id=>$('#'+id+'o').textContent=$('#'+id).value+'°');
    ['exCx','exCy','exCz'].forEach(id=>$('#'+id+'o').textContent=$('#'+id).value);
    const C=[+$('#exCx').value,+$('#exCy').value,+$('#exCz').value];
    const R=mm(mm(Rz(rz),Ry(ry)),Rx(rx));
    const t=R.map(row=>-(row[0]*C[0]+row[1]*C[1]+row[2]*C[2]));
    const rows=R.map((row,i)=>[...row.map(fmt),'|',fmt(t[i])]);
    $('#exg').innerHTML=MX(rows,{colors:['var(--xr)','var(--yg)','var(--zb)'],cap:'[ R | t ] — 3 from the rotation + 3 from the position = 6 DOF'});};
  $$('#exrx,#exry,#exrz,#exCx,#exCy,#exCz',box).forEach(i=>i.oninput=draw);draw();
};

/* (4.3) forward-and-back round trip */
DIAGRAMS.roundtrip=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 520 220" id="rp"></svg>
   <div class="controls">${ctl('rpT','camera turn',0,350,10,90)}${ctl('rpCx','Cx',-3,3,1,1)}${ctl('rpCy','Cy',-3,3,1,0)}</div>
   <div class="readout" id="rpo" style="display:block"></div>`;
  const draw=()=>{const t=rad(+$('#rpT').value),Cx=+$('#rpCx').value,Cy=+$('#rpCy').value;
    $('#rpTo').textContent=(+$('#rpT').value)+'°';$('#rpCxo').textContent=Cx;$('#rpCyo').textContent=Cy;
    const R=[[Math.cos(t),Math.sin(t)],[-Math.sin(t),Math.cos(t)]];
    const RC=[R[0][0]*Cx+R[0][1]*Cy,R[1][0]*Cx+R[1][1]*Cy],tt=[-RC[0],-RC[1]];
    const Crec=[-(R[0][0]*tt[0]+R[1][0]*tt[1]),-(R[0][1]*tt[0]+R[1][1]*tt[1])];
    const ok=approx(Crec[0],Cx,0.001)&&approx(Crec[1],Cy,0.001);const ox=130,oy=120,SC=28;
    $('#rp').innerHTML=`<rect x="20" y="20" width="220" height="190" rx="8" fill="var(--surface2)" stroke="var(--line)"/>

      <circle cx="${ox+Cx*SC}" cy="${oy-Cy*SC}" r="8" fill="var(--fg)"/>
      <line x1="${ox+Cx*SC}" y1="${oy-Cy*SC}" x2="${ox+Cx*SC+Math.sin(t)*30}" y2="${oy-Cy*SC-Math.cos(t)*30}" stroke="var(--zb)" stroke-width="3"/>
      <text x="${ox+Cx*SC}" y="${oy-Cy*SC+24}" font-size="11" text-anchor="middle" fill="var(--muted)">C = (${Cx}, ${Cy})</text>`;
    $('#rpo').innerHTML=`<div class="mono">forward:  t = −R·C   = (${fmt(tt[0])}, ${fmt(tt[1])})<br>back:     C = −Rᵀ·t  = (${fmt(Crec[0])}, ${fmt(Crec[1])})</div>
      <div style="margin-top:6px;font-weight:700;color:${ok?'var(--good)':'var(--bad)'}">${ok?'✓ Round-trip matches — Rᵀ undid R and recovered the original C.':'…'}</div>`;};
  $$('#rpT,#rpCx,#rpCy',box).forEach(i=>i.oninput=draw);draw();
};

/* (5.3) general K: fx, fy, skew */
DIAGRAMS.generalK=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 520 280" id="gk"></svg>
   <div class="controls">${ctl('gkfx','fx (x scale)',150,600,20,400)}${ctl('gkfy','fy (y scale)',150,600,20,400)}${ctl('gks','skew s',-160,160,10,0)}</div>
   <div class="readout" id="gko"></div>`;
  const draw=()=>{const fx=+$('#gkfx').value,fy=+$('#gkfy').value,s=+$('#gks').value;
    $('#gkfxo').textContent=fx;$('#gkfyo').textContent=fy;$('#gkso').textContent=s;
    const cx=260,cy=130,sc=0.42,corners=[[-0.5,-0.5],[0.5,-0.5],[0.5,0.5],[-0.5,0.5]];
    const map=p=>[cx+(fx*p[0]+s*p[1])*sc, cy+(fy*p[1])*sc];
    const pts=corners.map(map).map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
    const ref=corners.map(p=>[cx+180*p[0]*sc,cy+180*p[1]*sc]).map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
    $('#gk').innerHTML=`<polygon points="${ref}" fill="none" stroke="var(--world)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <polygon points="${pts}" fill="var(--plane)" opacity="0.2" stroke="var(--plane)" stroke-width="2.5"/>
      <text x="${cx}" y="262" font-size="12" text-anchor="middle" fill="var(--muted)">grey = square pixels · purple = how K scales & skews it</text>`;
    $('#gko').innerHTML=`<span>u = <b>fx</b>·x + <b>s</b>·y + x₀ ,  v = <b>fy</b>·y + y₀</span>
      <span style="width:100%" class="plain">${fx!==fy?'fx ≠ fy: non-square pixels stretch x and y differently. ':''}${s!==0?'Skew s ≠ 0 slants the shape (rare in real cameras). ':''}f in pixels = f in mm ÷ pixel size — that is why fx, fy can differ. <b>5 DOF</b> with skew, <b>4</b> without.</span>`;};
  $$('#gkfx,#gkfy,#gks',box).forEach(i=>i.oninput=draw);draw();
};

    $('#ie').innerHTML=`<line x1="20" y1="${g}" x2="500" y2="${g}" stroke="var(--world)"/>
      <polygon points="${camX},${g} ${camX+120},${g-uy} ${camX+120},${g+uy}" fill="var(--zb)" opacity="0.14"/>

      <div><div class="plain">Intrinsic K — lens</div><div class="mono" style="color:${changed==='zoom'?'var(--good)':'var(--muted)'}">f = ${f} ${changed==='zoom'?'← changed':''}</div></div></div>
      <div class="plain" style="margin-top:8px">Slide <b>move</b>: only the extrinsics [R|t] change (lens untouched). Slide <b>zoom</b>: only the intrinsics K change (the camera has not moved). Full camera: P = K·[R|t].</div>`;};
  $('#ieMove',box).oninput=()=>draw('move');$('#ieZoom',box).oninput=()=>draw('zoom');draw();
};

  ];
  const E=[['pin','P'],['hom','P'],['rot','P'],['tr','P'],['K','P'],['cal','P'],['rot','tr'],['tr','K']];

/* (6.0) why one matrix — fold the long way into P */
DIAGRAMS.whyP=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 520 170" id="wp"></svg>
   <div class="prow"><button class="btn sm" id="wpFold">⬇ Fold the whole trip into one matrix</button><button class="btn sm ghost" id="wpReset">↩ show the long way</button></div>
   <div class="readout" id="wpo" style="display:block"></div>`;
  let folded=false;
  const draw=()=>{
    if(!folded){
      const steps=[['turn','R'],['move','t'],['÷ depth',''],['to pixels','K']];
      let s='';steps.forEach((st,i)=>{const x=18+i*125;
        s+=`<rect x="${x}" y="55" width="100" height="56" rx="10" fill="var(--surface)" stroke="var(--line)"/>
          <text x="${x+50}" y="80" font-size="13" font-weight="700" text-anchor="middle" fill="var(--fg)">${st[0]}</text>
          <text x="${x+50}" y="97" font-size="12" text-anchor="middle" fill="var(--muted)">${st[1]}</text>`;
        if(i<3)s+=`<line x1="${x+100}" y1="83" x2="${x+125}" y2="83" stroke="var(--muted)" stroke-width="2" marker-end="url(#wa)"/>`;});
      s+=`<defs><marker id="wa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="var(--muted)"/></marker></defs>`;
      $('#wp').innerHTML=s;
      $('#wpo').innerHTML=`<span style="width:100%" class="plain">Right now every single point walks through <b>four separate steps</b> — and each one is a place to slip (a forgotten minus, a missed divide, the centre added too early). It works, but it is slow and fiddly.</span>`;
    } else {
      $('#wp').innerHTML=`<text x="260" y="34" font-size="12" text-anchor="middle" fill="var(--muted)">multiply once, divide once</text>
        <rect x="165" y="50" width="190" height="72" rx="14" fill="var(--accent)" stroke="var(--line)"/>
        <text x="260" y="85" font-size="22" font-weight="700" text-anchor="middle" fill="var(--accent-ink)">P = K[R|t]</text>
        <text x="260" y="107" font-size="12" text-anchor="middle" fill="var(--accent-ink)">one 3×4 table</text>`;
      $('#wpo').innerHTML=`<span style="width:100%" class="plain">All four steps fold into <b>one 3×4 matrix P</b>. Projecting a point is now a single multiply, then one divide — same answer, far less to get wrong. And the camera's secrets (its centre, where it looks, its vanishing points) can be read straight out of P.</span>`;
    }
  };
  $('#wpFold',box).onclick=()=>{folded=true;draw();};
  $('#wpReset',box).onclick=()=>{folded=false;draw();};draw();
};

{id:'1.1',mod:1,n:'1.1',title:'The pinhole, image plane & focal length',sub:'The five words every exam uses',diagram:'pinhole',
 story:`Let's begin gently, with nothing more than a box and a pinhole — no formulas in sight yet. Imagine a dark box with one tiny hole: light from the scene slips through and paints a picture on the back wall. That little hole is what we call the <b>camera centre</b>, and the back wall is the <b>image plane</b>. The straight line that leaves the hole at a right angle to the wall is the <b>optical axis</b>, and the spot where it meets the wall is the <b>principal point</b>. The distance from the hole to the wall is the <b>focal length</b>, f. Sit with these five words for a moment — everything else in this chapter grows from them, so there is no need to rush.`,
 worked:`<div class="work"><div class="line">camera centre C .... the pinhole (where all rays cross)</div><div class="line">image plane ........ the wall, at distance f behind C</div><div class="line">optical axis ....... straight line C → wall, perpendicular to it</div><div class="line">principal point .... where the axis meets the wall</div><div class="res">focal length f ..... distance from C to the wall</div></div>`,
 formula:{grid:`<p>No formula yet — just the picture. Next lesson turns it into numbers.</p>`,symbols:[['C','the camera centre (the pinhole); all light rays pass through it'],['f','focal length: distance from C to the image plane'],['axis','the optical/principal axis, perpendicular to the image plane']]},

 mistakes:['Calling f the size of the camera — it is only the hole-to-wall distance.','Thinking the principal point is always the image centre — it is where the axis hits, usually near but not exactly the centre.','Confusing the image plane with the lens.'],

{id:'1.2',mod:1,n:'1.2',title:'Similar triangles: x = fX/Z',sub:'The master equation, derived',diagram:'pinhole',
 story:`Now let's turn that picture into a small piece of arithmetic, slowly and together. Picture the scene from the side: a tree of height Y standing a distance Z away, with the wall a distance f behind the hole. A ray from the treetop passes through the hole and lands on the wall, and in doing so it draws two triangles that share the very same corner. Here is the lovely part — triangles with the same angles always have their sides in the same proportions. So the little image height compared to f is exactly the real height compared to Z. Rearrange that gently and you arrive at the one equation we will lean on all chapter long — and notice that you derived it yourself.`,
 worked:`<p>Tree <span class="pt">Y = 6</span> tall, <span class="world">Z = 12</span> away, <kbd class="t">f = 2</kbd>.</p>
  <div class="work"><div class="line">similar triangles:  y / f  =  Y / Z</div><div class="line">y = f · Y / Z</div><div class="line">  = 2 · 6 / 12</div><div class="res">  = 1</div></div>
  <p class="plain">Real tree 6 tall, 12 away → image just 1 tall (and upside-down).</p>`,
 formula:{grid:`${MX([['x','=','f·X/Z'],['y','=','f·Y/Z']],{cap:'image = focal length × world / depth'})}`,
   symbols:[['X, Y','world sideways & height (CAPITALS)'],['Z','depth: distance along the optical axis'],['x, y','position on the image (small letters)'],['f','focal length']]},
 why:['Draw the ray from the treetop through the camera centre to the wall.','This gives two right triangles sharing the angle at the centre: one with legs (Y, Z) in the world, one with legs (y, f) in the box.','Equal angles ⇒ equal side ratios: y/f = Y/Z.','Multiply both sides by f: y = f·Y/Z. The same argument sideways gives x = f·X/Z.'],
 mistakes:['Writing y = f·Z/Y (upside-down ratio). It is world-height over depth.','Forgetting to divide by depth Z at all.','Mixing capital and small letters — X,Y,Z are the world; x,y are the image.'],
 exam:['"Derive x = fX/Z from a labelled pinhole diagram." (3–4 marks.)','"A 10 m tree is 20 m away, f = 1 m. Find the image height." (answer 0.5 m.)'],
 practice:[say('With me — build the tree answer step by step.'),

  say('Alone — exam-style (new numbers each try).'),
  {t:'n',ask:'Tree 10 m tall, 20 m away, f = 1 m. Image height?',fields:[['v','y (m)']],ans:[0.5],
    line:v=>`y = 1·10/20 = ${fmt(v[0])} m`,hints:['y = f·Y/Z.','1·10/20.','0.5 m.'],diag:v=>approx(v[0],200)?'That is Y·Z. Divide by Z.':null,
    regen:()=>{const Y=[4,6,8,10,12][(Math.random()*5)|0],Z=[16,20,24,10,30][(Math.random()*5)|0],f=[1,2][(Math.random()*2)|0];
      return{ask:`Tree ${Y} m tall, ${Z} m away, f = ${f} m. Image height?`,ans:[f*Y/Z],fields:[['v','y (m)']],line:v=>`y = ${f}·${Y}/${Z} = ${fmt(v[0])} m`};}}]},

{id:'1.3',mod:1,n:'1.3',title:'What perspective does to the world',sub:'Five properties the exam loves',diagram:'railway',
 story:`Perspective is a bit of a trickster, honest about some things and misleading about others, so let's get to know its habits. Things far away look smaller, simply because depth sits underneath in our fraction. Straight lines stay reassuringly straight. But parallel lines quietly lean together and meet at a vanishing point, and a square tile can come out looking slanted, because lengths and angles are not preserved. The hardest truth to accept is that depth is thrown away entirely: a single pixel cannot tell you how far along its ray the real point sat. Drag the railway tracks and watch two lines that never meet in life shake hands on the photo.`,
 worked:`<div class="work"><div class="line">far = small ...... Z on the bottom of f·X/Z</div><div class="line">lines → lines .... straight stays straight</div><div class="line">parallels meet ... at a vanishing point</div><div class="line">angles/lengths ... NOT preserved</div><div class="res">depth lost ....... one pixel = a whole ray of 3D points</div></div>`,
 formula:{grid:`<p>These are properties, not a formula. The key one: a pixel (u,v) fixes a <b>ray</b> from the camera, not a point. Depth is gone.</p>`,
   symbols:[['vanishing point','where images of parallel world lines meet'],['ray','all 3D points that land on one pixel'],['horizon','where vanishing points of lines in one plane lie']]},
 why:['In x = f·X/Z, depth Z divides. Double the depth and the image halves — far looks small.','A straight 3D line projects to a straight 2D line (projection is linear up to the divide).','Parallel lines share a direction d; their images all pass through the one vanishing point of d, so they appear to meet.','Because only the ratio X/Z survives, the actual Z is unrecoverable from one image — depth is lost.'],
 mistakes:['Saying parallel lines stay parallel — only if they are parallel to the image plane.','Thinking one photo can give absolute depth — it cannot without extra information.','Assuming angles are preserved; they are not under perspective.'],
 exam:['"State three properties of perspective projection." (3 marks.)','"Why can a single image not recover depth? Explain in two sentences."'],
 practice:[say('Understanding checks.'),
  {t:'m',ask:'Under perspective, parallel world lines…',opts:['stay parallel always','meet at a vanishing point','disappear'],correct:1,
    hints:['Think railway tracks.','They lean together.','They meet at a vanishing point.'],diag:['Only if parallel to the image plane.',null,'They are still drawn, just converging.']},
  {t:'m',ask:'A single pixel (u,v) corresponds to…',opts:['exactly one 3D point','a whole ray of 3D points','nothing'],correct:1,
    hints:['Depth is lost.','Many depths, same pixel.','A ray.'],diag:['Depth is unknown, so not one point.',null,'It does map back — to a ray.']},
  say('Alone.'),
  {t:'m',ask:'Which is NOT preserved by perspective?',opts:['Straightness of lines','Angles between lines','That light travels straight'],correct:1,
    hints:['Two of these survive.','Squares become slanted.','Angles are not preserved.'],diag:['Straight stays straight.',null,'That is always true.']}]},

{id:'1.4',mod:1,n:'1.4',title:'Field of view',sub:'How much the camera sees',diagram:'fov',
 story:`Let's talk about how much of the world the camera can take in — its field of view. Think of it as the opening angle of a cone spreading out from the lens. Two things set that angle: how wide the sensor is, and the focal length. A long lens (large f) pinches the cone narrow, which is exactly what zooming in feels like, while a short lens throws it wide open. The half-angle is just the arctangent of half the sensor width over f, so the whole field of view is simply twice that. Slide f back and forth and watch the cone breathe in and out.`,
 worked:`<p>Sensor <span class="world">W = 640 px</span>, <kbd class="t">f = 400 px</kbd>.</p>
  <div class="work"><div class="line">half angle = atan( (W/2) / f )</div><div class="line">          = atan( 320 / 400 )</div><div class="line">          = atan( 0.8 )</div><div class="line">          = 38.66°</div><div class="res">FOV = 2 × 38.66° = 77.3°</div></div>`,
 formula:{grid:`${MX([['FOV','=','2 · atan( W / 2f )']])}`,
   symbols:[['W','sensor / image width (same units as f, e.g. pixels)'],['f','focal length'],['FOV','full angle of view']]},
 why:['Half the sensor, W/2, sits at depth f from the centre.','The ray to that edge makes an angle whose tangent is (W/2)/f.','So the half-angle = atan((W/2)/f).','The cone is symmetric, so the full field of view is twice the half-angle.'],
 mistakes:['Forgetting the factor 2 (that gives only half the FOV).','Using W instead of W/2 inside the atan.','Mixing units — W and f must match (both pixels, or both mm).'],
 exam:['"W = 640 px, f = 400 px. Find the horizontal FOV." (answer 77.3°.)','"What happens to the FOV if f doubles? Explain." (it roughly halves — narrower.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Compute W/2f for W = 640, f = 400.',fields:[['v','W/2f']],ans:[0.8],
    line:v=>`W/2f = 640/800 = ${fmt(v[0])}`,hints:['640 / (2·400).','640/800.','0.8.'],diag:v=>approx(v[0],1.6)?'You divided by f, not 2f. Use 640/(2·400).':null},
  {t:'n',ask:'Now FOV = 2·atan(0.8), in degrees (use a calculator).',fields:[['v','FOV°']],ans:[77.3],tol:0.02,
    line:v=>`FOV = 2·atan(0.8) = ${fmt(v[0])}°`,hints:['atan(0.8) ≈ 38.66°.','×2.','≈ 77.3°.'],diag:v=>approx(v[0],38.66,0.02)?'That is the half-angle. Multiply by 2.':null},
  say('Alone — reasoning.'),
  {t:'m',ask:'If f doubles (same sensor), the FOV…',opts:['doubles','gets narrower (roughly halves)','stays the same'],correct:1,
    hints:['Bigger f, smaller angle.','Zoom in.','Narrower.'],diag:['Opposite — bigger f narrows it.',null,'f changes the angle.']}]},
/* ---------- MODULE 2 ---------- */
{id:'2.1',mod:2,n:'2.1',title:'Add a 1, divide to come back',sub:'Scale does not matter',diagram:'homog',
 story:`Homogeneous coordinates sound intimidating, but the idea is really quite friendly: we simply glue one extra number onto the end of every point. A flat (x, y) becomes (x, y, 1), and a 3D point gains a 1 as well. The one surprise to grow comfortable with is that scaling all the numbers together does not change the point at all — (6, 4, 2) names the very same place as (3, 2, 1). To read the ordinary point back, you just divide everything by that last number. It is a small habit, but it is the key that later lets moving and perspective become plain matrix multiplication.`,
 worked:`<div class="work"><div class="line">(x, y)        → (x, y, 1)</div><div class="line">(9, 6, 3)     ÷ 3 → (3, 2)</div><div class="line">(X,Y,Z,w)     → (X/w, Y/w, Z/w)</div><div class="res">k·(x, y, w)   is the SAME point for any k ≠ 0</div></div>`,
 formula:{grid:`${MX([['(x, y, w)','→','(x/w, y/w)']],{cap:'divide by the last number'})}`,
   symbols:[['w','the extra homogeneous number (the "scale")'],['÷ w','how you return to the ordinary point'],['k','any non-zero scale; k·point is the same point']]},
 why:['A homogeneous point is really a whole ray through the origin.','Every point on that ray stands for the same ordinary point.','Picking the one where the last number is 1 gives the plain coordinates.','So dividing by the last number lands you on that w = 1 representative.'],
 mistakes:['Dividing by the first number instead of the last.','Forgetting to divide every coordinate, not just one.','Treating (6,4,2) and (3,2,1) as different points — they are identical.'],
 exam:['"Convert (6, 4, 2) to Cartesian." (answer (3,2).)','"Why is k(x,y,w) the same point for k ≠ 0?"'],
 practice:[say('With me.'),
  {t:'n',ask:'Convert (6, 4, 2) to a normal (x, y).',fields:[['x','x'],['y','y']],ans:[3,2],
    line:v=>`(6,4,2) ÷ 2 = (${fmt(v[0])}, ${fmt(v[1])})`,hints:['Divide by the last number, 2.','6/2 = 3.','(3, 2).'],diag:v=>approx(v[0],6)?'Divide by the last number (2), do not copy them.':null},
  {t:'n',ask:'His exercise: convert (6, −2, 2).',fields:[['x','x'],['y','y']],ans:[3,-1],
    line:v=>`(6,−2,2) ÷ 2 = (${fmt(v[0])}, ${fmt(v[1])})`,hints:['÷2.','6/2, −2/2.','(3, −1).'],diag:v=>null},
  say('Half alone.'),
  {t:'n',ask:'Convert the 3D point (9, −24, −3, −3).',fields:[['x','X'],['y','Y'],['z','Z']],ans:[-3,8,1],
    line:v=>`÷ −3 = (${fmt(v[0])}, ${fmt(v[1])}, ${fmt(v[2])})`,hints:['Divide all four by −3.','9/−3 = −3, −24/−3 = 8.','(−3, 8, 1).'],diag:v=>approx(v[0],-3)&&approx(v[1],-8)?'Watch signs: −24 / −3 = +8.':null},
  say('Alone.'),
  {t:'n',ask:'Convert (7, 39, 42, 3).',fields:[['x','X'],['y','Y'],['z','Z']],ans:[7/3,13,14],
    line:v=>`÷ 3 = (7/3, 13, 14)`,hints:['Divide by 3.','39/3 = 13, 42/3 = 14, 7/3 stays a fraction.','(7/3, 13, 14).'],diag:v=>approx(v[0],7)?'Divide every number by 3.':null},
  say('Extra — explain it to yourself.'),
  {t:'m',ask:'Why is (6, 4, 2) the same point as (3, 2, 1)?',opts:['They are different points','Scaling every coordinate by a non-zero number gives the same point','Only the last number matters'],correct:1,
    hints:['Think of a ray through the origin.','k·(x,y,w) ≡ (x,y,w) for any k ≠ 0.','(6,4,2) = 2·(3,2,1), so they are identical.'],diag:['They become identical after dividing.',null,'All three coordinates share the scale.']},
  {t:'n',ask:'Lift the flat point (2, 3) into homogeneous form (his exercise). Give all three numbers.',fields:[['a','x'],['b','y'],['c','w']],ans:[2,3,1],
    line:v=>`(2,3) → (2, 3, 1)`,hints:['Append a 1.','(x, y) → (x, y, 1).','(2, 3, 1).'],diag:v=>null}]},

{id:'2.2',mod:2,n:'2.2',title:'Points at infinity & vanishing points',sub:'When the last number is 0',diagram:'railway',
 story:`So what happens when that last number is zero? You cannot divide by zero, so there is no ordinary point to land on — and that is not a bug, it is a feature. A triple like (a, b, 0) stands for a pure direction, a point infinitely far away. This is exactly how a photograph shows parallel lines meeting at the horizon: the shared direction of the rails is a point at infinity, and its image is the vanishing point. So the next time two parallel lines seem to "meet", look for that quiet zero sitting at the end.`,
 worked:`<div class="work"><div class="line">(7, 39, 42, 0) → try to divide by 0 … impossible</div><div class="line">so it is a DIRECTION, not a place</div><div class="res">image of that direction = the vanishing point</div></div>`,
 formula:{grid:`<p>Last number 0 ⇒ point at infinity (a direction). Its image under the camera is a vanishing point.</p>`,
   symbols:[['(a,b,0)','a 2D direction / point at infinity'],['(a,b,c,0)','a 3D direction'],['vanishing point','where images of lines with that direction meet']]},
 why:['Slide along a ray toward the w = 0 plane: the ordinary point shoots off to infinity.','In the limit the last number is 0 and only the direction (a, b) remains.','Parallel lines share one direction, so they share one point at infinity.','The camera maps that single point to one pixel: the vanishing point.'],
 mistakes:['Calling (a,b,0) an error — it is a valid direction.','Trying to divide by 0 to "fix" it.','Thinking every line has a different vanishing point regardless of direction — same direction, same vanishing point.'],
 exam:['"What does a homogeneous point with last coordinate 0 represent?"','"(7,39,42,0) — point or direction?" (a direction.)'],
 practice:[say('Checks.'),
  {t:'m',ask:'(7, 39, 42, 0) is…',opts:['a normal point','a direction (point at infinity)','an error'],correct:1,
    hints:['Try dividing by the last number.','You cannot divide by 0.','A direction.'],diag:['You cannot divide by 0.',null,'It is valid and useful — a vanishing direction.']},
  {t:'m',ask:'On a photo, parallel rails meet at…',opts:['the camera centre','a vanishing point (a point at infinity)','the principal point'],correct:1,
    hints:['Think of the horizon.','Shared direction.','Vanishing point.'],diag:[null,null,'Only if they point along the axis.']}]},

{id:'2.3',mod:2,n:'2.3',title:'Lines as cross products',sub:'Join two points, meet two lines',diagram:'homog',
 story:`Here is a result I think you will find rather beautiful. In homogeneous coordinates a line is also three numbers, (a, b, c), meaning ax + by + c = 0 — so points and lines speak the same language. Two gifts follow from that. The line through two points is simply their cross product, and a point sits on a line exactly when their dot product is zero. By the very same move, the meeting point of two lines is the cross product of the two lines. Joining and meeting turn out to be the same operation — and if the answer ends in a zero, the lines were parallel and they meet at infinity.`,
 worked:`<p>Line through (4, 1) and (4, 2):</p>
  <div class="work"><div class="line">(4,1,1) × (4,2,1)</div><div class="line">= (1·1 − 1·2,  1·4 − 4·1,  4·2 − 1·4)</div><div class="res">= (−1, 0, 4)   →  −x + 4 = 0  →  x = 4</div></div>`,
 formula:{grid:`${MX([['l','=','p × q'],['p·l','=','0'],['x','=','l₁ × l₂']],{cap:'join, on-line test, and meet'})}
   <p class="plain">Cross product: (d,e,f)×(r,s,t) = (et − sf, −(dt − rf), ds − re).</p>`,
   symbols:[['l = (a,b,c)','a line ax + by + c = 0'],['p × q','the line joining points p and q'],['l·p = 0','p lies on line l'],['l₁ × l₂','the intersection point of two lines']]},
 why:['A line l must satisfy l·p = 0 and l·q = 0 for both points.','The cross product p × q is perpendicular to both, so (p×q)·p = 0 and (p×q)·q = 0.','Therefore l = p × q is exactly the line through both.','By duality the same cross product of two lines gives the point on both — their intersection.'],
 mistakes:['Mixing up the sign of the middle term of the cross product.','Forgetting to append the 1 before crossing.','Not dividing the intersection point by its last number at the end.'],
 exam:['"Line through (4,1) and (4,2)?" (answer (−1,0,4), x = 4.)','"Intersect 3x−y+7=0 and 2x−y+1=0." (answer (−6,−11).)'],
 practice:[say('With me — the vertical line.'),
  {t:'n',ask:'Cross (4,1,1) × (4,2,1). Give (a, b, c).',fields:[['a','a'],['b','b'],['c','c']],ans:[-1,0,4],scale:true,
    line:v=>`(4,1,1)×(4,2,1) = (−1, 0, 4) → x = 4`,hints:['Use (et−sf, −(dt−rf), ds−re) with p=(4,1,1), q=(4,2,1).','a = 1·1 − 1·2 = −1; b = −(4·1 − 1·4) = 0.','c = 4·2 − 1·4 = 4. So (−1, 0, 4).'],diag:v=>approx(v[1],1)?'Middle term: −(4·1 − 1·4) = 0, so b = 0.':null},
  say('Half alone — his exercise.'),
  {t:'n',ask:'Line through (1, 2) and (4, 3). Give (a, b, c).',fields:[['a','a'],['b','b'],['c','c']],ans:[-1,3,-5],scale:true,
    line:v=>`(1,2,1)×(4,3,1) = (−1, 3, −5) → −x + 3y − 5 = 0`,hints:['p=(1,2,1), q=(4,3,1).','a = 2·1−1·3 = −1; b = −(1·1−1·4) = 3.','c = 1·3−2·4 = −5. (−1, 3, −5).'],diag:v=>null},
  say('Alone — intersect two lines.'),
  {t:'n',ask:'Meet 3x−y+7=0 and 2x−y+1=0 (lines (3,−1,7) and (2,−1,1)). Give the ordinary point (x, y).',fields:[['x','x'],['y','y']],ans:[-6,-11],
    line:v=>`(3,−1,7)×(2,−1,1) = (6, 11, −1) ÷ −1 = (−6, −11)`,hints:['Cross the two line vectors, then divide by the last number.','Cross = (6, 11, −1).','÷ −1 → (−6, −11).'],diag:v=>approx(v[0],6)?'Almost — now divide (6,11,−1) by its last number −1.':null},
  say('Extra — the duality, and parallel lines.'),
  {t:'m',ask:'Joining two points and meeting two lines both use…',opts:['the dot product','the cross product','matrix inversion'],correct:1,
    hints:['Same operation, different inputs.','Cross product for both.','l = p×q and x = l₁×l₂.'],diag:['Dot product tests on-a-line (l·p=0).',null,'No inverse needed.']},
  {t:'n',ask:'Meet the parallel lines 3x−y+7=0 and 3x−y−3=0 (vectors (3,−1,7),(3,−1,−3)): give the cross product (a, b, c).',fields:[['a','a'],['b','b'],['c','c']],ans:[10,30,0],scale:true,
    line:v=>`(3,−1,7)×(3,−1,−3) = (10, 30, 0) — last number 0 → meet at infinity`,hints:['Use (et−sf, −(dt−rf), ds−re).','a = (−1)(−3)−7(−1) = 10; b = −(3·−3 − 7·3) = 30.','c = 3·−1 − (−1)·3 = 0. The 0 means parallel.'],diag:v=>approx(v[2],0)?null:'The last number should be 0 (they are parallel): c = 3·(−1) − (−1)·3 = 0.'}]},

{id:'2.4',mod:2,n:'2.4',title:'Why bother? The pinhole as one matrix',sub:'Division becomes multiplication',diagram:'pipeline',
 story:`Let me show you the payoff for all this careful bookkeeping. The pinhole rule x = fX/Z needs a division, and matrices, left to themselves, cannot divide. Homogeneous coordinates slip the division in through a side door: a matrix hands you (fX, fY, Z), and our habit of "divide by the last number" quietly performs the perspective divide for free. So the entire pinhole camera becomes one matrix multiply followed by a divide — and translation, which also resisted matrices, now comes along as an ordinary multiply too. That convenience is the whole reason we have been carrying that extra 1 around.`,
 worked:`<div class="work"><div class="line">λ (x, y, 1) = diag(f, f, 1) · [I | 0] · (X, Y, Z, 1)ᵀ</div><div class="line">[I|0]·(X,Y,Z,1) = (X, Y, Z)</div><div class="line">diag(f,f,1)·(X,Y,Z) = (fX, fY, Z)</div><div class="res">÷ last number Z → (fX/Z, fY/Z) ✓ the pinhole rule</div></div>`,
 formula:{grid:`${MX([['f','0','0','0'],['0','f','0','0'],['0','0','1','0']],{cap:'P = diag(f,f,1)[I | 0]  — one matrix, 1 DOF (just f)'})}`,
   symbols:[['[I | 0]','drops the homogeneous 1, keeps (X,Y,Z)'],['diag(f,f,1)','scales x,y by f, leaves depth'],['λ','the scale = depth Z; dividing by it does perspective']]},
 why:['Put (X,Y,Z,1) in homogeneous form.','Multiply by [I|0] to get (X,Y,Z).','Multiply by diag(f,f,1) to get (fX, fY, Z).','Divide by the last number Z — the homogeneous rule — and you recover (fX/Z, fY/Z).'],
 mistakes:['Forgetting the final divide — the matrix alone gives (fX,fY,Z), not the pixel.','Thinking the matrix "does" the division; the homogeneous convention does.','Dropping the 1 from the world point.'],
 exam:['"Write the pinhole projection as a 3×4 matrix." ','"Where does the perspective division happen in λ(x,y,1)=P X?"'],
 practice:[say('Check.'),
  {t:'n',ask:'diag(2,2,1)·[I|0]·(3, 1, 6, 1) gives (a, b, c). Then divide to get the pixel (x, y). Give x, y.',fields:[['x','x'],['y','y']],ans:[1,1/3],
    line:v=>`(6, 2, 6) ÷ 6 = (1, 1/3)`,hints:['First get (2·3, 2·1, 6) = (6, 2, 6).','Divide by the last number 6.','(1, 1/3).'],diag:v=>approx(v[0],6)?'You stopped before the divide. ÷ 6.':null},
  {t:'m',ask:'In λ(x,y,1) = P·X, the scale λ equals…',opts:['the focal length','the depth Z','always 1'],correct:1,
    hints:['It is the last number before dividing.','Equals Z.','Depth.'],diag:['f is inside P.',null,'Only after dividing.']}]},

{id:'2.5',mod:2,n:'2.5',title:'Affine maps send lines to lines',sub:'A tiny three-line proof',diagram:'affine',
 story:`Let's prove a small, satisfying fact: an affine map — stretch, rotate, shift, written x' = A x + t — always sends straight lines to straight lines. The argument is only three lines long, so stay with me. Picture a line as a point sliding along at a steady pace. Apply the map, and because it is linear plus a constant, the result also slides at a steady pace — which is, again, a straight line. No curve can sneak in, which is exactly why rotations, scalings, shears and translations all keep our lines honest.`,
 worked:`<div class="work"><div class="line">a line: p(s) = p₀ + s·d   (s slides along direction d)</div><div class="line">apply map: x'(s) = A(p₀ + s·d) + t</div><div class="line">        = (A p₀ + t) + s·(A d)</div><div class="res">= q₀ + s·d'   — a straight line again ✓</div></div>`,
 formula:{grid:`${MX([['1','0','tx'],['0','1','ty'],['0','0','1']],{cap:'translation T (homogeneous)'})}
   ${MX([['cos t','−sin t','0'],['sin t','cos t','0'],['0','0','1']],{cap:'point-rotation R'})}`,
   symbols:[['A','the linear part (rotate/scale/shear)'],['t','the translation (shift)'],['affine','x\' = A x + t — keeps lines straight']]},
 why:['Write the line as p₀ + s·d, a point moving steadily with parameter s.','Apply x\' = A x + t to every point.','Linearity splits it: x\'(s) = (A p₀ + t) + s·(A d).','That is again "start point plus s times a fixed direction" — a straight line.'],
 mistakes:['Thinking perspective is affine — it is not (it has the divide), so it can bend things differently.','Believing translation needs no homogeneous form — as a plain multiply it does.','Assuming A d could curve — a constant matrix times a direction is a constant direction.'],
 exam:['"Prove an affine map takes lines to lines." (3 marks.)','"Write the 3×3 homogeneous matrices for translation and rotation."'],
 practice:[say('Check.'),
  {t:'m',ask:'Which map is NOT affine (can it bend a line differently)?',opts:['Rotation','Translation','Perspective projection'],correct:2,
    hints:['Two are x\'=Ax+t.','Which one has a divide?','Perspective.'],diag:['Rotation is affine.','Translation is affine.',null]},
  {t:'m',ask:'Why does translation need homogeneous coordinates to be a matrix?',opts:['It is a non-linear scaling','Adding a constant is not a plain 2×2 multiply','It changes the focal length'],correct:1,
    hints:['A plain matrix multiply cannot add a constant.','The +t part.','Homogeneous adds a column for it.'],diag:['It is linear, just off-origin.',null,'Nothing to do with f.']}]},

/* ---------- MODULE 3 ---------- */
{id:'3.1',mod:3,n:'3.1',title:'Rotation in 2D: rows are the camera’s axes',sub:'Read rows across',diagram:'rotmap',
 story:`Rotation matrices look fierce at first, but let me reassure you — one is really just a small table whose rows are the camera's own arrows, written in the world's directions. To find where a point sits for the camera, you simply ask each arrow, "how many steps along you is the point?", and that question is answered by a row times the point. The red row is the camera's right, the blue row its forward. Multiply each row by the point, add up, and you are done — that is the whole operation. Turn the dial and watch the point settle into the camera's own view.`,
 worked:`<p>R rows <span class="xr">(0, 1)</span>, <span class="zb">(−1, 0)</span>; point <span class="pt">(3, 0)</span>.</p>
  <div class="work"><div class="line">right row · point = 0·3 + 1·0 = 0</div><div class="line">fwd   row · point = −1·3 + 0·0 = −3</div><div class="res">X_cam = (0, −3)</div></div>
  <p class="plain">Read ROWS across, never columns down.</p>`,
 formula:{grid:`${MX([['X_cam'],['='],['R · X_world']],{cap:'row × point, then add'})}`,
   symbols:[['R rows','the camera\'s axes, in world directions'],['row · point','steps along that axis'],['X_cam','the point as the camera sees it']]},
 why:['The camera has its own right and forward arrows.','Each arrow is a unit direction written in world coordinates — that is one row of R.','Projecting the point onto an arrow is the dot product of that row with the point.','Stacking the dot products gives X_cam = R·X_world.'],
 mistakes:['Reading the matrix down the columns (that uses the transpose).','Writing the point back out instead of multiplying by the rows.','Forgetting to add the products within a row.'],
 exam:['"R rows (0,1),(−1,0), point (0,2). Camera coordinates?" (answer (2,0).)','"What do the rows of a rotation matrix mean?"'],
 practice:[say('With me — dot each row.'),
  {t:'n',ask:'R rows (0,1),(−1,0), point (0,2). Row 1 (right) · point = ?',fields:[['v','right']],ans:[2],
    line:v=>`right row (0,1)·(0,2) = 0·0 + 1·2 = ${fmt(v[0])}`,hints:['0·0 + 1·2.','= 2.','Right = 2.'],diag:v=>approx(v[0],0)?'Multiply term-by-term: 0·0 + 1·2 = 2.':null},
  {t:'n',ask:'Row 2 (forward) · point = ?',fields:[['v','forward']],ans:[0],
    line:v=>`fwd row (−1,0)·(0,2) = −1·0 + 0·2 = ${fmt(v[0])}`,hints:['−1·0 + 0·2.','= 0.','Forward = 0.'],diag:v=>approx(v[0],-2)?'(−1)·0 = 0, not −2. The 0 is the second term.':null},
  say('Alone — put it together (new numbers each try).'),
  {t:'n',ask:'R rows (0,1),(−1,0), point (0,2). Give X_cam = (right, forward).',fields:[['a','right'],['b','forward']],ans:[2,0],
    line:v=>`X_cam = (${fmt(v[0])}, ${fmt(v[1])})`,hints:['Row 1·point, then row 2·point.','(0,1)·(0,2)=2.','(2, 0).'],diag:v=>approx(v[0],-2)?'You read the columns (transpose). Read ROWS across.':null,
    regen:()=>{const bx=[0,1,2,3][(Math.random()*4)|0],by=[1,2,3][(Math.random()*3)|0];
      return{ask:`R rows (0,1),(−1,0), point (${bx},${by}). Give X_cam = (right, forward).`,ans:[by,-bx],fields:[['a','right'],['b','forward']],line:v=>`X_cam = (${by}, ${-bx})`};}},
  say('Extra — rows vs columns.'),
  {t:'m',ask:'Computing R·X means…',opts:['dot each COLUMN of R with the point','dot each ROW of R with the point','multiply only matching entries'],correct:1,
