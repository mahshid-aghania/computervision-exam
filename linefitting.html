function confetti(){const c=$('#confetti');c.classList.remove('hidden');const ctx=c.getContext('2d');
  const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cols=['#e23b2e','#179a5a','#1f6fe0','#ef8a12','#6b46ff','#f0a500'];
  const P=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,
    g:.33+Math.random()*.18,s:5+Math.random()*7,c:cols[(Math.random()*cols.length)|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let t=0;(function run(){t++;ctx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
    if(t<120)requestAnimationFrame(run);else c.classList.add('hidden');})();}

const DIAGRAMS={};
function ctl(id,label,min,max,step,val){return `<div class="ctl"><span class="cl">${label} <b id="${id}o">${val}</b></span>
  <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;}
function grid(vals,cls){
  const rows=vals.length,cols=vals[0].length;
  let h=`<div class="ngrid" style="grid-template-columns:repeat(${cols},auto)">`;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const extra=cls?cls(r,c,vals[r][c]):'';h+=`<div class="ncell ${extra}">${vals[r][c]}</div>`;}
  h+=`</div>`;return h;
}
/* shared data + plotting helpers for line fitting */
const TAXI=[[1,5],[2,8],[3,8],[4,11]];
function PLOT(xmin,xmax,ymin,ymax){const L=46,R=14,T=12,B=34,W=440,H=300;
  return {W,H,L,R,T,B,xmin,xmax,ymin,ymax,
    X:x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),
    Y:y=>H-B-(y-ymin)/(ymax-ymin)*(H-B-T)};}
function axes(P,xlab,ylab){const cx=(P.L+P.W-P.R)/2,cy=(P.T+P.H-P.B)/2;
  return `<line x1="${P.L}" y1="${P.H-P.B}" x2="${P.W-P.R}" y2="${P.H-P.B}" stroke="var(--line)"/>
    <line x1="${P.L}" y1="${P.T}" x2="${P.L}" y2="${P.H-P.B}" stroke="var(--line)"/>
    <text x="${cx}" y="${P.H-6}" font-size="11" text-anchor="middle" fill="var(--muted)">${xlab}</text>
    <text x="13" y="${cy}" font-size="11" text-anchor="middle" fill="var(--muted)" transform="rotate(-90 13 ${cy})">${ylab}</text>`;}
const gauss=(x,mu,sig)=>Math.exp(-(x-mu)*(x-mu)/(2*sig*sig))/(sig*Math.sqrt(2*Math.PI));
const sigm=z=>1/(1+Math.exp(-z));
function solveLin(A,b){const n=b.length;const M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];
    const pv=M[c][c];if(Math.abs(pv)<1e-12)continue;for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c]/pv;for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];}}
  return M.map((r,i)=>r[n]/(M[i][i]||1e-12));}
function polyfit(xs,ys,deg){const n=deg+1;const A=Array.from({length:n},()=>Array(n).fill(0));const bv=Array(n).fill(0);
  for(let i=0;i<xs.length;i++){const px=[];let p=1;for(let k=0;k<2*n;k++){px.push(p);p*=xs[i];}
    for(let a=0;a<n;a++){for(let b2=0;b2<n;b2++)A[a][b2]+=px[a+b2];bv[a]+=px[a]*ys[i];}}
  return solveLin(A,bv);}
function polyval(c,x){let v=0,p=1;for(let k=0;k<c.length;k++){v+=c[k]*p;p*=x;}return v;}

DIAGRAMS.costbowl=(box)=>{
  const D=TAXI;
  box.innerHTML=`<div class="plain">Every (θ₀, θ₁) pair gives one cost. Low cost is <span class="yg">green</span>, high cost is pale. The bowl has exactly one bottom — the best line. Walk the ball toward it.</div>
   <svg viewBox="0 0 320 300" id="cbS"></svg>
   <div class="controls">${ctl('cbB','θ₀',0,7,0.25,5.5)}${ctl('cbM','θ₁',0,4,0.25,0.75)}</div>
   <div class="readout" id="cbO"></div>`;
  const b0min=0,b0max=7,b1min=0,b1max=4,gx=24,gy=24,W=250,H=236,L=46,T=10;
  function cost(b,m){let C=0;D.forEach(([x,y])=>{const d=y-(b+m*x);C+=d*d;});return C;}
  function draw(){const b=+$('#cbB',box).value,m=+$('#cbM',box).value;$('#cbBo',box).textContent=b.toFixed(2);$('#cbMo',box).textContent=m.toFixed(2);
    let g='',cmax=0;const G=[];
    for(let i=0;i<gx;i++){G[i]=[];for(let j=0;j<gy;j++){const bb=b0min+(i+0.5)/gx*(b0max-b0min),mm=b1min+(j+0.5)/gy*(b1max-b1min);const C=cost(bb,mm);G[i][j]=C;if(C>cmax)cmax=C;}}
    for(let i=0;i<gx;i++)for(let j=0;j<gy;j++){const t=1-Math.min(1,Math.sqrt(G[i][j]/cmax));
      g+=`<rect x="${L+i/gx*W}" y="${T+(gy-1-j)/gy*H}" width="${W/gx+0.8}" height="${H/gy+0.8}" fill="color-mix(in srgb,var(--yg) ${Math.round(t*80)}%,var(--surface))"/>`;}
    const bx=L+(b-b0min)/(b0max-b0min)*W, by=T+(1-(m-b1min)/(b1max-b1min))*H;
    const tx=L+(3.5-b0min)/(b0max-b0min)*W, ty=T+(1-(1.8-b1min)/(b1max-b1min))*H;

    g+=`<circle cx="${bx}" cy="${by}" r="7" fill="var(--accent)" stroke="#fff" stroke-width="1.5"/>`;

};

/* (f) polynomial fit: underfit -> good -> overfit */
DIAGRAMS.polyfit=(box)=>{
  const tr=[[0.3,1.1],[1.0,2.6],[1.8,2.2],[2.6,3.6],[3.4,3.1],[4.2,4.6],[4.9,4.2]];
  const te=[[0.7,1.9],[2.2,2.9],[3.0,3.3],[3.8,3.9],[4.6,4.4]];
  box.innerHTML=`<div class="plain">Raise the degree. Low degree <b>underfits</b> (misses the shape); very high degree <b>overfits</b> (wiggles through every training dot but fails the test dots).</div>
   <svg viewBox="0 0 440 300" id="pfS"></svg>
   <div class="controls">${ctl('pfD','polynomial degree',1,9,1,1)}</div>
   <div class="readout" id="pfO"></div>`;
  const P=PLOT(0,5.2,0,6);
  function rmse(c,pts){let s=0;pts.forEach(([x,y])=>{const d=y-polyval(c,x);s+=d*d;});return Math.sqrt(s/pts.length);}
  function draw(){const deg=+$('#pfD',box).value;$('#pfDo',box).textContent=deg;
    const c=polyfit(tr.map(p=>p[0]),tr.map(p=>p[1]),deg);
    let path='';for(let i=0;i<=120;i++){const x=i/120*5.2;const y=Math.max(-1,Math.min(7,polyval(c,x)));path+=(i?'L':'M')+P.X(x).toFixed(1)+' '+P.Y(y).toFixed(1)+' ';}
    let g=`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
    tr.forEach(([x,y])=>g+=`<circle cx="${P.X(x)}" cy="${P.Y(y)}" r="5" fill="var(--world)"/>`);
    te.forEach(([x,y])=>g+=`<circle cx="${P.X(x)}" cy="${P.Y(y)}" r="5" fill="none" stroke="var(--zb)" stroke-width="2"/>`);
    $('#pfS',box).innerHTML=axes(P,'x','y')+g;
    const et=rmse(c,tr),ev=rmse(c,te);
    const tag=deg<=1?'underfitting — too simple':deg>=7?'overfitting — memorising noise':'about right';
    $('#pfO',box).innerHTML=`<span>training error = <b>${et.toFixed(2)}</b></span><span>test error = <b>${ev.toFixed(2)}</b></span><span>● training  ○ test</span>
      <span style="width:100%" class="plain">${tag}. Training error always falls; test error is the one that matters.</span>`;}
  $('#pfD',box).oninput=draw;draw();
};

   <svg viewBox="0 0 440 300" id="gbS"></svg>
   <div class="controls">${ctl('gb0','w₁',-3,3,0.5,1)}${ctl('gb1','w₂',-3,3,0.5,2)}${ctl('gb2','w₃',-3,3,0.5,-1)}${ctl('gb3','w₄',-3,3,0.5,2)}</div>`;
  const P=PLOT(0,5,-3,4);const mus=[0.8,2,3,4.2];const sg=0.6;
  function draw(){const w=[+$('#gb0',box).value,+$('#gb1',box).value,+$('#gb2',box).value,+$('#gb3',box).value];
    w.forEach((v,i)=>$('#gb'+i+'o',box).textContent=v);
    let g='';mus.forEach((mu,i)=>{let p='';for(let k=0;k<=80;k++){const x=k/80*5;const y=w[i]*Math.exp(-(x-mu)*(x-mu)/(2*sg*sg));p+=(k?'L':'M')+P.X(x).toFixed(1)+' '+P.Y(y).toFixed(1)+' ';}
      g+=`<path d="${p}" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`;});

    g+=`<path d="${ps}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;

/* (h) ridge: delta^2 shrinks the slope */
DIAGRAMS.ridge=(box)=>{
  const D=[[0,1],[1,3],[2,5]];
  box.innerHTML=`<div class="plain">Data (0,1), (1,3), (2,5) — a perfect line of slope 2. Turn up the penalty δ² and watch ridge pull the slope toward 0 (it "shrinks" the weights).</div>
   <svg viewBox="0 0 440 300" id="rgS"></svg>
   <div class="controls">${ctl('rgD','penalty δ²',0,6,0.5,0)}</div>
   <div class="readout" id="rgO"></div>`;
  const P=PLOT(-0.3,2.3,0,6);
  function draw(){const d2=+$('#rgD',box).value;$('#rgDo',box).textContent=d2;
    const A=[[3+d2,3],[3,5+d2]],bv=[9,13];const th=solveLin(A,bv);const b=th[0],m=th[1];

/* (l) 2D gaussian covariance ellipse */
DIAGRAMS.gauss2d=(box)=>{
  box.innerHTML=`<div class="plain">A 2D Gaussian is an ellipse of likely points. σₓ and σ_y stretch it; the correlation ρ tilts it. ρ = 0 → axis-aligned; ρ ≠ 0 → x and y lean together.</div>
   <svg viewBox="0 0 320 300" id="g2S"></svg>
   <div class="controls">${ctl('g2x','σₓ',0.4,2.5,0.1,1)}${ctl('g2y','σ_y',0.4,2.5,0.1,1)}${ctl('g2r','ρ  correlation',-0.9,0.9,0.1,0)}</div>
   <div class="readout" id="g2O"></div>`;
  const cx=160,cy=150,sc=46;

    $('#g2xo',box).textContent=sx.toFixed(1);$('#g2yo',box).textContent=sy.toFixed(1);$('#g2ro',box).textContent=r.toFixed(1);
    // covariance matrix [[sx^2, r sx sy],[r sx sy, sy^2]]; draw 3 contour ellipses via eigen-decomposition
    const a=sx*sx,b=r*sx*sy,d=sy*sy;const tr=a+d,det=a*d-b*b;const disc=Math.sqrt(Math.max(0,tr*tr/4-det));
    const l1=tr/2+disc,l2=tr/2-disc;const ang=Math.atan2(l1-a,b)||0;const th=b===0?(a>=d?0:Math.PI/2):ang;
    let g='';[1,2,3].forEach(k=>{const rx=sc*k*Math.sqrt(Math.max(0.01,l1)),ry=sc*k*Math.sqrt(Math.max(0.01,l2));
      g+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="color-mix(in srgb,var(--accent) ${18-k*4}%,transparent)" stroke="var(--accent)" stroke-width="1.5" transform="rotate(${deg(-th)} ${cx} ${cy})"/>`;});
    g+=`<line x1="20" y1="${cy}" x2="300" y2="${cy}" stroke="var(--line)"/><line x1="${cx}" y1="20" x2="${cx}" y2="280" stroke="var(--line)"/><circle cx="${cx}" cy="${cy}" r="3" fill="var(--zb)"/>`;
    $('#g2S',box).innerHTML=g;
    $('#g2O',box).innerHTML=`<span>cov = [ ${a.toFixed(2)} , ${b.toFixed(2)} ; ${b.toFixed(2)} , ${d.toFixed(2)} ]</span><span style="width:100%" class="plain">The off-diagonal ${b.toFixed(2)} is the covariance — zero means a round, upright ellipse.</span>`;}

/* (m) likelihood game */
DIAGRAMS.likegame=(box)=>{

    // likelihood curve
    const Q={W:440,H:120,L:46,R:14,T:10,B:28};const QX=t=>Q.L+t/2*(Q.W-Q.L-Q.R),QY=v=>Q.H-Q.B-v/0.06*(Q.H-Q.B-Q.T);
    let lp='';for(let i=0;i<=120;i++){const t=i/120*2;lp+=(i?'L':'M')+QX(t).toFixed(1)+' '+QY(Math.min(0.06,like(t))).toFixed(1)+' ';}

      <circle cx="${QX(th)}" cy="${QY(Math.min(0.06,like(th)))}" r="5" fill="var(--accent)"/><text x="${QX(1)}" y="${Q.T+11}" font-size="10" text-anchor="middle" fill="var(--good)">peak θ = 1</text>

/* (p) KL divergence, not symmetric */
DIAGRAMS.kl=(box)=>{
  let P=[0.5,0.5],Q=[0.9,0.1];
  box.innerHTML=`<div class="plain">Two coins P and Q. KL divergence measures how surprised you are using Q when the truth is P. Swap them and the number changes — KL is <b>not</b> a symmetric distance.</div>
   <svg viewBox="0 0 440 200" id="klS"></svg>
   <div class="toolrow"><button class="btn sm" id="klSwap">⇄ swap P and Q</button></div>
   <div class="readout" id="klO"></div>`;
  function kl(p,q){let s=0;for(let i=0;i<p.length;i++){if(p[i]>0)s+=p[i]*Math.log(p[i]/q[i]);}return s;}
  function draw(){let g='';const bw=70;
    [['P',P,60,'var(--accent)'],['Q',Q,250,'var(--zb)']].forEach(([lab,dist,x0,col])=>{
      g+=`<text x="${x0+bw}" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="${col}">${lab}</text>`;
      dist.forEach((v,i)=>{const hh=v*120;g+=`<rect x="${x0+i*bw}" y="${170-hh}" width="${bw-10}" height="${hh}" rx="4" fill="${col}" opacity="0.8"/><text x="${x0+i*bw+(bw-10)/2}" y="186" font-size="11" text-anchor="middle" fill="var(--muted)">${v}</text>`;});});
    $('#klS',box).innerHTML=g;
    $('#klO',box).innerHTML=`<span>D(P‖Q) = <b>${kl(P,Q).toFixed(3)}</b></span><span>D(Q‖P) = <b>${kl(Q,P).toFixed(3)}</b></span><span style="width:100%" class="plain">0.511 ≠ 0.368 (nats) — order matters. KL ≥ 0 always, and = 0 only when the two match.</span>`;}
  $('#klSwap',box).onclick=()=>{[P,Q]=[Q,P];draw();};
  draw();
};

/* (t) three models as tiny networks */
DIAGRAMS.network=(box)=>{
  box.innerHTML=`<div class="plain">All three models are the same tiny network — inputs, weights, a sum — with a different last step. Tap to switch.</div>
   <div class="toolrow"><span class="seg"><button id="nw0" class="on">linear</button><button id="nw1">logistic</button><button id="nw2">softmax</button></span></div>

    out.forEach((o,i)=>g+=`<circle cx="${o[0]}" cy="${o[1]}" r="16" fill="color-mix(in srgb,var(--accent) 22%,var(--surface))" stroke="var(--accent)" stroke-width="2"/><text x="${o[0]}" y="${o[1]+4}" font-size="11" text-anchor="middle" fill="var(--accent)">${mode===2?'y'+(i+1):'ŷ'}</text>`);
    g+=`<text x="220" y="22" font-size="12" text-anchor="middle" fill="var(--muted)">last step: <tspan fill="var(--accent)" font-weight="700">${info[mode][0]}</tspan></text>`;
    $('#nwS',box).innerHTML=g;
    $('#nwO',box).innerHTML=`<span>output: <b>${info[mode][1]}</b></span><span>loss: ${info[mode][2]}</span><span style="width:100%" class="plain">gives ${info[mode][3]}. Every loss here is a negative log-likelihood.</span>`;}
  [0,1,2].forEach(i=>$('#nw'+i,box).onclick=()=>{mode=i;[0,1,2].forEach(j=>$('#nw'+j,box).classList.toggle('on',j===i));draw();});
  draw();
};
/* (n) MLE line: bells on each point, C and -logL together */
DIAGRAMS.mleline=(box)=>{
  const D=TAXI;
  box.innerHTML=`<div class="plain">Each receipt gets a sideways bell centred on the line. Moving the line changes every height. The cost C and the negative log-likelihood −ln L reach their bottom at the <b>same</b> line. Changing σ does not move it.</div>
   <svg viewBox="0 0 440 300" id="mlS"></svg>
   <div class="controls">${ctl('mlB','θ₀',0,8,0.1,3.5)}${ctl('mlM','θ₁',0,4,0.1,1.8)}${ctl('mlSg','σ  noise width',0.5,3,0.1,1)}</div>
   <div class="readout" id="mlO"></div>`;
  const P=PLOT(0,5,0,13);
  function draw(){const b=+$('#mlB',box).value,m=+$('#mlM',box).value,sg=+$('#mlSg',box).value;
    $('#mlBo',box).textContent=b.toFixed(1);$('#mlMo',box).textContent=m.toFixed(1);$('#mlSgo',box).textContent=sg.toFixed(1);
    let g=`<line x1="${P.X(0)}" y1="${P.Y(b)}" x2="${P.X(5)}" y2="${P.Y(b+m*5)}" stroke="var(--accent)" stroke-width="2.5"/>`;
    let C=0;D.forEach(([x,y])=>{const fx=b+m*x;C+=(y-fx)*(y-fx);
      let bell='';for(let k=-24;k<=24;k++){const yy=fx+k/24*3*sg;const hh=gauss(yy,fx,sg)*sg*34;bell+=(k===-24?'M':'L')+(P.X(x)+hh).toFixed(1)+' '+P.Y(yy).toFixed(1)+' ';}
      g+=`<path d="${bell}" fill="none" stroke="var(--pt)" stroke-width="1.3" opacity="0.8"/>`;
      g+=`<line x1="${P.X(x)}" y1="${P.Y(y)}" x2="${P.X(x)}" y2="${P.Y(fx)}" stroke="var(--xr)" stroke-width="2"/><circle cx="${P.X(x)}" cy="${P.Y(y)}" r="5.5" fill="var(--world)" stroke="var(--surface)" stroke-width="1.5"/>`;});
    $('#mlS',box).innerHTML=axes(P,'x','y')+g;
    const nll=(D.length/2)*Math.log(2*Math.PI*sg*sg)+C/(2*sg*sg);
    $('#mlO',box).innerHTML=`<span>cost C = <b>${C.toFixed(2)}</b></span><span>−ln L = <b>${nll.toFixed(2)}</b></span><span>both bottom at θ = (3.5, 1.8)</span><span style="width:100%" class="plain">Slide σ: −ln L changes its value but the best line stays put. Least squares = maximum likelihood.</span>`;}
  $$('#mlB,#mlM,#mlSg',box).forEach(i=>i.oninput=draw);draw();
};

{id:'1.1',mod:1,n:'1.1',title:'What machine learning is',sub:'Learning a rule from examples',diagram:'mltypes',
 story:`Let us begin very gently. Machine learning means learning a rule from examples instead of being told the rule. Imagine you keep taxi receipts: one km cost $5, two km cost $8, and so on. Nobody told you the taxi's price list, but from these examples you can work out the rule — a start fee plus a price for each km. That is exactly what this chapter does. When the examples come with their answers, like receipts with prices, we call it supervised learning, and this chapter lives there. If the answer we predict is a number, like a price, it is regression; if it is a category, like "cat or dog", it is classification. Everything we do is: collect examples, pick a shape of rule, and tune the rule so it matches the examples well.`,
 worked:`<div class="work"><div class="line">Our running example — four taxi receipts:</div>
<div class="line">   (1 km, $5),  (2 km, $8),  (3 km, $8),  (4 km, $11)</div>
<div class="line">We believe the rule has the shape:  fare = start fee + price-per-km × km</div>
<div class="line res">   f(x) = θ₀ + θ₁ x    (θ₀ = start fee,  θ₁ = price per km)</div>
<div class="line" style="color:var(--muted)">In plain words: we guess the SHAPE, then let the data pick θ₀ and θ₁.</div></div>`,
 formula:{grid:MX([['examples','(x⁽ⁱ⁾, y⁽ⁱ⁾),','i = 1 … N']]),
  symbols:[['x⁽ⁱ⁾','the i-th input (kilometres on receipt i). The (i) is a label, not a power'],['y⁽ⁱ⁾','the i-th answer (the dollars on receipt i)'],['N','how many examples we have'],['f(x) = θ₀ + θ₁x','the shape of rule we will fit']]},
 why:['We rarely know the true rule, but we often have examples of it in action.','If we pick a sensible shape (here, a straight line), the examples can pin down its few numbers.','Supervised learning just means those examples carry their answers, so we can measure how wrong a guess is.','Predicting a number is regression; predicting a class is classification — same recipe, different last step.'],
 mistakes:['Reading x⁽ⁱ⁾ as "x to the power i". The little (i) in brackets is only a name for which example.','Thinking the machine invents the shape of the rule. We choose the shape; the data chooses the numbers inside it.','Mixing up regression (a number) and classification (a class).'],
 exam:['"Name the three families of machine learning and say which one line fitting belongs to." (supervised; and it is regression).','"Give the statistics word for each ML word: weights, learning." (parameters; fitting / estimation).'],
 practice:[
  say('Stage 1 — with me: get comfortable with the words.'),
  {t:'m',ask:'Our taxi receipts come WITH their prices. Which family is this?',opts:['Supervised learning','Unsupervised learning','Reinforcement learning'],correct:0,
   hints:['The examples carry their answers (the fares).','"With labels" = supervised.','Supervised: we can measure the error because the true answer is known.'],
   diag:[null,'Unsupervised has no answers attached — but our receipts do have prices.','Reinforcement is about rewards over time, like a game — not labelled receipts.']},
  {t:'m',ask:'We predict a fare, which is a number. That makes this…',opts:['Classification','Regression','Clustering'],correct:1,
   hints:['A number, not a category.','Predicting a number = regression.','Classification predicts a class; regression predicts a quantity.'],
   diag:['Classification is for classes (cat/dog); a fare is a number.',null,'Clustering groups unlabelled data — not our task.']},
  say('Stage 2 — half alone: the words map to statistics words.'),
  {t:'m',ask:'In statistics, the "weights" θ of a model are called its…',opts:['parameters','residuals','features'],correct:0,
   hints:['Another word for the tunable numbers inside the model.','weights = parameters.','Residuals are the gaps; features are the inputs. The tunable numbers are parameters.'],
   diag:[null,'Residuals are the leftover gaps, not the weights.','Features are the inputs x, not the weights.']},
  say('Stage 3 — alone: say it in your own words.'),
  {t:'ex',ask:'In one or two sentences: what does it mean to "fit" a model to data?',keywords:['parameter','θ','theta','data','examples','minim','error','match','best'],need:1,
   model:'Fitting means choosing the model\'s parameters θ so the model matches the examples as closely as possible — usually by making a measure of error as small as we can.'}
 ]},
{id:'1.2',mod:1,n:'1.2',title:'Training error and test error',sub:'Why matching the examples is not the whole job',diagram:'complexity',
 story:`Here is a trap to avoid early. Our real goal is not to match the receipts we already have — it is to predict the fare of a new trip we have never seen. So we split our examples into two piles. We tune the model on the training pile, then we check it, honestly, on a separate test pile it never saw. A good model has low error on both. If it does well on training but badly on test, it has simply memorised the old receipts without learning the rule. That ability to do well on new data is called generalization, and it is the whole point. Keep this picture in mind: training error measures memory, test error measures understanding.`,
 formula:{grid:MX([['generalization','=','low error on NEW data']]),
  symbols:[['training error','how wrong the model is on the examples it learned from'],['test error','how wrong it is on fresh examples it never saw'],['generalization','doing well on new, unseen data — the real goal']]},
 why:['We will use the model on future trips, not on the receipts we already paid.','Training error can always be pushed low by memorising — so it cannot be trusted alone.','Holding out a test pile gives an honest estimate of future error.','When training error is tiny but test error is large, the model memorised noise instead of the rule.'],
 mistakes:['Judging a model only by training error — the easiest number to fool yourself with.','Peeking at the test pile while tuning. Once you use it to choose, it is no longer honest.','Thinking zero training error is always good. It can be a warning sign of overfitting.'],
 exam:['"Define generalization and explain why training error alone is misleading."','"You get 0 training error and large test error. What is happening?" (overfitting — memorising, not learning).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'m',ask:'Which error tells you how the model will do on a future trip?',opts:['Training error','Test error'],correct:1,
   hints:['The future trip is one it has never seen.','Test error uses held-out, unseen data.','Training error is on old data it already learned.'],diag:['Training error is on data it already memorised.',null]},
  say('Stage 2.'),
  {t:'m',ask:'A model scores tiny training error but large test error. This is…',opts:['Underfitting','Overfitting','A perfect model'],correct:1,
   hints:['It did great on old data, poor on new.','Memorising the training set = overfitting.','Underfitting would be bad on BOTH.'],diag:['Underfitting is bad on both piles, not just test.',null,'A perfect model would be good on the test pile too.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Why do we hold out a separate test set instead of trusting training error?',keywords:['memor','unseen','new','honest','generali','overfit','future'],need:1,
   model:'Training error can be made small just by memorising, so it over-states how good the model is. A held-out test set measures error on unseen data, giving an honest estimate of how it will generalize.'}
 ]},
{id:'1.3',mod:1,n:'1.3',title:'Underfitting, overfitting & capacity',sub:'Bias, variance, and why we add a penalty',diagram:'polyfit',
 story:`Now slide the degree in the picture. A line that is too simple cannot bend to the data — it misses the shape, with high error everywhere. We call that underfitting, or high bias. A curve that is too wiggly bends through every single training point, including the random noise — that is overfitting, or high variance, and it fails on new points. Capacity is how flexible the model is allowed to be; more capacity means it can fit more, for better or worse. The cure for overfitting is regularization: we gently discourage extreme, wiggly solutions by adding a small penalty for large weights. And remember the honest humility of the "no free lunch" idea: no single model is best for every problem.`,
 formula:{grid:MX([['total error','≈','bias²  +  variance  +  noise']]),
  symbols:[['bias','error from being too simple to capture the shape (underfitting)'],['variance','error from being so flexible it chases noise (overfitting)'],['capacity','how flexible the model is allowed to be'],['regularization','a penalty that discourages extreme weights, to curb overfitting']]},
 why:['A low-capacity model cannot represent the true shape — bias stays high no matter how much data.','A high-capacity model can represent the shape, but also the noise, so it varies wildly between datasets.','The sweet spot trades a little bias for a lot less variance.','Regularization lowers the effective capacity, pulling an overfit model back toward a simpler one.'],
 mistakes:['Thinking more complex is always better. Past the sweet spot, test error climbs again.','Confusing bias (too simple) with variance (too wiggly).','Believing one model wins everywhere — "no free lunch" says otherwise.'],
 exam:['"Sketch training and validation error vs model complexity and mark the best capacity."','"Define overfitting and name one way to reduce it." (too flexible, memorises noise; add regularization / more data / lower degree).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'m',ask:'A straight line through curved data has high error everywhere. This is…',opts:['Underfitting (high bias)','Overfitting (high variance)'],correct:0,
   hints:['Too simple to follow the shape.','Too simple = underfit = high bias.','Overfitting would hug every point, not miss them all.'],diag:[null,'Overfitting hugs the points too tightly; here the line misses them.']},
  {t:'m',ask:'A degree-9 curve that passes through all 7 training points but misses the test points is…',opts:['Underfitting','Overfitting'],correct:1,
   hints:['It memorised the training noise.','Wiggling through every training point = overfit.','Underfitting misses the training points too.'],diag:['Underfitting would miss the training points as well.',null]},
  say('Stage 2.'),
  {t:'m',ask:'What does regularization do?',opts:['Makes the model more flexible','Penalises large weights to curb overfitting','Deletes the test set'],correct:1,
   hints:['It fights the wiggles.','It adds a penalty on big weights.','It lowers the effective capacity.'],diag:['It reduces flexibility, not increases it.',null,'It never touches the test set.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Explain the difference between underfitting and overfitting.',keywords:['simple','bias','flexible','variance','noise','memor','underfit','overfit','test'],need:2,
   model:'Underfitting is when the model is too simple to capture the pattern (high bias) — it does poorly on both training and test data. Overfitting is when the model is so flexible it fits the training noise (high variance) — it does well on training but poorly on test data.'}
 ]},
/* ---------- MODULE 2 ---------- */
{id:'2.1',mod:2,n:'2.1',title:'A line, and the gaps it leaves',sub:'Residuals, and why we square them',diagram:'scatterline',
 story:`Plot the four receipts as dots and lay a straight line through them. No straight line can touch all four, because the receipts are a little messy. For each dot, the gap between the real fare and the line's prediction is called the residual. Some gaps are above the line (positive) and some below (negative). To score a whole line with one number, we add up the gaps — but first we square each one. Squaring does two kind things: it makes every gap positive so they cannot cancel out, and it punishes a big miss much more than a small one. That total of squared gaps is the cost, C. A smaller cost means a better line.`,
 worked:`<div class="work"><div class="line">Try line A:  f(x) = 3 + 2x</div>
<div class="line">   x=1: predict 5, real 5 → gap 0</div>
<div class="line">   x=2: predict 7, real 8 → gap 1</div>
<div class="line">   x=3: predict 9, real 8 → gap −1</div>
<div class="line">   x=4: predict 11, real 11 → gap 0</div>
<div class="line">   C = 0² + 1² + (−1)² + 0²</div>
<div class="line res">   C = 0 + 1 + 1 + 0 = 2</div>
<div class="line" style="color:var(--muted)">In plain words: this line is off by one dollar on two trips, so it scores 2.</div></div>`,
 formula:{grid:MX([['C(θ₀, θ₁)','=','Σᵢ ( y⁽ⁱ⁾ − f(x⁽ⁱ⁾) )²']]),
  symbols:[['C(θ₀,θ₁)','the cost — one number scoring the whole line (smaller is better)'],['Σᵢ','add this up over every example i'],['y⁽ⁱ⁾ − f(x⁽ⁱ⁾)','the residual: real fare minus the line\'s prediction'],['( … )²','squared, so gaps stay positive and big misses hurt more']]},
 why:['One straight line usually cannot pass through messy data, so there will be gaps.','Adding raw gaps is useless — positives and negatives cancel, hiding bad fits.','Squaring removes the signs and grows fast, so it strongly discourages large misses.','The total of squared gaps is a single, fair score we can then make as small as possible.'],
 mistakes:['Adding the gaps without squaring — they cancel and a terrible line can score 0.','Forgetting to square: writing |gap| sum (that is a different, harder cost).','Measuring the gap sideways. It is vertical: real y minus predicted y, at the same x.'],
 exam:['"For f = 4 + 2x on the receipts, compute the cost." (gaps −1,0,−2,−1 → C = 6).','"Why do we square the residuals rather than add them directly?"'],
 practice:[
  say('Stage 1 — with me: score line A, f(x) = 3 + 2x, one gap at a time.'),
  {t:'n',ask:'At x = 2 the real fare is 8. What is the gap y − f(x)?',fields:[['v','gap']],ans:[1],
   line:v=>`gap at x=2 = 8 − (3+2·2) = 8 − 7 = ${fmt(v[0])}`,
   hints:['Predict first: 3 + 2·2 = 7.','gap = real − predicted = 8 − 7.','8 − 7 = 1.'],
   diag:v=>v[0]===-1?'Careful with the order: it is real − predicted = 8 − 7, not 7 − 8.':null},
  {t:'n',ask:'At x = 3 the real fare is 8. What is the gap?',fields:[['v','gap']],ans:[-1],
   line:v=>`gap at x=3 = 8 − (3+2·3) = 8 − 9 = ${fmt(v[0])}`,
   hints:['Predict: 3 + 2·3 = 9.','gap = 8 − 9.','8 − 9 = −1.'],diag:v=>v[0]===1?'Order matters: real − predicted = 8 − 9 = −1.':null},
  {t:'n',ask:'The four gaps are 0, 1, −1, 0. Square them and add: what is the cost C?',fields:[['v','C']],ans:[2],
   line:v=>`C = 0² + 1² + (−1)² + 0² = ${fmt(v[0])}`,
   hints:['Square each: 0, 1, 1, 0.','Add the squares.','0 + 1 + 1 + 0 = 2.'],diag:v=>v[0]===0?'You may have added the raw gaps (they cancel to 0). Square FIRST, then add.':null},
  say('Stage 2 — half alone: now score line B, f(x) = 4 + 2x.'),
  {t:'n',ask:'Line B gaps are −1, 0, −2, −1. What is its cost C?',fields:[['v','C']],ans:[6],
   line:v=>`C_B = 1 + 0 + 4 + 1 = ${fmt(v[0])}`,
   hints:['Square each: 1, 0, 4, 1.','Add them.','1 + 0 + 4 + 1 = 6.'],diag:v=>v[0]===4?'Remember to include every gap: 1 + 0 + 4 + 1 = 6.':null},
  {t:'m',ask:'Line A scored 2, line B scored 6. Which line fits better?',opts:['Line A','Line B'],correct:0,
   hints:['Smaller cost = better.','2 is less than 6.','A smaller total of squared gaps means a closer line.'],diag:[null,'Lower cost is better, and B\'s 6 is higher than A\'s 2.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Why do we square the gaps instead of just adding them?',keywords:['cancel','positive','sign','negative','big','large','punish','penal'],need:1,
   model:'Raw gaps have mixed signs and cancel, so a bad line could score zero. Squaring makes every gap positive (no cancelling) and grows quickly, so large misses are punished much more than small ones.'}
 ]},
{id:'2.2',mod:2,n:'2.2',title:'The cost is a bowl',sub:'One bottom, found by argmin',diagram:'costbowl',
 story:`Think of the cost C as a landscape. The ground height at each spot (θ₀, θ₁) is the cost of that line. For squared-error line fitting, this landscape is a smooth bowl — it curves up in every direction and has exactly one lowest point. That single lowest point is the best line. Because there is only one bottom and no little traps along the way, we can always find it. We write "argmin" to mean "the (θ₀, θ₁) that gives the smallest cost". A bowl shape like this is called convex, and convex problems are the friendly ones: wherever you start, downhill always leads to the one true bottom.`,
 formula:{grid:MX([['θ̂','=','argmin  C(θ₀, θ₁)']]),
  symbols:[['θ̂','the best parameters — the ones that win'],['argmin','"the input that makes this smallest" (not the smallest value, but where it happens)'],['C(θ₀,θ₁)','the bowl-shaped cost surface'],['convex','bowl-shaped: one bottom, no traps']]},
 why:['The cost is a sum of squares, and squares curve upward everywhere.','A sum of upward-curving pieces is itself a single upward bowl — convex.','A convex bowl has exactly one lowest point, so the best line is unique.','With no false bottoms to get stuck in, "go downhill" always reaches the true answer.'],
 mistakes:['Confusing argmin (where the minimum is) with min (the minimum value itself).','Imagining several bottoms. Squared-error line fitting has exactly one.','Thinking you could get stuck in a dip. A convex bowl has no side dips.'],
 exam:['"Is the squared-error cost convex? What does that guarantee?" (yes; a single global minimum).','"What does argmin mean?"'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'m',ask:'argmin C means…',opts:['the smallest value of C','the (θ₀,θ₁) where C is smallest','the average of C'],correct:1,
   hints:['"arg" points at the INPUT.','It is the location of the minimum, not its height.','min gives the value; argmin gives where it happens.'],diag:['That is "min C" — the value. argmin is the location.',null,'Not an average at all.']},
  {t:'m',ask:'The squared-error cost surface is shaped like…',opts:['a bowl with one bottom','a range with many hills and dips','a flat plane'],correct:0,
   hints:['Squares curve upward.','One bottom only = convex bowl.','No side traps.'],diag:[null,'No — it is convex, so no extra dips.','A flat plane has no single bottom; this bowl does.']},
  say('Stage 2.'),
  {t:'m',ask:'Why is it good news that the cost is convex?',opts:['It has many solutions to choose from','It has one global minimum we can always reach','It can never be solved'],correct:1,
   hints:['One bottom means one answer.','Convex ⇒ unique global minimum.','Downhill always works.'],diag:['Convex means ONE solution, not many.',null,'Convex problems are the easy ones to solve.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Explain why the line-fitting cost has exactly one minimum.',keywords:['square','convex','bowl','one','single','unique','global'],need:1,
   model:'The cost is a sum of squared terms. Each square curves upward, so their sum is a convex (bowl-shaped) surface with a single global minimum — hence exactly one best line.'}
 ]},
/* ---------- MODULE 3 ---------- */
{id:'3.1',mod:3,n:'3.1',title:'Setting the slope to zero',sub:'How calculus finds the bottom of the bowl',diagram:'costbowl',
 story:`How do we find the bottom of the bowl without guessing? At the very bottom, the ground is flat — the slope is zero in every direction. The cost has two directions, θ₀ and θ₁, so we ask: how does C change if we nudge θ₀, and how does it change if we nudge θ₁? Those two "rates of change" are the partial derivatives. We set both to zero, because at the bottom neither nudge makes the cost go down any more. That gives us two equations in two unknowns, and solving them hands us the best θ₀ and θ₁ directly — no searching needed.`,
 worked:`<div class="work"><div class="line">Cost:  C = Σ ( y − θ₀ − θ₁x )²</div>
<div class="line">Nudge θ₀ (chain rule, bring down the 2):</div>
<div class="line">   ∂C/∂θ₀ = Σ 2(y − θ₀ − θ₁x)·(−1) = −2 Σ (y − θ₀ − θ₁x)</div>
<div class="line">Nudge θ₁ (the inside's slope in θ₁ is −x):</div>
<div class="line">   ∂C/∂θ₁ = −2 Σ x(y − θ₀ − θ₁x)</div>
<div class="line">Set both to 0 (drop the −2):</div>
<div class="line res">   Σ(y − θ₀ − θ₁x) = 0   and   Σ x(y − θ₀ − θ₁x) = 0</div>
<div class="line" style="color:var(--muted)">In plain words: the leftover gaps must sum to zero — overall, and weighted by x.</div></div>`,
 formula:{grid:MX([['∂C/∂θ₀','=','−2 Σ (y − θ₀ − θ₁x)'],['∂C/∂θ₁','=','−2 Σ x(y − θ₀ − θ₁x)']]),
  symbols:[['∂C/∂θ₀','how fast the cost changes if you nudge only θ₀ (the start fee)'],['∂C/∂θ₁','how fast it changes if you nudge only θ₁ (the slope)'],['= 0','at the bottom of the bowl, both slopes are flat'],['Σ','summed over every example']]},
 why:['At a minimum the surface is flat, so every partial derivative is zero.','C is a sum of squares; differentiating each square brings down a factor of 2 and the inside\'s slope.','The inside (y − θ₀ − θ₁x) has slope −1 in θ₀ and −x in θ₁.','Setting both partials to zero gives two equations — enough to solve for the two unknowns.'],
 mistakes:['Forgetting the chain rule factor from the inside (the −1 and the −x).','Setting only one derivative to zero. You need both — one per unknown.','Dropping the minus sign and getting the equations backwards.'],
 exam:['"Differentiate C with respect to θ₀ and θ₁ and set to zero." (shown above).','"What is true about the residuals at the best line?" (they sum to zero, and so do x·residuals).'],
 practice:[
  say('Stage 1 — with me (reading the calculus).'),
  {t:'m',ask:'Why do we set the derivatives to zero?',opts:['Because the bottom of the bowl is flat','Because zero is easy to type','To make the cost zero'],correct:0,
   hints:['Think about the lowest point of a valley.','A minimum has zero slope.','It is about the slope, not the cost value.'],diag:[null,'There is a real reason: the minimum is flat.','The cost at the bottom is usually not zero; its SLOPE is.']},
  {t:'m',ask:'Differentiating (y − θ₀ − θ₁x)² with respect to θ₀ brings down a factor and the inside\'s slope −1. The 2 comes from…',opts:['the power rule on the square','nowhere, it is a typo','the number of data points'],correct:0,
   hints:['d/du of u² is 2u.','The square gives the 2.','It is the exponent coming down.'],diag:[null,'It is real — the power rule.','Not the count of points; it is the exponent 2.']},
  say('Stage 2.'),
  {t:'m',ask:'At the best line, the plain residuals (y − f) must…',opts:['sum to zero','all be positive','all be equal'],correct:0,
   hints:['Look at the first equation.','Σ(y − θ₀ − θ₁x) = 0.','Their total is zero.'],diag:[null,'Some are positive, some negative — but they total zero.','They need not be equal, only sum to zero.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'In words, how does calculus locate the best line?',keywords:['derivative','slope','zero','flat','minimum','bottom','partial'],need:1,
   model:'At the bottom of the convex bowl the surface is flat, so both partial derivatives of the cost are zero. Setting ∂C/∂θ₀ = 0 and ∂C/∂θ₁ = 0 gives two equations whose solution is the best θ₀ and θ₁.'}
 ]},
{id:'3.2',mod:3,n:'3.2',title:'The two magic formulas',sub:'θ₀ and θ₁ from four averages',diagram:'bestline',
 story:`Solve those two equations and something beautiful drops out: the best line depends only on four simple averages of the data. The average of x, the average of y, the average of x times y, and the average of x squared. From them, the slope θ₁ and the start fee θ₀ follow directly. The recipe is always the same: compute the four averages, put them into the slope formula, then use the slope to get the intercept. Let us run it on the taxi receipts and watch the exact best line — f(x) = 3.5 + 1.8x — appear.`,
 worked:`<div class="work"><div class="line">Receipts: (1,5) (2,8) (3,8) (4,11)</div>
<div class="line">⟨x⟩ = (1+2+3+4)/4 = 2.5</div>
<div class="line">⟨y⟩ = (5+8+8+11)/4 = 8</div>
<div class="line">⟨xy⟩ = (5+16+24+44)/4 = 89/4 = 22.25</div>
<div class="line">⟨x²⟩ = (1+4+9+16)/4 = 30/4 = 7.5</div>
<div class="line">θ₁ = (⟨x⟩⟨y⟩ − ⟨xy⟩)/(⟨x⟩² − ⟨x²⟩) = (20 − 22.25)/(6.25 − 7.5)</div>
<div class="line">     = (−2.25)/(−1.25) = 1.8</div>
<div class="line">θ₀ = ⟨y⟩ − θ₁⟨x⟩ = 8 − 1.8·2.5 = 8 − 4.5 = 3.5</div>
<div class="line res">   best line: f(x) = 3.5 + 1.8x,   cost C = 1.8</div></div>`,
 formula:{grid:MX([['θ₁','=','(⟨x⟩⟨y⟩ − ⟨xy⟩) / (⟨x⟩² − ⟨x²⟩)'],['θ₀','=','⟨y⟩ − θ₁⟨x⟩']]),
  symbols:[['⟨x⟩','the average of the x values'],['⟨y⟩','the average of the y values'],['⟨xy⟩','the average of each x times its own y'],['⟨x²⟩','the average of the squared x values'],['θ₁','the slope — price per km'],['θ₀','the intercept — start fee']]},
 why:['The two "slope = 0" equations are linear in θ₀ and θ₁.','Dividing each by N turns the sums into averages.','Eliminating θ₀ leaves one equation for θ₁ — the slope formula.','Substituting θ₁ back gives θ₀ = ⟨y⟩ − θ₁⟨x⟩, so the line passes through (⟨x⟩, ⟨y⟩).'],
 mistakes:['Computing ⟨x²⟩ as ⟨x⟩² (average of the squares ≠ square of the average).','Computing ⟨xy⟩ as ⟨x⟩⟨y⟩. You must multiply each pair first, then average.','Forgetting the minus signs — top and bottom are both negative here, and cancel to a positive slope.'],
 exam:['"Fit a line to (0,1),(1,3),(2,5)." (θ₁ = 2, θ₀ = 1, C = 0).','"Fit the receipts and give the cost." (3.5 + 1.8x, C = 1.8).'],
 practice:[
  say('Stage 1 — with me: the taxi receipts, one average at a time.'),
  {t:'n',ask:'⟨x⟩ — the average of 1, 2, 3, 4?',fields:[['v','⟨x⟩']],ans:[2.5],
   line:v=>`⟨x⟩ = (1+2+3+4)/4 = ${fmt(v[0])}`,hints:['Add them, divide by 4.','(1+2+3+4) = 10.','10/4 = 2.5.'],diag:v=>v[0]===10?'That is the sum — now divide by 4 to get the average.':null},
  {t:'n',ask:'⟨y⟩ — the average of 5, 8, 8, 11?',fields:[['v','⟨y⟩']],ans:[8],
   line:v=>`⟨y⟩ = (5+8+8+11)/4 = ${fmt(v[0])}`,hints:['Add the fares, divide by 4.','5+8+8+11 = 32.','32/4 = 8.'],diag:v=>v[0]===32?'That is the sum; divide by 4.':null},
  {t:'n',ask:'⟨xy⟩ — average of 1·5, 2·8, 3·8, 4·11?',fields:[['v','⟨xy⟩']],ans:[22.25],
   line:v=>`⟨xy⟩ = (5+16+24+44)/4 = 89/4 = ${fmt(v[0])}`,hints:['Multiply each pair first: 5, 16, 24, 44.','Sum = 89.','89/4 = 22.25.'],diag:v=>approx(v[0],20,0.001)?'That looks like ⟨x⟩⟨y⟩ = 2.5·8 = 20. Instead multiply each x by ITS y first, then average.':null},
  {t:'n',ask:'⟨x²⟩ — average of 1, 4, 9, 16?',fields:[['v','⟨x²⟩']],ans:[7.5],
   line:v=>`⟨x²⟩ = (1+4+9+16)/4 = 30/4 = ${fmt(v[0])}`,hints:['Square each x first: 1, 4, 9, 16.','Sum = 30.','30/4 = 7.5.'],diag:v=>approx(v[0],6.25,0.001)?'That is ⟨x⟩² = 2.5² = 6.25. You want the average of the squares, 7.5 — not the square of the average.':null},
  {t:'n',ask:'Now the slope: θ₁ = (2.5·8 − 22.25)/(2.5² − 7.5)?',fields:[['v','θ₁']],ans:[1.8],
   line:v=>`θ₁ = (20 − 22.25)/(6.25 − 7.5) = (−2.25)/(−1.25) = ${fmt(v[0])}`,
   hints:['Top: 20 − 22.25 = −2.25.','Bottom: 6.25 − 7.5 = −1.25.','(−2.25)/(−1.25) = 1.8.'],diag:v=>v[0]<0?'Two negatives divide to a POSITIVE: (−2.25)/(−1.25) = +1.8.':null},
  {t:'n',ask:'Finally θ₀ = 8 − 1.8·2.5?',fields:[['v','θ₀']],ans:[3.5],
   line:v=>`θ₀ = ⟨y⟩ − θ₁⟨x⟩ = 8 − 4.5 = ${fmt(v[0])}`,hints:['1.8·2.5 = 4.5.','8 − 4.5.','θ₀ = 3.5.'],diag:v=>null},
  say('Stage 2 — half alone: a clean dataset (0,1), (1,3), (2,5).'),
  {t:'n',ask:'Its averages are ⟨x⟩=1, ⟨y⟩=3, ⟨xy⟩=13/3, ⟨x²⟩=5/3. Find θ₁.',fields:[['v','θ₁']],ans:[2],
   line:v=>`θ₁ = (1·3 − 13/3)/(1 − 5/3) = (−4/3)/(−2/3) = ${fmt(v[0])}`,
   hints:['Top: 3 − 13/3 = −4/3.','Bottom: 1 − 5/3 = −2/3.','(−4/3)/(−2/3) = 2.'],diag:v=>null},
  {t:'n',ask:'With θ₁ = 2, find θ₀ = ⟨y⟩ − θ₁⟨x⟩.',fields:[['v','θ₀']],ans:[1],
   line:v=>`θ₀ = 3 − 2·1 = ${fmt(v[0])}`,hints:['θ₁⟨x⟩ = 2·1 = 2.','3 − 2.','θ₀ = 1.'],diag:v=>null},
  say('Stage 3 — alone: five image pixels (0,1), (1,2), (2,2), (3,3), (4,4).'),
  {t:'n',ask:'Here ⟨x⟩=2, ⟨y⟩=2.4, ⟨xy⟩=6.2, ⟨x²⟩=6. Give θ₁ then θ₀.',fields:[['a','θ₁'],['b','θ₀']],ans:[0.7,1.0],
   line:v=>`θ₁ = (2·2.4 − 6.2)/(4 − 6) = (−1.4)/(−2) = 0.7;  θ₀ = 2.4 − 0.7·2 = ${fmt(v[1])}`,
   hints:['Top 4.8 − 6.2 = −1.4; bottom 4 − 6 = −2.','θ₁ = (−1.4)/(−2) = 0.7.','θ₀ = 2.4 − 0.7·2 = 2.4 − 1.4 = 1.0.'],
   diag:v=>null}
 ]},
/* ---------- MODULE 4 ---------- */
{id:'4.1',mod:4,n:'4.1',title:'Stacking data: the design matrix',sub:'One tidy equation for all the data',diagram:'designmatrix',
 story:`The two-average formulas are lovely for a single input, but real problems have many inputs. So we switch to a tidier bookkeeping. We give every example a hidden first feature that is always 1 — this is the bias feature, and its job is to carry the start fee θ₀. Then each example becomes a short row [1, x], and we stack all the rows into one tall table called the design matrix X. The whole prediction for every example at once becomes a single matrix multiply, X θ. Nothing new is happening — it is the same line — but now the notation scales to any number of inputs without getting messy.`,
 worked:`<div class="work"><div class="line">Each receipt → a row [1, x]:</div>
<div class="line">   X = ( 1  1 / 1  2 / 1  3 / 1  4 )     y = ( 5 / 8 / 8 / 11 )</div>
<div class="line">Parameters stacked:   θ = ( θ₀ / θ₁ )</div>
<div class="line">Prediction for row i:   f(x⁽ⁱ⁾) = x⁽ⁱ⁾ᵀ θ = 1·θ₀ + x·θ₁</div>
<div class="line res">   all predictions at once:  ŷ = X θ</div>
<div class="line" style="color:var(--muted)">In plain words: the column of 1's holds the start fee; the column of x's holds the per-km part.</div></div>`,
 formula:{grid:MX([['f(x)','=','xᵀθ,     x = [1, x₁, … , x_M]']]),
  symbols:[['x₀ = 1','the bias feature — always 1, so θ₀ becomes a normal weight'],['x','one example as a row: a 1 followed by its real features'],['θ','the column of parameters [θ₀, θ₁, …]'],['X','the design matrix — one row per example, N × (M+1)'],['xᵀθ','a dot product: multiply matching entries and add']]},
 why:['Writing the constant start fee as a feature that is always 1 lets θ₀ act like any other weight.','Then a prediction is just a dot product of a row with θ.','Stacking all rows into X turns all predictions into one multiply Xθ.','The same idea handles 2, 3, or a thousand features — only the row gets longer.'],
 mistakes:['Forgetting the column of 1\'s. Without it the line is forced through the origin (no start fee).','Mixing up the shape: X is N×(M+1), θ is (M+1)×1, so Xθ is N×1 — one prediction per row.','Thinking matrix form is a different model. It is the exact same line, retyped.'],
 exam:['"Write the design matrix for the receipts." (a column of 1\'s next to 1,2,3,4).','"Why include a feature that is always 1?" (to carry the intercept θ₀).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'m',ask:'Why does every row of X start with a 1?',opts:['To carry the start fee θ₀','To make X square','By accident'],correct:0,
   hints:['The 1 multiplies θ₀.','It lets the intercept be a normal weight.','Without it, the line must pass through the origin.'],diag:[null,'X is usually not square; that is not the reason.','It is deliberate — it carries θ₀.']},
  {t:'n',ask:'The receipt (3, 8) becomes the row [1, 3]. Its prediction is 1·θ₀ + 3·θ₁. With θ=(3.5,1.8), what is the prediction?',fields:[['v','ŷ']],ans:[8.9],
   line:v=>`ŷ = 1·3.5 + 3·1.8 = 3.5 + 5.4 = ${fmt(v[0])}`,hints:['3.5 + 1.8·3.','1.8·3 = 5.4.','3.5 + 5.4 = 8.9.'],diag:v=>null},
  say('Stage 2.'),
  {t:'m',ask:'X has 4 rows and 2 columns, θ has 2 rows. What shape is Xθ?',opts:['4 × 1 (one prediction per receipt)','2 × 2','a single number'],correct:0,
   hints:['Rows of X × columns of θ.','4×2 times 2×1 = 4×1.','One prediction for each of the four receipts.'],diag:[null,'Not 2×2 — the result has one row per example.','It is four numbers, one per row.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Explain the role of the design matrix X.',keywords:['row','example','feature','stack','1','bias','matrix','predict'],need:1,
   model:'X stacks one row per example, each row being a 1 (the bias feature) followed by that example\'s features. Then every prediction at once is the single matrix product Xθ — the same line, written compactly for any number of features.'}
 ]},
{id:'4.2',mod:4,n:'4.2',title:'The normal equations',sub:'The best θ in one line of matrices',diagram:'designmatrix',
 story:`Now redo the whole "minimise the cost" story, but in matrix language. The cost becomes the squared length of the residual vector, (y − Xθ) dotted with itself. We differentiate with respect to the whole vector θ, set it to zero, and out come the normal equations. Their solution is a single, famous formula: θ-hat equals (X-transpose X) inverse, times X-transpose y. It looks heavy, but it is just the matrix version of the two-average formulas — and it works for any number of features at once. This one line is the engine behind an enormous amount of machine learning.`,
 worked:`<div class="work"><div class="line">Cost in matrix form:</div>
<div class="line">   C = (y − Xθ)ᵀ(y − Xθ)</div>
<div class="line">     = yᵀy − 2(Xθ)ᵀy + (Xθ)ᵀXθ</div>
<div class="line">Differentiate in θ and set to 0:</div>
<div class="line">   ∂C/∂θ = −2 Xᵀy + 2 XᵀX θ = 0</div>
<div class="line">   ⇒  XᵀX θ = Xᵀy      (the normal equations)</div>
<div class="line res">   θ̂ = (XᵀX)⁻¹ Xᵀy</div></div>`,
 formula:{grid:MX([['θ̂','=','(XᵀX)⁻¹ Xᵀy']]),
  symbols:[['Xᵀ','X "turned on its side" (transpose): rows become columns'],['XᵀX','a small square matrix, (M+1)×(M+1), easy to invert'],['(XᵀX)⁻¹','its inverse — the matrix that undoes it'],['Xᵀy','combines the targets with the features'],['θ̂','the best parameters, all at once']]},
 why:['The squared-error cost is the residual vector dotted with itself.','Expanding gives a quadratic in θ, whose derivative is −2Xᵀy + 2XᵀXθ.','Setting that to zero gives XᵀXθ = Xᵀy, the normal equations.','Multiplying by (XᵀX)⁻¹ isolates θ̂ — the unique minimiser when XᵀX is invertible.'],
 mistakes:['Writing (XXᵀ) instead of (XᵀX). Order and side matter — XᵀX is the small square one.','Forgetting the transpose on Xᵀy.','Trying to invert X itself. X is usually not square; XᵀX is.'],
 exam:['"Derive the normal equations from the matrix cost."','"State the closed-form solution for θ̂." ((XᵀX)⁻¹Xᵀy).'],
 practice:[
  say('Stage 1 — with me: the pixel data X = (1 0 / 1 1 / 1 2 / 1 3 / 1 4), y = (1,2,2,3,4).'),
  {t:'n',ask:'XᵀX is (N  Σx / Σx  Σx²). With N=5, Σx=10, Σx²=30, give the four entries top-left, top-right, bottom-left, bottom-right.',fields:[['a','TL'],['b','TR'],['c','BL'],['d','BR']],ans:[5,10,10,30],
   line:v=>`XᵀX = ( 5  10 / 10  30 )`,hints:['Top-left is N = 5.','Off-diagonals are Σx = 10.','Bottom-right is Σx² = 30.'],diag:v=>null},
  {t:'n',ask:'Xᵀy is (Σy, Σxy). With Σy=12 and Σxy=31, give both.',fields:[['a','Σy'],['b','Σxy']],ans:[12,31],
   line:v=>`Xᵀy = ( 12 , 31 )`,hints:['Σy = 1+2+2+3+4.','= 12.','Σxy = 0+2+4+9+16 = 31.'],diag:v=>null},
  {t:'n',ask:'The determinant of (5 10 / 10 30) is 5·30 − 10·10. What is it?',fields:[['v','det']],ans:[50],
   line:v=>`det = 150 − 100 = ${fmt(v[0])}`,hints:['Cross-multiply: 5·30 and 10·10.','150 − 100.','det = 50.'],diag:v=>null},
  {t:'n',ask:'Solving (XᵀX)⁻¹Xᵀy gives θ̂. It comes out to (θ₀, θ₁) = ?',fields:[['a','θ₀'],['b','θ₁']],ans:[1.0,0.7],
   line:v=>`θ̂ = (1/50)·(30·12 − 10·31 , −10·12 + 5·31) = (1/50)(50, 35) = (1.0, 0.7)`,
   hints:['Inverse = (1/50)(30 −10 / −10 5).','θ₀ = (30·12 − 10·31)/50 = 50/50 = 1.','θ₁ = (−10·12 + 5·31)/50 = 35/50 = 0.7.'],diag:v=>null},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Why do we use XᵀX and not X by itself in the solution?',keywords:['square','invert','not square','rectangular','transpose','symmetric'],need:1,
   model:'X is rectangular (N examples by M+1 features), so it has no inverse. XᵀX is a small square (M+1)×(M+1) matrix that can be inverted, which is why the solution is (XᵀX)⁻¹Xᵀy.'}
 ]},
{id:'4.3',mod:4,n:'4.3',title:'Fitting a line in an image',sub:'The same maths, now on pixels',diagram:'imageline',
 story:`Let us see why this chapter sits inside a computer-vision course. Take a small image and find its bright pixels — maybe they trace a lane on a road or the horizon. Each bright pixel has a column (across) and a row (down). Treat column as x and row as y, and fit a line: that line is the detected lane or horizon. One warning that trips everyone up: in images the row number grows downward, so "up" and "down" feel flipped. But the mathematics is identical — the same four averages, the same normal equations. Vision problems are often just line (or plane) fitting wearing a different hat.`,
 worked:`<div class="work"><div class="line">Bright pixels (col, row): (0,1) (1,2) (2,2) (3,3) (4,4)</div>
<div class="line">⟨x⟩ = 2,  ⟨y⟩ = 2.4,  ⟨xy⟩ = 6.2,  ⟨x²⟩ = 6</div>
<div class="line">θ₁ = (2·2.4 − 6.2)/(2² − 6) = (−1.4)/(−2) = 0.7</div>
<div class="line">θ₀ = 2.4 − 0.7·2 = 1.0</div>
<div class="line">Matrix check: XᵀX = (5 10 / 10 30),  Xᵀy = (12, 31)</div>
<div class="line res">   θ̂ = (1.0, 0.7),  cost C = 0.30</div>
<div class="line" style="color:var(--muted)">Same answer both ways — averages and matrices agree.</div></div>`,
 formula:{grid:MX([['row','≈','θ₀ + θ₁ · column     (y grows DOWN)']]),
  symbols:[['column','the horizontal pixel position — our x'],['row','the vertical pixel position — our y (increases downward)'],['θ₁','how fast the row changes per column — the line\'s slope on the image'],['plane fitting','in 2D images, fit z = θ₀ + θ₁x + θ₂y the same way']]},
 why:['Edge or bright pixels often lie along a straight feature (lane, horizon, wall).','Their (column, row) coordinates are just (x, y) pairs.','So the best-fit line uses the identical four-average or normal-equation recipe.','For a tilted surface of brightness, the same idea fits a plane z = θ₀ + θ₁x + θ₂y.'],
 mistakes:['Forgetting that image rows increase downward, so a "rising" road line has a positive slope on screen.','Using only a few noisy pixels. More inliers give a steadier line.','Expecting a different formula for images. It is the same least-squares fit.'],
 exam:['"Fit a line to the five pixels and verify with the matrix method." (θ̂ = (1.0, 0.7), C = 0.30).','"How would you extend this to fit a plane in a 2D image?" (add a second feature y; solve the 3×3 normal equations).'],
 practice:[
  say('Stage 1 — with me (reuse the pixel averages ⟨x⟩=2, ⟨y⟩=2.4, ⟨xy⟩=6.2, ⟨x²⟩=6).'),
  {t:'n',ask:'Slope θ₁ = (2·2.4 − 6.2)/(4 − 6)?',fields:[['v','θ₁']],ans:[0.7],
   line:v=>`θ₁ = (−1.4)/(−2) = ${fmt(v[0])}`,hints:['Top: 4.8 − 6.2 = −1.4.','Bottom: 4 − 6 = −2.','(−1.4)/(−2) = 0.7.'],diag:v=>null},
  {t:'n',ask:'Intercept θ₀ = 2.4 − 0.7·2?',fields:[['v','θ₀']],ans:[1.0],
   line:v=>`θ₀ = 2.4 − 1.4 = ${fmt(v[0])}`,hints:['0.7·2 = 1.4.','2.4 − 1.4.','θ₀ = 1.0.'],diag:v=>null},
  say('Stage 2.'),
  {t:'m',ask:'In an image, the row index increases…',opts:['downward','upward','randomly'],correct:0,
   hints:['Row 0 is at the top.','Rows count downward.','That is why screen-y feels flipped.'],diag:[null,'Row 0 is the top, so rows go DOWN.','It is a fixed convention: top to bottom.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Why is lane or horizon detection an example of line fitting?',keywords:['pixel','column','row','coordinate','line','fit','least squares','edge'],need:1,
   model:'Bright or edge pixels along a lane or horizon have (column, row) coordinates. Treating column as x and row as y, the best-fit line through them is found by the same least-squares recipe — so detecting the feature is just fitting a line to those pixels.'}
 ]},
/* ---------- MODULE 5 ---------- */
{id:'5.1',mod:5,n:'5.1',title:'Curves, still linear',sub:'Polynomials and basis functions',diagram:'polyfit',
 story:`A straight line is often too stiff. The surprising trick is that we can fit curves without leaving the easy world of linear least squares. We simply invent new features out of the old input: 1, x, x², x³, and so on. The model is still a weighted sum of features — still "linear in the parameters" — so the same normal equations solve it. More generally, any set of chosen functions of x (called basis functions) can be the features. The model stays a straight-line problem in θ even when the curve it draws is wildly bendy. Neural networks take the final step: they learn the basis functions too, instead of us choosing them.`,
 worked:`<div class="work"><div class="line">Cubic features from one input x:</div>
<div class="line">   x → [1, x, x², x³]</div>
<div class="line">   at x = 2:  [1, 2, 4, 8]</div>
<div class="line">Model:  f(x) = θ₀·1 + θ₁·x + θ₂·x² + θ₃·x³</div>
<div class="line">General basis:  f(x) = φ(x)ᵀθ</div>
<div class="line res">   θ̂ = (ΦᵀΦ)⁻¹ Φᵀy     (same formula, Φ replaces X)</div>
<div class="line" style="color:var(--muted)">It bends like a curve but solves like a line.</div></div>`,
 formula:{grid:MX([['f(x)','=','φ(x)ᵀθ,     φ(x) = [1, x, x², …]']]),
  symbols:[['φ(x)','the feature vector — the chosen functions of x (the basis)'],['basis functions','the building-block shapes we add together (1, x, x², …)'],['Φ','the design matrix of features, one row per example'],['linear in θ','the parameters appear as simple multipliers, so least squares still works'],['θ̂','best weights via the same normal equations with Φ']]},
 why:['Predicting with a sum of features is linear in the weights, whatever the features are.','So replacing x with [1, x, x², …] keeps the problem a linear least-squares one.','Only the design matrix changes — X becomes Φ — and (ΦᵀΦ)⁻¹Φᵀy still solves it.','Choosing good features is modelling; neural networks automate that choice by learning φ.'],
 mistakes:['Thinking a curved fit needs non-linear optimisation. In the weights, it is still linear.','Confusing "linear in x" with "linear in θ". We only need the latter.','Forgetting the constant feature 1 — the intercept still needs it.'],
 exam:['"Write the cubic feature row for x = 2." ([1, 2, 4, 8]).','"Why is polynomial regression still a linear model?" (linear in the parameters θ).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'n',ask:'Write the cubic feature row [1, x, x², x³] for x = 2. Enter the four numbers.',fields:[['a','1'],['b','x'],['c','x²'],['d','x³']],ans:[1,2,4,8],
   line:v=>`φ(2) = [1, 2, 4, 8]`,hints:['First entry is always 1.','x = 2, x² = 4.','x³ = 8.'],diag:v=>null},
  say('Stage 2.'),
  {t:'m',ask:'Polynomial regression is called a LINEAR model because it is linear in…',opts:['x','the parameters θ','the errors'],correct:1,
   hints:['Look at how θ appears.','The θ\'s are simple multipliers.','The curve bends in x, but θ enters linearly.'],diag:['It is curved in x — that is fine.',null,'Not about the errors.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'How can we fit a curve while still using linear least squares?',keywords:['feature','basis','x²','power','polynomial','linear','parameter','φ','phi'],need:1,
   model:'We expand the input into new features (1, x, x², …, or any basis functions φ(x)). The model is still a weighted sum of features — linear in the parameters — so the same normal equations θ̂ = (ΦᵀΦ)⁻¹Φᵀy fit the curve.'}
 ]},
{id:'5.2',mod:5,n:'5.2',title:'Gaussian basis functions',sub:'Bumps that add up to any curve',diagram:'gaussbasis',
 story:`Polynomials are one choice of basis, but they can swing wildly at the edges. A gentler choice is a set of little bell-shaped bumps, each parked at a different place along x. Each bump is a Gaussian — tall near its centre, fading to zero on both sides. Give each bump a weight, add them up, and you can trace almost any smooth curve. The model is still a weighted sum of features, so it is still linear in the weights and still solved by the normal equations. The only new ideas are where to place the bumps and how wide to make them.`,
 formula:{grid:MX([['φᵢ(x)','=','exp( −γᵢ ‖μᵢ − x‖² )']]),
  symbols:[['φᵢ(x)','the i-th bump — a bell centred at μᵢ'],['μᵢ','the centre (location) of bump i along x'],['γᵢ','how sharp/narrow the bump is (big γ = narrow)'],['‖μᵢ − x‖²','squared distance from x to the bump\'s centre'],['f(x) = Σ wᵢ φᵢ(x)','the curve: a weighted sum of bumps']]},
 why:['Each Gaussian bump is a smooth, local feature — it only matters near its centre.','Summing weighted bumps can approximate any smooth shape.','Because the weights enter linearly, it is still an ordinary least-squares fit.','Local bumps avoid the wild end-swings that high-degree polynomials suffer.'],
 mistakes:['Thinking the bumps must be evenly spaced or equal width — they need not be.','Confusing the bump\'s own shape (fixed) with its weight (what we fit).','Expecting non-linear fitting. In the weights, it stays linear.'],
 exam:['"Write the form of a Gaussian basis function and name each symbol."','"Why might Gaussian bases behave better than high-degree polynomials?" (local support, no edge blow-up).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'m',ask:'A Gaussian basis function is largest…',opts:['at its centre μ','far from its centre','everywhere equally'],correct:0,
   hints:['Picture a bell.','exp(0) = 1 at the centre.','It fades as x leaves μ.'],diag:[null,'It fades far away, not grows.','A bell is not flat.']},
  {t:'m',ask:'Fitting the weights of Gaussian bumps is…',opts:['a non-linear search','still linear least squares','impossible'],correct:1,
   hints:['The weights are simple multipliers.','Weighted sum of fixed features = linear.','Same normal equations apply.'],diag:['The weights enter linearly, so it is linear.',null,'It is routine least squares.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Why are basis-function models still "linear"?',keywords:['weight','parameter','sum','linear','feature','fixed','basis'],need:1,
   model:'The basis functions are fixed shapes; the model is a weighted sum of them. Since the weights (parameters) appear only as linear multipliers, the fit is still linear least squares — even though the resulting curve is not a straight line.'}
 ]},
/* ---------- MODULE 6 ---------- */
{id:'6.1',mod:6,n:'6.1',title:'Ridge: taming wild weights',sub:'A penalty that shrinks θ',diagram:'ridge',
 story:`When a model has many features, or features that look alike, the best-fit weights can blow up to huge opposite values that cancel — a sure sign of overfitting and of a nearly un-invertible XᵀX. Ridge regression adds a small, gentle penalty on the size of the weights. We no longer only minimise the gaps; we also pay a price, δ² times the squared length of θ, for using big weights. The solution barely changes form: just add δ² to the diagonal of XᵀX before inverting. The effect is to shrink the weights toward zero, giving a smoother, steadier fit — a little more bias for a lot less variance.`,
 worked:`<div class="work"><div class="line">Ridge cost:  C = (y − Xθ)ᵀ(y − Xθ) + δ²·θᵀθ</div>
<div class="line">Solution:  θ̂ = (XᵀX + δ²I)⁻¹ Xᵀy</div>
<div class="line">Example (0,1),(1,3),(2,5), δ² = 1:</div>
<div class="line">   XᵀX = (3 3 / 3 5),  +δ²I → (4 3 / 3 6),  Xᵀy = (9, 13)</div>
<div class="line">   det = 24 − 9 = 15</div>
<div class="line res">   θ̂ = (1, 1.667)   — slope shrinks from 2 toward 0</div></div>`,
 formula:{grid:MX([['θ̂','=','(XᵀX + δ²I)⁻¹ Xᵀy']]),
  symbols:[['δ²','the penalty strength — how hard we discourage big weights'],['θᵀθ','the squared length of the weight vector (its size)'],['I','the identity matrix — adds δ² to each diagonal entry'],['shrinkage','the weights get pulled toward zero'],['ill-conditioning','when XᵀX is nearly singular; δ²I fixes it']]},
 why:['Adding δ²θᵀθ charges a price for large weights, so the fit prefers smaller ones.','Differentiating gives XᵀX θ + δ²θ = Xᵀy, i.e. (XᵀX + δ²I)θ = Xᵀy.','The extra δ²I lifts the diagonal, making the matrix safely invertible.','More δ² means more shrinkage: smoother, less wiggly, slightly biased.'],
 mistakes:['Penalising the intercept θ₀ as well — usually we leave the bias term out of the penalty.','Thinking ridge changes the formula shape. It only adds δ²I to XᵀX.','Expecting weights to hit exactly zero. Ridge shrinks them but rarely zeroes them (that is the L1/lasso penalty).'],
 exam:['"Write the ridge solution and compute it for (0,1),(1,3),(2,5) with δ²=1." (θ̂ = (1, 1.667)).','"What does increasing δ² do to the weights and to bias/variance?" (shrinks weights; raises bias, lowers variance).'],
 practice:[
  say('Stage 1 — with me, data (0,1),(1,3),(2,5), δ² = 1.'),
  {t:'n',ask:'Start from XᵀX = (3 3 / 3 5). Adding δ²I = 1 to the diagonal gives (4 3 / 3 ?). What is the bottom-right entry?',fields:[['v','BR']],ans:[6],
   line:v=>`XᵀX + δ²I = (4 3 / 3 6)`,hints:['Add 1 to each diagonal entry.','5 + 1.','Bottom-right = 6.'],diag:v=>null},
  {t:'n',ask:'Determinant of (4 3 / 3 6) = 4·6 − 3·3?',fields:[['v','det']],ans:[15],
   line:v=>`det = 24 − 9 = ${fmt(v[0])}`,hints:['4·6 = 24.','3·3 = 9.','24 − 9 = 15.'],diag:v=>null},
  {t:'n',ask:'With Xᵀy = (9, 13), the solution comes out to θ̂ = (θ₀, θ₁). Give both.',fields:[['a','θ₀'],['b','θ₁']],ans:[1,1.667],tol:0.02,
   line:v=>`θ̂ = (1/15)(6·9 − 3·13 , −3·9 + 4·13) = (1/15)(15, 25) = (1, 1.667)`,
   hints:['Inverse = (1/15)(6 −3 / −3 4).','θ₀ = (54 − 39)/15 = 1.','θ₁ = (−27 + 52)/15 = 25/15 = 1.667.'],
   diag:v=>approx(v[1],2,0.01)?'That is the un-penalised slope. With δ²=1 the slope SHRINKS to 25/15 ≈ 1.667.':null},
  say('Stage 2.'),
  {t:'m',ask:'The original slope was 2; ridge gave 1.667. Ridge therefore…',opts:['grew the weight','shrank the weight toward zero','left it unchanged'],correct:1,
   hints:['1.667 < 2.','Shrinkage pulls weights down.','That is the whole point of the penalty.'],diag:['1.667 is smaller than 2, not larger.',null,'It changed — it shrank.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'What does ridge regularization do, and why add δ²I?',keywords:['penal','shrink','weight','small','invert','ill','overfit','bias','variance'],need:1,
   model:'Ridge adds a penalty δ²θᵀθ on weight size, so the fit prefers smaller weights (shrinkage), reducing overfitting. Adding δ²I to XᵀX also lifts its diagonal, curing ill-conditioning and making it safely invertible.'}
 ]},
{id:'6.2',mod:6,n:'6.2',title:'Train, test & cross-validation',sub:'Choosing δ² honestly',diagram:'kfold',
 story:`How do we pick δ², or the polynomial degree, or any such "knob"? Not by training error — that favours overfitting. We hold out data. The simplest way is one train/test split, but then our estimate depends on the luck of the split. K-fold cross-validation is better: cut the data into K equal folds, and K times over, train on K−1 folds and test on the one held out, so every point is tested exactly once. Average the K test errors. The extreme where each fold is a single point is leave-one-out (LOOCV). We pick the knob that gives the best average validation error — and we can also simply stop training early, before the model starts to overfit.`,
 formula:{grid:MX([['CV error','=','(1/K) Σₖ  error on fold k']]),
  symbols:[['K-fold','split data into K parts; each takes a turn as the test fold'],['validation error','test error on a held-out fold, used to pick knobs'],['LOOCV','leave-one-out: K equals N, each fold is one point'],['early stopping','halt training when validation error starts to rise'],['δ²','the ridge knob we are choosing']]},
 why:['Training error cannot choose knobs — it always prefers more complexity.','A single split wastes data and depends on which points landed where.','K-fold uses every point for both training and testing, averaging out the luck.','We choose the knob with the lowest average validation error — the honest best.'],
 mistakes:['Tuning δ² on the final test set. Use a validation fold; keep the test set untouched.','Thinking more folds is always better — LOOCV is accurate but can be costly.','Forgetting that the chosen model should be refit on all the data once the knob is set.'],
 exam:['"Describe K-fold cross-validation and what LOOCV is."','"Why not choose δ² by training error?" (it always prefers smaller δ² / more overfitting).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'m',ask:'In 5-fold cross-validation, how many times is each data point used for testing?',opts:['exactly once','five times','never'],correct:0,
   hints:['Each fold is the test fold once.','Across the 5 rounds, a point is tested in exactly one.','Once as test, four times as train.'],diag:[null,'It is tested once and trained on four times.','Every point is tested once.']},
  {t:'m',ask:'LOOCV (leave-one-out) means the number of folds K equals…',opts:['2','the number of points N','the number of features'],correct:1,
   hints:['Each fold is a single point.','K = N.','One point out each time.'],diag:['That is just a 2-way split.',null,'Folds are about points, not features.']},
  say('Stage 2.'),
  {t:'m',ask:'We choose δ² to minimise…',opts:['training error','average validation error','the number of features'],correct:1,
   hints:['Training error cannot judge overfitting.','Use held-out validation error.','Average it over the folds.'],diag:['Training error favours overfitting.',null,'Not about feature count.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Explain K-fold cross-validation in your own words.',keywords:['fold','split','train','test','held','average','once','K'],need:1,
   model:'Split the data into K equal folds. K times, train on K−1 folds and test on the remaining one, so each fold is the test set exactly once. Average the K test errors to estimate performance and to choose knobs like δ².'}
 ]},
/* ---------- MODULE 7 ---------- */
{id:'7.1',mod:7,n:'7.1',title:'The bell curve',sub:'The Gaussian, and what μ and σ do',diagram:'bell',
 story:`To understand why least squares is the "right" cost, we need one friendly distribution: the Gaussian, or bell curve. It describes a value that clusters around a centre, with smaller and smaller chances the further out you go. Two numbers describe it completely. The mean μ says where the peak sits. The standard deviation σ says how wide the bell spreads — small σ gives a tall, narrow spike, large σ a low, wide hill. The variance is just σ². The area under the whole curve is always 1, because some value must occur. Play with the sliders until the shape feels familiar.`,
 worked:`<div class="work"><div class="line">The 1-D Gaussian:</div>
<div class="line">   N(x | μ, σ²) = 1/(σ√(2π)) · exp( −(x−μ)²/(2σ²) )</div>
<div class="line">Peak height (at x = μ):  1/(σ√(2π))</div>
<div class="line">   σ = 1:  1/√(2π) = 0.399</div>
<div class="line">Heights at distances 0,1,2,3 from μ (σ=1):</div>
<div class="line res">   0.399,  0.242,  0.054,  0.004</div>
<div class="line" style="color:var(--muted)">The further a point sits from the centre, the lower its bell height.</div></div>`,
 formula:{grid:MX([['N(x | μ, σ²)','=','(1/σ√2π) · exp(−(x−μ)²/2σ²)']]),
  symbols:[['μ','the mean — where the peak is centred'],['σ','the standard deviation — the width of the bell'],['σ²','the variance — width squared'],['exp(−(x−μ)²/2σ²)','falls off fast as x leaves μ'],['1/(σ√2π)','the front constant that makes the area equal 1']]},
 why:['Many noisy measurements pile up symmetrically around a true value — a bell.','The squared distance in the exponent makes far-out values exponentially unlikely.','μ moves the whole curve; σ scales its width without changing the shape.','The front constant is exactly what is needed so the total area is 1.'],
 mistakes:['Confusing σ (width) with σ² (variance). The formula uses 2σ² in the denominator.','Thinking a taller peak means more total probability — the area is always 1.','Dropping the 1/(σ√2π) and getting heights that do not integrate to 1.'],
 exam:['"Write the Gaussian and label μ and σ."','"For σ = 1, give the height at the centre and one unit away." (0.399 and 0.242).'],
 practice:[
  say('Stage 1 — with me (σ = 1).'),
  {t:'n',ask:'The peak height of a σ = 1 Gaussian is 1/√(2π). To 3 decimals, what is it?',fields:[['v','peak']],ans:[0.399],tol:0.02,
   line:v=>`1/√(2π) = 1/2.5066 = ${fmt(v[0])}`,hints:['√(2π) ≈ 2.5066.','1 ÷ 2.5066.','≈ 0.399.'],diag:v=>null},
  {t:'m',ask:'A value two units from the centre has height 0.054, versus 0.399 at the centre. So the bell…',opts:['grows with distance','shrinks with distance','is flat'],correct:1,
   hints:['0.054 < 0.399.','Further out = lower.','The exponent is negative.'],diag:['It falls off, not grows.',null,'Not flat — it peaks at μ.']},
  say('Stage 2.'),
  {t:'m',ask:'Making σ smaller makes the bell…',opts:['taller and narrower','shorter and wider','unchanged'],correct:0,
   hints:['Area stays 1.','Narrower must be taller.','Small σ = sharp spike.'],diag:[null,'That is large σ.','σ definitely changes the shape.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'What do μ and σ each control in a Gaussian?',keywords:['mean','centre','center','peak','width','spread','σ','sigma','variance'],need:1,
   model:'μ (the mean) sets where the peak is centred. σ (the standard deviation) sets how wide the bell spreads — small σ gives a tall, narrow curve and large σ a low, wide one. The area under it is always 1.'}
 ]},
{id:'7.2',mod:7,n:'7.2',title:'Two dimensions: covariance',sub:'When x and y move together',diagram:'gauss2d',
 story:`Real data often has more than one number per example, and those numbers can move together. Covariance measures exactly that: do x and y tend to rise together, fall together, or ignore each other? Positive covariance means they lean the same way; negative means opposite; zero means unrelated. For a cloud of 2D points, this is captured by a small covariance matrix — the variances of x and y on the diagonal, and their covariance off the diagonal. A 2D Gaussian draws that cloud as an ellipse: round when x and y are independent, stretched and tilted when they are correlated.`,
 formula:{grid:MX([['cov[X,Y]','=','E[ (X − E[X])(Y − E[Y]) ]']]),
  symbols:[['E[X]','the mean (expected value) of X'],['X − E[X]','how far X is from its own average'],['cov[X,Y]','average of the two deviations multiplied — do they swing together?'],['covariance matrix','variances on the diagonal, covariances off it'],['2D Gaussian','a bell over the plane, drawn as an ellipse']]},
 why:['Multiplying the two deviations is positive when both are above (or both below) average.','Averaging those products tells us whether x and y move together.','Collecting all pairwise covariances gives the covariance matrix.','That matrix is exactly what shapes the 2D Gaussian\'s ellipse.'],
 mistakes:['Reading zero covariance as "no relationship at all". It means no linear relationship.','Forgetting to subtract the means before multiplying.','Mixing up variance (a value\'s own spread) with covariance (two values together).'],
 exam:['"Define covariance and say what its sign means."','"What does the off-diagonal of the covariance matrix represent?" (how the two variables co-vary).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'m',ask:'If tall people also tend to be heavier, the covariance of height and weight is…',opts:['positive','negative','zero'],correct:0,
   hints:['They rise together.','Same direction = positive.','Both above average at once → positive product.'],diag:[null,'Negative would mean taller ⇒ lighter.','Zero would mean no linear link.']},
  {t:'m',ask:'A round (circular) 2D Gaussian cloud means the covariance is…',opts:['large positive','large negative','about zero'],correct:2,
   hints:['Round = no tilt.','No tilt = no linear link.','Covariance ≈ 0.'],diag:['Positive would tilt it one way.','Negative would tilt it the other way.',null]},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'What does covariance measure, and what does its sign tell you?',keywords:['together','same','opposite','direction','move','linear','positive','negative','relationship'],need:1,
   model:'Covariance measures whether two variables move together. Positive means they tend to rise and fall together; negative means one rises as the other falls; near zero means no linear relationship.'}
 ]},
/* ---------- MODULE 8 ---------- */
{id:'8.1',mod:8,n:'8.1',title:'Probability vs likelihood',sub:'Two readings of the same bell',diagram:'likegame',
 story:`Here is a subtle but crucial flip. Probability asks: given a fixed rule, how likely is this data? Likelihood asks the reverse: given the data we actually saw, how good is this rule? Same bell curve, read the other way round. If our measurements are independent, the likelihood of the whole dataset is the product of each point's bell height — because independent chances multiply. To find the best rule, we slide it around and pick the setting that makes this product as large as possible. That is maximum likelihood: choose the parameters under which the observed data was most probable.`,
 worked:`<div class="work"><div class="line">Three measurements from N(θ, 1):  y = 1, 0.5, 1.5</div>
<div class="line">Try θ = 1.  Bell heights:</div>
<div class="line">   N(1 | 1,1) = 0.399</div>
<div class="line">   N(0.5 | 1,1) = 0.352</div>
<div class="line">   N(1.5 | 1,1) = 0.352</div>
<div class="line">Independent ⇒ multiply:</div>
<div class="line res">   L = 0.399 · 0.352 · 0.352 = 0.0495</div>
<div class="line" style="color:var(--muted)">Slide θ and this product peaks exactly at θ = 1, the average.</div></div>`,
 formula:{grid:MX([['L(θ)','=','∏ᵢ  p(y⁽ⁱ⁾ | θ)']]),
  symbols:[['L(θ)','the likelihood — how well θ explains ALL the data'],['∏ᵢ','a product over every example (independent ⇒ multiply)'],['p(y⁽ⁱ⁾ | θ)','the bell height of point i under the rule θ'],['argmax L','maximum likelihood: the θ that makes the data most probable']]},
 why:['Probability fixes the rule and scores data; likelihood fixes the data and scores the rule.','Independent events multiply, so the whole dataset\'s likelihood is a product of heights.','Bigger product means the rule placed more probability on what we actually saw.','The best rule maximises that product — the maximum-likelihood estimate.'],
 mistakes:['Adding the point likelihoods instead of multiplying them.','Confusing the two directions: probability (rule→data) vs likelihood (data→rule).','Forgetting that this all assumes the points are independent.'],
 exam:['"Define likelihood and explain how it differs from probability."','"For y = 1, 0.5, 1.5 and θ = 1, σ = 1, compute the likelihood." (0.399·0.352·0.352 = 0.0495).'],
 practice:[
  say('Stage 1 — with me, y = 1, 0.5, 1.5, σ = 1, trying θ = 1.'),
  {t:'m',ask:'The bell height of y = 1 under N(1, 1) is largest because…',opts:['it sits exactly at the centre θ','it is farthest from θ','heights are random'],correct:0,
   hints:['Distance from θ is 0.','At the centre the bell is tallest.','0.399 is the peak.'],diag:[null,'It is closest, not farthest.','Heights follow the bell, not chance.']},
  {t:'n',ask:'The three heights are 0.399, 0.352, 0.352. Multiply them for the likelihood (3 decimals OK).',fields:[['v','L']],ans:[0.0495],tol:0.05,
   line:v=>`L = 0.399 · 0.352 · 0.352 = ${fmt(v[0]*10000)/10000}`,
   hints:['Independent ⇒ multiply, do not add.','0.399 · 0.352 ≈ 0.1405.','× 0.352 ≈ 0.0495.'],
   diag:v=>approx(v[0],1.103,0.02)?'You may have ADDED them (≈1.10). Independent data MULTIPLY: 0.399·0.352·0.352 = 0.0495.':null},
  say('Stage 2.'),
  {t:'m',ask:'Why do we multiply the per-point values rather than add them?',opts:['because the points are independent','because adding is harder','for no reason'],correct:0,
   hints:['Independent chances combine by multiplying.','Like coin flips: P(both) = P·P.','That is the product rule.'],diag:[null,'Adding is easier but wrong here.','There is a real reason: independence.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'What is the difference between probability and likelihood?',keywords:['fixed','rule','data','given','parameter','observed','reverse','direction'],need:1,
   model:'Probability fixes the rule (parameters) and asks how likely some data is. Likelihood fixes the observed data and asks how good a rule is. Maximum likelihood picks the parameters under which the data we actually saw was most probable.'}
 ]},
{id:'8.2',mod:8,n:'8.2',title:'Why we take the log',sub:'Products become sums; the best mean is the average',diagram:'logsum',
 story:`Multiplying many small probabilities gives a tiny, awkward number that is hard to handle and easy to underflow to zero. The fix is the logarithm. The log of a product is the sum of the logs, so the fiddly product of bell heights becomes a friendly sum. And because the log only ever increases, whatever maximises the likelihood also maximises its log — we lose nothing by switching. When you push this through for a Gaussian with a shared mean, the maths tidies up to a famous result: the maximum-likelihood estimate of the mean is simply the average of the data.`,
 worked:`<div class="work"><div class="line">log of a product = sum of logs:</div>
<div class="line">   ln(a·b·c) = ln a + ln b + ln c</div>
<div class="line">For the example y = 1, 0.5, 1.5, σ = 1, θ_ML = 1:</div>
<div class="line">   sum of squared gaps from the mean = 0 + 0.25 + 0.25 = 0.5</div>
