<div class="line">   −ln L = (n/2)ln(2π) + ½·(sum of squares)</div>
<div class="line">        = 1.5·1.838 + 0.25 = 2.757 + 0.25</div>
<div class="line res">   −ln L = 3.007,   and  θ_ML = average = 1</div></div>`,
 formula:{grid:MX([['ln L(θ)','=','Σᵢ  ln p(y⁽ⁱ⁾ | θ)']]),
  symbols:[['ln','natural logarithm — turns × into +'],['Σ ln p','the log-likelihood: a sum instead of a product'],['argmax of L = argmax of ln L','the log does not move the peak'],['θ_ML = ⟨y⟩','for a Gaussian mean, the best θ is the data average']]},
 why:['ln(a·b) = ln a + ln b, so logs turn the product into a sum.','Sums do not underflow and are far easier to differentiate.','ln is increasing, so it keeps the same maximising θ.','Maximising the Gaussian log-likelihood for the mean gives exactly θ = ⟨y⟩.'],
 mistakes:['Using log base 10 instead of natural log ln. The Gaussian uses e, so use ln.','Thinking the log changes the answer. It changes the arithmetic, not the best θ.','Forgetting the minus sign when switching to the negative log-likelihood to minimise.'],
 exam:['"Why take the log of the likelihood?" (product→sum; same maximiser).','"Show the ML mean equals the data average." (set d/dθ of the log-likelihood to zero).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'m',ask:'ln(a·b·c) equals…',opts:['ln a + ln b + ln c','ln a · ln b · ln c','ln(a+b+c)'],correct:0,
   hints:['Log of a product.','× becomes +.','It splits into a sum of logs.'],diag:[null,'Logs of a product add, not multiply.','Not the log of the sum.']},
  {t:'n',ask:'For y = 1, 0.5, 1.5, the ML mean is the average. Compute (1 + 0.5 + 1.5)/3.',fields:[['v','θ_ML']],ans:[1],
   line:v=>`θ_ML = 3/3 = ${fmt(v[0])}`,hints:['Add them: 3.','Divide by 3.','= 1.'],diag:v=>null},
  {t:'n',ask:'The squared gaps from the mean 1 are 0, 0.25, 0.25. Their sum?',fields:[['v','SS']],ans:[0.5],
   line:v=>`SS = 0 + 0.25 + 0.25 = ${fmt(v[0])}`,hints:['(1−1)²=0.','(0.5−1)² = 0.25, (1.5−1)² = 0.25.','0 + 0.25 + 0.25 = 0.5.'],diag:v=>null},
  say('Stage 2.'),
  {t:'m',ask:'Why can we maximise ln L instead of L?',opts:['ln is increasing, so the peak is at the same θ','ln makes L bigger','it changes the answer for the better'],correct:0,
   hints:['A monotonic function keeps the argmax.','Taller input ⇒ taller log, same location.','The best θ is unchanged.'],diag:[null,'It usually makes the number smaller (negative), not bigger.','It does not change which θ wins.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Give two reasons we work with the log-likelihood.',keywords:['product','sum','underflow','easier','derivative','monoton','same','increase'],need:1,
   model:'The log turns the product of probabilities into a sum, which avoids underflow and is far easier to differentiate. And because log is increasing, it has the same maximising θ, so nothing is lost by switching.'}
 ]},
/* ---------- MODULE 9 ---------- */
{id:'9.1',mod:9,n:'9.1',title:'A line with Gaussian noise',sub:'The model behind least squares',diagram:'mleline',
 story:`Now we connect the two halves of the chapter. We assume the data was made by a true line plus a little random wobble, and that the wobble is Gaussian noise with the same spread σ at every point. So each measured y is a draw from a bell centred on the line's prediction. Why Gaussian? It is mathematically convenient, it is often accurate, and the central limit theorem says sums of many small random effects tend to look Gaussian. We also assume the points are independent and identically distributed — i.i.d. With this picture, every point carries a bell sitting on the line, and that is the stage for maximum likelihood.`,
 formula:{grid:MX([['y⁽ⁱ⁾','=','θ₀ + θ₁x⁽ⁱ⁾ + N(0, σ²)']]),
  symbols:[['θ₀ + θ₁x','the true line\'s prediction at this x'],['N(0, σ²)','Gaussian noise: mean 0, spread σ, added on top'],['so y ~ N(xᵀθ, σ²)','each y is a bell centred on the line'],['i.i.d.','independent, and all with the same σ'],['σ','the noise width — the same at every point']]},
 why:['Measurements rarely land exactly on a line; something random is added.','Modelling that something as a zero-mean Gaussian is convenient and often realistic.','The central limit theorem makes sums of many small errors look Gaussian.','Independent, identically distributed points let the likelihood be a clean product.'],
 mistakes:['Thinking the noise shifts the line. Its mean is 0, so on average it does not.','Assuming different σ per point here. The basic model uses one shared σ.','Forgetting the i.i.d. assumption that makes the likelihood a product.'],
 exam:['"Write the Gaussian-noise model for a line and name every part."','"Give three reasons we assume Gaussian noise." (convenient, often accurate, central limit theorem).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'m',ask:'In y = θ₀ + θ₁x + N(0, σ²), the noise has mean…',opts:['0','θ₀','σ'],correct:0,
   hints:['It should not shift the line on average.','Mean 0.','The line carries the average; the noise just wobbles around it.'],diag:[null,'θ₀ is the intercept, not the noise mean.','σ is the width, not the mean.']},
  {t:'m',ask:'"i.i.d." means the points are…',opts:['independent and identically distributed','in increasing order','integer-valued'],correct:0,
   hints:['It is an abbreviation.','independent + identically distributed.','Same σ, no influence on each other.'],diag:[null,'Nothing about order.','Nothing about integers.']},
  say('Stage 2.'),
  {t:'m',ask:'Which is NOT a stated reason for assuming Gaussian noise?',opts:['it is convenient','it is often accurate','it makes the data bigger'],correct:2,
   hints:['Two reasons are about realism/ease.','Central limit theorem supports it.','One option is nonsense.'],diag:['That is a real reason.','That is a real reason.',null]},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Describe the Gaussian-noise model for line fitting.',keywords:['line','noise','gaussian','mean','σ','sigma','bell','predict','add'],need:1,
   model:'We assume each measurement is the true line θ₀ + θ₁x plus independent zero-mean Gaussian noise of width σ. So every y is a draw from a bell centred on the line\'s prediction, and all points share the same σ (i.i.d.).'}
 ]},
{id:'9.2',mod:9,n:'9.2',title:'Maximum likelihood IS least squares',sub:'The key result of the chapter',diagram:'mleline',
 story:`This is the heart of the whole chapter, and it is worth savouring. Write down the likelihood of all the data under the Gaussian-noise line. Take the negative log to turn the product into a sum. Two things happen. The first piece, (n/2)·log(2πσ²), does not contain θ at all — it is a constant for the line. The second piece is 1 over (2σ²), a fixed positive number, times the sum of squared residuals. So maximising the likelihood over θ is the same as minimising the sum of squared gaps. Maximum likelihood with Gaussian noise simply is least squares. And since σ only scales a term that does not depend on θ, changing σ never moves the best line.`,
 worked:`<div class="work"><div class="line">Likelihood of all data:</div>
<div class="line">   p(y | X; θ,σ) = (2πσ²)^(−n/2) · exp( −(1/2σ²)(y−Xθ)ᵀ(y−Xθ) )</div>
<div class="line">Negative log:</div>
<div class="line">   −ln p = (n/2)ln(2πσ²) + (1/2σ²)(y−Xθ)ᵀ(y−Xθ)</div>
<div class="line">          └─ no θ here ─┘      └─ positive const · cost ─┘</div>
<div class="line res">   θ_ML = argmin (y − Xθ)ᵀ(y − Xθ)  = least squares</div>
<div class="line" style="color:var(--muted)">Prediction of a new point:  y* ~ N(θ_MLᵀx*, σ²).</div></div>`,
 formula:{grid:MX([['−ln p','=','(n/2)ln(2πσ²) + (1/2σ²)(y−Xθ)ᵀ(y−Xθ)']]),
  symbols:[['(2πσ²)^(−n/2)','the front constant — no θ in it'],['(y−Xθ)ᵀ(y−Xθ)','the sum of squared residuals — the least-squares cost'],['1/(2σ²)','a fixed positive number — scaling does not change the argmin'],['θ_ML','the maximum-likelihood θ = the least-squares θ'],[';','the semicolon means θ is fixed but unknown, not random']]},
 why:['The log-likelihood splits into a θ-free constant plus a term in the residuals.','The residual term is a positive constant times the squared-error cost.','Maximising likelihood = minimising its negative = minimising that cost.','Because σ only scales the θ-free parts, the best line does not depend on σ.'],
 mistakes:['Thinking σ changes the best line. It scales the cost but not where its minimum sits.','Dropping the minus sign: we MINIMISE the negative log-likelihood.','Believing least squares and maximum likelihood are different methods — here they coincide.'],
 exam:['"Show that MLE with Gaussian noise gives least squares."','"Does changing σ change the ML line? Explain." (No — σ only scales a θ-free term).'],
 practice:[
  say('Stage 1 — with me, taxi receipts, best line f = 3.5 + 1.8x (C = 1.8), σ = 1.'),
  {t:'m',ask:'In −ln p, which part contains θ?',opts:['the (n/2)ln(2πσ²) part','the (1/2σ²)·(sum of squared residuals) part','neither part'],correct:1,
   hints:['θ shapes the residuals.','The residual term holds the gaps.','The front constant has no θ.'],diag:['That term has only n and σ — no θ.',null,'One part definitely does: the residuals.']},
  {t:'m',ask:'Therefore maximising the likelihood over θ is the same as…',opts:['maximising the residuals','minimising the sum of squared residuals','changing σ'],correct:1,
   hints:['Max likelihood = min negative log-likelihood.','The θ-part is a positive constant times the cost.','So minimise the cost — least squares.'],diag:['We minimise the gaps, not maximise them.',null,'σ is irrelevant to the best θ.']},
  say('Stage 2 — the −ln L numbers.'),
  {t:'n',ask:'For 4 points with σ = 1, the constant is (n/2)ln(2π) = 2·ln(2π) = 3.676. For the best line, C = 1.8, so the residual term is C/2. Give −ln L = 3.676 + C/2.',fields:[['v','−lnL']],ans:[4.576],tol:0.03,
   line:v=>`−ln L = 3.676 + 1.8/2 = 3.676 + 0.9 = ${fmt(v[0])}`,
   hints:['Residual term = C/(2σ²) = 1.8/2 = 0.9.','3.676 + 0.9.','= 4.576.'],diag:v=>null},
  {t:'m',ask:'If we now set σ = 2 instead of 1, the best LINE…',opts:['moves to a new slope','stays exactly the same','becomes flat'],correct:1,
   hints:['σ scales a term without θ.','The argmin over θ is unchanged.','Same line, different −ln L value.'],diag:['The line does not move.',null,'It does not flatten; it is unchanged.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Explain why maximum likelihood with Gaussian noise equals least squares.',keywords:['log','negative','constant','residual','square','minim','σ','sigma','cost'],need:2,
   model:'The negative log-likelihood is a θ-free constant plus 1/(2σ²) times the sum of squared residuals. Maximising likelihood means minimising this, and only the residual term depends on θ — a positive constant times the least-squares cost. So the ML estimate minimises the squared gaps, and σ (a scale on θ-free terms) does not move the best line.'}
 ]},
/* ---------- MODULE 10 ---------- */
{id:'10.1',mod:10,n:'10.1',title:'KL divergence & MLE',sub:'Matching the true distribution',diagram:'kl',
 story:`There is a deeper way to see maximum likelihood. KL divergence measures how far one probability distribution is from another — roughly, how surprised you are using distribution Q when the truth is P. It is always zero or more, and zero only when they match. But it is not symmetric: the distance from P to Q is usually different from Q to P, so it is not a true distance. The lovely fact is that maximising the likelihood is the same as minimising the KL divergence from your model to the true data distribution. As a side note, ridge regression turns out to be maximum likelihood with an extra Gaussian prior that prefers small weights.`,
 worked:`<div class="work"><div class="line">D_KL(P ‖ Q) = Σ P(i) · ln( P(i)/Q(i) )</div>
<div class="line">P = (0.5, 0.5),  Q = (0.9, 0.1):</div>
<div class="line">   0.5·ln(0.5/0.9) + 0.5·ln(0.5/0.1)</div>
<div class="line">   = 0.5·(−0.588) + 0.5·(1.609) = 0.511 nats</div>
<div class="line">Swap the order:</div>
<div class="line res">   D(Q ‖ P) = 0.368  ≠  0.511   — not symmetric</div></div>`,
 formula:{grid:MX([['D_KL(P ‖ Q)','=','Σᵢ  P(i) ln( P(i)/Q(i) )']]),
  symbols:[['P','the true distribution (the data)'],['Q','your model\'s distribution'],['ln(P/Q)','the surprise at each outcome from using Q instead of P'],['≥ 0','KL is never negative; 0 only when P = Q'],['not symmetric','D(P‖Q) ≠ D(Q‖P) in general']]},
 why:['KL weights each outcome\'s log-ratio by how often the truth P produces it.','It is zero exactly when the model matches the truth, and positive otherwise.','Maximising likelihood pushes the model Q to put probability where the data P is — minimising KL.','Swapping P and Q changes the weighting, so the two directions differ.'],
 mistakes:['Calling KL a "distance". It is not symmetric and breaks the triangle rule.','Using log base 10 when the answer is quoted in nats (natural log).','Forgetting KL ≥ 0 always, with equality only when the distributions match.'],
 exam:['"Compute D(P‖Q) and D(Q‖P) for P=(0.5,0.5), Q=(0.9,0.1)." (0.511 and 0.368 nats).','"Why is KL not a distance?" (it is not symmetric).'],
 practice:[
  say('Stage 1 — with me, P = (0.5, 0.5), Q = (0.9, 0.1).'),
  {t:'n',ask:'The first term is 0.5·ln(0.5/0.9). With ln(0.5/0.9) = −0.588, what is 0.5·(−0.588)?',fields:[['v','t1']],ans:[-0.294],tol:0.05,
   line:v=>`0.5·(−0.588) = ${fmt(v[0])}`,hints:['Just halve −0.588.','≈ −0.294.','Negative, because 0.5 < 0.9.'],diag:v=>null},
  {t:'n',ask:'The second term is 0.5·ln(0.5/0.1) = 0.5·1.609. What is it?',fields:[['v','t2']],ans:[0.805],tol:0.05,
   line:v=>`0.5·1.609 = ${fmt(v[0])}`,hints:['Halve 1.609.','≈ 0.805.','Positive, because 0.5 > 0.1.'],diag:v=>null},
  {t:'n',ask:'Add them: D(P‖Q) = −0.294 + 0.805.',fields:[['v','D']],ans:[0.511],tol:0.03,
   line:v=>`D(P‖Q) = ${fmt(v[0])} nats`,hints:['−0.294 + 0.805.','≈ 0.511.','That is in nats (natural log).'],diag:v=>null},
  say('Stage 2.'),
  {t:'m',ask:'D(P‖Q) = 0.511 but D(Q‖P) = 0.368. This shows KL is…',opts:['symmetric','not symmetric (not a true distance)','always zero'],correct:1,
   hints:['The two numbers differ.','Order matters ⇒ not symmetric.','A real distance would be equal both ways.'],diag:['They are not equal, so not symmetric.',null,'It is clearly not zero.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Why is KL divergence not a distance?',keywords:['symmetr','order','direction','not equal','P','Q','triangle'],need:1,
   model:'A distance must be symmetric, but D(P‖Q) generally does not equal D(Q‖P) — swapping the two distributions changes the value. So KL measures divergence, not a true (symmetric) distance.'}
 ]},
/* ---------- MODULE 11 ---------- */
{id:'11.1',mod:11,n:'11.1',title:'From line to probability: the sigmoid',sub:'Logistic regression begins',diagram:'sigmoid',
 story:`Classification needs an answer between 0 and 1 — a probability — not an unbounded number. So we take the familiar line score, θ₀ + θ₁x, and squash it through the sigmoid function, which gently bends any number into the range 0 to 1. A very negative score maps near 0, a very positive score near 1, and a score of 0 maps to exactly 0.5. θ₀ shifts where that half-way switch happens; θ₁ controls how sharp the switch is. The place where the probability crosses 0.5 — where the line score is zero — is the decision boundary. This is logistic regression, and it is just one neuron.`,
 worked:`<div class="work"><div class="line">Sigmoid:  σ(z) = 1 / (1 + e^(−z))</div>
<div class="line">   σ(0)  = 1/(1+1)      = 0.5</div>
<div class="line">   σ(2)  = 1/(1+e^−2)   = 0.881</div>
<div class="line">   σ(−2) = 1/(1+e^2)    = 0.119</div>
<div class="line">Model:  h(x) = σ(θ₀ + θ₁x)</div>
<div class="line res">   decide class 1 if h ≥ 0.5  ⇔  θ₀ + θ₁x ≥ 0</div>
<div class="line" style="color:var(--muted)">The boundary is where the score is zero.</div></div>`,
 formula:{grid:MX([['h(x)','=','σ(xᵀθ) = 1/(1 + e^(−xᵀθ))']]),
  symbols:[['σ(z)','the sigmoid — squashes any z into (0, 1)'],['xᵀθ','the line score θ₀ + θ₁x'],['θ₀','shifts the curve sideways — sets the boundary'],['θ₁','sets the steepness of the switch'],['h ≥ 0.5','predict class 1; the boundary is xᵀθ = 0']]},
 why:['A probability must live in [0, 1], but a line score can be anything.','The sigmoid maps the whole number line smoothly into (0, 1).','At z = 0 it gives 0.5, so the boundary is exactly where the score is zero.','θ₀ moves that zero-crossing; θ₁ makes the transition sharp or gentle.'],
 mistakes:['Using the raw line output as a probability. It can exceed 1 or go negative.','Confusing the boundary (h = 0.5) with the score itself.','Thinking a bigger θ₁ shifts the curve. It steepens it; θ₀ shifts it.'],
 exam:['"Compute σ(0), σ(2), σ(−2)." (0.5, 0.881, 0.119).','"Where is the decision boundary of logistic regression?" (where xᵀθ = 0, i.e. h = 0.5).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'n',ask:'σ(0) = 1/(1 + e^0) = 1/(1 + 1). What is it?',fields:[['v','σ(0)']],ans:[0.5],
   line:v=>`σ(0) = 1/2 = ${fmt(v[0])}`,hints:['e^0 = 1.','1/(1+1).','= 0.5.'],diag:v=>null},
  {t:'n',ask:'σ(2) = 1/(1 + e^−2). With e^−2 = 0.135, compute it (3 decimals).',fields:[['v','σ(2)']],ans:[0.881],tol:0.02,
   line:v=>`σ(2) = 1/1.135 = ${fmt(v[0])}`,hints:['1 + 0.135 = 1.135.','1 ÷ 1.135.','≈ 0.881.'],diag:v=>null},
  {t:'n',ask:'σ(−2) = 1/(1 + e^2). With e^2 = 7.389, compute it (3 decimals).',fields:[['v','σ(−2)']],ans:[0.119],tol:0.02,
   line:v=>`σ(−2) = 1/8.389 = ${fmt(v[0])}`,hints:['1 + 7.389 = 8.389.','1 ÷ 8.389.','≈ 0.119.'],diag:v=>null},
  say('Stage 2.'),
  {t:'m',ask:'The decision boundary of logistic regression is where…',opts:['h = 0.5, i.e. the score xᵀθ = 0','h = 1','x = 0'],correct:0,
   hints:['Half-way between the classes.','σ gives 0.5 when its input is 0.','So the score must be zero.'],diag:[null,'h = 1 only at +∞.','Not where x = 0 in general.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Why do we pass the line score through a sigmoid for classification?',keywords:['probability','0','1','range','squash','bound','between'],need:1,
   model:'A classifier needs a probability between 0 and 1, but the line score can be any real number. The sigmoid squashes any score into (0, 1), giving 0.5 at a score of zero — the natural decision boundary.'}
 ]},
{id:'11.2',mod:11,n:'11.2',title:'Training a classifier',sub:'Cross-entropy, gradient, and SGD',diagram:'crossent',
 story:`How do we train the sigmoid? With likelihood again. Each label is a coin flip — a Bernoulli outcome — with success chance h. The negative log-likelihood of all the labels is the binary cross-entropy loss: it is small when the model is confident and right, and it explodes when the model is confident and wrong. Minimising it has a wonderfully clean gradient: the error (h − y) times the input x. So we nudge the weights a little in the downhill direction, one example at a time — stochastic gradient descent. The update is θ ← θ + η·x·(y − h). It is the same single neuron, now learning.`,
 worked:`<div class="work"><div class="line">Loss (one example, label y, prediction h):</div>
<div class="line">   ℓ = −[ y·ln h + (1−y)·ln(1−h) ]</div>
<div class="line">   y = 1, h = 0.881:  ℓ = −ln 0.881 = 0.127</div>
<div class="line">Gradient:  ∂ℓ/∂θ = −x·(y − h) = x·(h − y)</div>
<div class="line">SGD update:  θ ← θ + η·x·(y − h)</div>
<div class="line">Step: θ=(0,0), x=(1,2), y=1, η=0.1 → h = σ(0) = 0.5</div>
<div class="line res">   θ ← (0,0) + 0.1·(1,2)·(1−0.5) = (0.05, 0.1)</div></div>`,
 formula:{grid:MX([['ℓ(θ)','=','−Σ [ y ln h + (1−y) ln(1−h) ]']]),
  symbols:[['Bernoulli','a one-flip coin: label 1 with chance h, 0 with chance 1−h'],['ℓ','binary cross-entropy — the negative log-likelihood of the labels'],['h − y','the prediction error that drives the gradient'],['η','the learning rate — how big each step is'],['θ ← θ + η x(y−h)','the SGD update, one example at a time']]},
 why:['Each label is Bernoulli with success probability h, so its likelihood is h^y (1−h)^(1−y).','The negative log of the product is the sum of binary cross-entropy terms.','Thanks to σ′ = σ(1−σ), the messy derivative collapses to simply (h − y)·x.','Taking small steps opposite the gradient lowers the loss — gradient descent.'],
 mistakes:['Forgetting the minus sign in the loss, or in the gradient direction.','Writing the update with (h − y) where it should be (y − h) for the "+η" form.','Using a huge learning rate η, which overshoots and diverges.'],
 exam:['"Compute the loss for y = 1, h = 0.881." (−ln 0.881 = 0.127).','"One SGD step: θ=(0,0), x=(1,2), y=1, η=0.1." (h=0.5 → θ = (0.05, 0.1)).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'n',ask:'Loss for y = 1 is −ln h. With h = 0.881, compute −ln 0.881 (3 decimals).',fields:[['v','ℓ']],ans:[0.127],tol:0.02,
   line:v=>`ℓ = −ln 0.881 = ${fmt(v[0])}`,hints:['ln 0.881 ≈ −0.127.','Negate it.','ℓ ≈ 0.127.'],diag:v=>null},
  say('Stage 2 — one SGD step: θ=(0,0), x=(1,2), y=1, η=0.1.'),
  {t:'n',ask:'First the prediction: h = σ(θ·x) = σ(0). What is h?',fields:[['v','h']],ans:[0.5],
   line:v=>`h = σ(0·1 + 0·2) = σ(0) = ${fmt(v[0])}`,hints:['θ·x = 0·1 + 0·2 = 0.','σ(0).','= 0.5.'],diag:v=>null},
  {t:'n',ask:'Now update θ ← θ + η·x·(y − h) = (0,0) + 0.1·(1,2)·(1 − 0.5). Give the new θ = (θ₀, θ₁).',fields:[['a','θ₀'],['b','θ₁']],ans:[0.05,0.1],
   line:v=>`θ ← 0.1·0.5·(1,2) = 0.05·(1,2) = (0.05, 0.1)`,
   hints:['y − h = 0.5; η·(y−h) = 0.1·0.5 = 0.05.','Multiply by x = (1,2).','θ = (0.05, 0.1).'],
   diag:v=>approx(v[0],0.1,0.001)?'You may have skipped the (y−h)=0.5 factor. The step is 0.1·0.5·(1,2) = (0.05, 0.1).':null},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'Why do we use cross-entropy, not squared error, to train a classifier?',keywords:['probabilit','likelihood','bernoulli','log','confident','wrong','penal','classif'],need:1,
   model:'Cross-entropy is the negative log-likelihood of the Bernoulli labels, so it matches the probabilistic model and strongly penalises confident wrong predictions. It also gives a clean gradient (h − y)·x, which squared error on a sigmoid does not.'}
 ]},
/* ---------- MODULE 12 ---------- */
{id:'12.1',mod:12,n:'12.1',title:'Many classes: softmax',sub:'Probabilities that add to one',diagram:'softmax',
 story:`Sigmoid handles two classes; softmax handles many. Give each class a raw score, then softmax exponentiates every score and divides by the total, producing probabilities that are all positive and add up to exactly one. The biggest score gets the biggest share, but every class keeps some. We train it, as always, by maximum likelihood: the loss is the cross-entropy, minus the log of the probability the model gave to the true class. Its gradient is pleasingly simple too — the predicted probability minus the true one, times the input. And a neat fact: with just two classes, softmax reduces exactly to the sigmoid.`,
 worked:`<div class="work"><div class="line">Softmax:  S(z)ᵢ = e^(zᵢ) / Σₖ e^(zₖ)</div>
<div class="line">Scores (2, 1, 0.1):</div>
<div class="line">   e² = 7.389, e¹ = 2.718, e^0.1 = 1.105,  sum = 11.212</div>
<div class="line res">   → (0.659, 0.242, 0.099)   (adds to 1)</div>
<div class="line">Cross-entropy, true class 2, predicted (0.2, 0.7, 0.1):</div>
<div class="line">   loss = −ln(0.7) = 0.357</div>
<div class="line">   gradient factor (π − y) = (0.2, −0.3, 0.1)</div></div>`,
 formula:{grid:MX([['S(z)ᵢ','=','e^(zᵢ) / Σₖ e^(zₖ)']]),

 why:['Exponentials are always positive, so every class gets a positive share.','Dividing by the total forces the shares to sum to one — a valid distribution.','The true label is one-hot, so cross-entropy keeps only −ln(probability of the true class).','Pushing that up pulls the true class\'s probability toward 1.'],
 mistakes:['Forgetting to divide by the sum, so the outputs do not add to 1.','Taking the log of the wrong class. Cross-entropy uses the TRUE class\'s probability.','Thinking softmax and sigmoid are unrelated — softmax with K = 2 is the sigmoid.'],
 exam:['"Softmax of (2, 1, 0.1)." (0.659, 0.242, 0.099).','"Cross-entropy with true class 2 and prediction (0.2, 0.7, 0.1)." (−ln 0.7 = 0.357).'],

  {t:'n',ask:'The probability of class 1 is e²/sum = 7.389/11.212 (3 decimals).',fields:[['v','p₁']],ans:[0.659],tol:0.02,
   line:v=>`p₁ = 7.389/11.212 = ${fmt(v[0])}`,hints:['Divide 7.389 by 11.212.','≈ 0.659.','The largest score gets the largest share.'],diag:v=>null},
  say('Stage 2 — cross-entropy, true class 2, prediction (0.2, 0.7, 0.1).'),

 ]},
/* ---------- MODULE 13 ---------- */
{id:'13.1',mod:13,n:'13.1',title:'One idea, three models',sub:'Everything is a negative log-likelihood',diagram:'network',
 story:`Step back and see the whole landscape in one glance. Three models have carried us through this chapter, and they are the same machine with a different last step. Linear regression assumes Gaussian noise, uses squared-error loss, and outputs a plain number. Logistic regression assumes a Bernoulli label, uses binary cross-entropy, and outputs a sigmoid probability. Softmax regression assumes a multinomial label, uses cross-entropy, and outputs a probability vector. In every case the loss is just the negative log-likelihood of the chosen noise model. Each is a tiny neural network — inputs, weights, a sum, and a final squashing step — and deep networks simply stack many such steps.`,
 worked:`<div class="work"><div class="line">model          noise         loss                 output</div>
<div class="line">─────────────────────────────────────────────────────────</div>
<div class="line">linear reg.    Gaussian      squared error        identity</div>
<div class="line">logistic       Bernoulli     binary cross-entropy  sigmoid</div>
<div class="line">softmax        multinomial   cross-entropy        softmax</div>
<div class="line res">   every loss = −log-likelihood of its noise model</div></div>`,
 formula:{grid:MX([['loss','=','−log-likelihood of the noise model']]),
  symbols:[['linear → Gaussian','squared error, identity output (a number)'],['logistic → Bernoulli','binary cross-entropy, sigmoid output (one probability)'],['softmax → multinomial','cross-entropy, softmax output (a probability vector)'],['one neuron','inputs · weights → sum → final squashing step'],['deep network','many such steps stacked, learning their own features']]},
 why:['Picking a noise model fixes the likelihood, hence the loss (its negative log).','Gaussian noise gives squared error; Bernoulli gives binary cross-entropy; multinomial gives cross-entropy.','The output function matches the noise: identity, sigmoid, softmax.','All three are single neurons; deep learning stacks and learns the features between them.'],
 mistakes:['Pairing the wrong loss with the model (e.g. squared error for classification).','Forgetting that cross-entropy is just a negative log-likelihood.','Seeing the three as unrelated rather than one recipe with three noise choices.'],
 exam:['"Fill the table: model / noise / loss / output for the three models."','"What single principle gives all three losses?" (negative log-likelihood of the noise model).'],
 practice:[
  say('Stage 1 — with me.'),
  {t:'m',ask:'The loss for linear regression is…',opts:['squared error','binary cross-entropy','softmax'],correct:0,
   hints:['It assumes Gaussian noise.','Gaussian ⇒ squared error.','That is least squares.'],diag:[null,'That is logistic regression.','Softmax is the multi-class output, not a loss for a number.']},
  {t:'m',ask:'The loss for logistic regression is…',opts:['squared error','binary cross-entropy','mean absolute error'],correct:1,
   hints:['Bernoulli labels.','Bernoulli ⇒ binary cross-entropy.','It is the negative log-likelihood of a coin flip.'],diag:['Squared error is for regression.',null,'Not MAE here.']},
  {t:'m',ask:'To turn a regression network into a classifier over many classes, add…',opts:['a softmax output and cross-entropy loss','more layers only','a bigger learning rate'],correct:0,
   hints:['Many classes need probabilities that sum to 1.','Softmax output + cross-entropy.','That is the standard classifier head.'],diag:[null,'Depth alone does not make it a classifier.','The learning rate is unrelated.']},
  say('Stage 3 — alone.'),
  {t:'ex',ask:'What single principle produces the loss for all three models?',keywords:['log','likelihood','negative','noise','probab','maximum'],need:1,
   model:'Every loss is the negative log-likelihood of the model\'s assumed noise distribution: Gaussian gives squared error, Bernoulli gives binary cross-entropy, and multinomial gives cross-entropy. Minimising the loss is maximum likelihood.'}
 ]},

{id:'14.1',mod:14,n:'14.1',title:'Explain-why drills',sub:'Say the reasons in your own words',diagram:null,
 story:`Open-book exams give the formulas, but marks are won by explaining why. This lesson is pure practice at that. Each question asks you to put one key idea into plain words, then compare with a model answer. Do not rush to the model — write your own sentence first, even a rough one, then read the model and fix the one thing you missed. These are the exact "explain why" questions the professor favours: why we square the gaps, why the cost has one minimum, why Gaussian noise, why the log, why MLE equals least squares, why not plain regression for classification, what regularization does, underfitting versus overfitting, and why KL is not a distance.`,
 formula:{grid:MX([['good answer','=','the idea + why it matters, in plain words']]),
  symbols:[['explain-why','state the reason, not just the formula'],['model answer','a short, complete version to check against'],['keywords','the core terms a marker looks for'],['your words first','write, then compare, then fix one thing']]},
 why:['Reasoning marks are separate from calculation marks, and easy to lose.','Saying an idea in your own words proves you truly understand it.','Comparing to a model answer shows exactly what was missing.','These nine questions cover the whole chapter\'s "why".'],
 mistakes:['Writing only the formula when the question says "explain why".','Reading the model answer before trying your own.','Being vague — name the specific mechanism (cancelling signs, convexity, independence, …).'],
 exam:['These ARE the exam-style "explain why" questions — rehearse every one.','In the real exam, one clear sentence with the key term usually earns the mark.'],
 practice:[
  say('Answer each in a sentence, then reveal the model answer.'),
  {t:'ex',ask:'Why do we square the residuals?',keywords:['cancel','sign','positive','big','large','punish','penal'],need:1,
   model:'Raw gaps cancel because of their signs; squaring makes them all positive and punishes big misses far more than small ones.'},
  {t:'ex',ask:'Why does the cost have exactly one minimum?',keywords:['convex','bowl','square','one','unique','global'],need:1,
   model:'It is a sum of squares, which is convex (bowl-shaped), so it has a single global minimum.'},
  {t:'ex',ask:'Why do we assume Gaussian noise?',keywords:['convenient','accurate','central limit','clt','sum','realistic'],need:1,
   model:'Because it is mathematically convenient, often accurate, and the central limit theorem makes sums of many small errors look Gaussian.'},
  {t:'ex',ask:'Why take the log of the likelihood?',keywords:['product','sum','underflow','derivative','easier','monoton','same'],need:1,
   model:'The log turns the product into a sum (no underflow, easy to differentiate) and, being increasing, keeps the same maximising parameters.'},
  {t:'ex',ask:'Why does maximum likelihood equal least squares (Gaussian noise)?',keywords:['log','constant','residual','square','minim','σ','sigma'],need:1,
   model:'The negative log-likelihood is a θ-free constant plus a positive multiple of the sum of squared residuals, so maximising likelihood minimises the squared gaps.'},
  {t:'ex',ask:'Why not use plain linear regression for classification?',keywords:['probab','0','1','range','bound','squash','unbounded','sigmoid'],need:1,
   model:'A line output is unbounded, but a class needs a probability in [0, 1]; we squash the score with a sigmoid/softmax and train with cross-entropy instead.'},
  {t:'ex',ask:'What does regularization do?',keywords:['penal','shrink','weight','small','overfit','simpl','variance'],need:1,
   model:'It penalises large weights, shrinking them toward zero to reduce overfitting — trading a little bias for much less variance.'},
  {t:'ex',ask:'Underfitting vs overfitting?',keywords:['simple','bias','flexible','variance','noise','memor','both','test'],need:2,
   model:'Underfitting is too simple (high bias, poor on both train and test); overfitting is too flexible and memorises noise (high variance, good on train but poor on test).'},
  {t:'ex',ask:'Why is KL divergence not a distance?',keywords:['symmetr','order','direction','not equal'],need:1,
   model:'Because it is not symmetric: D(P‖Q) generally differs from D(Q‖P), so it violates a basic property of a distance.'}
 ]},

function matchScale(got,ans){let s=null;for(let i=0;i<ans.length;i++){if(Math.abs(ans[i])>1e-9){s=got[i]/ans[i];break;}}
  if(s==null||!isFinite(s)||Math.abs(s)<1e-9)return false;return ans.every((a,i)=>Math.abs(got[i]-s*a)<=0.03+Math.abs(s*a)*0.03);}

const ALIAS2KEY={};_pairs.forEach(([a,k])=>{if(!(a.toLowerCase() in ALIAS2KEY))ALIAS2KEY[a.toLowerCase()]=k;});
const _esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const TERM_SRC='(?:'+_pairs.map(([a])=>_esc(a)).join('|')+')';
function annotate(root){
  if(!root)return;let re;try{re=new RegExp('\\b'+TERM_SRC+'\\b','gi');}catch(e){return;}
  const skip=n=>{let p=n.parentNode;while(p&&p!==root.parentNode){if(p.nodeType===1){const c=p.classList;
    if(c&&(c.contains('term')||c.contains('mx')||c.contains('work')||c.contains('wordchip')||c.contains('ngrid')))return true;
    if(p.dataset&&p.dataset.g)return true;
    if(p.tagName==='BUTTON'||p.tagName==='INPUT'||p.tagName==='TEXTAREA')return true;
    if(p.closest&&p.closest('svg'))return true;}p=p.parentNode;}return false;};
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    return (n.nodeValue&&n.nodeValue.trim()&&!skip(n))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const nodes=[];let nn;while(nn=walker.nextNode())nodes.push(nn);
  nodes.forEach(node=>{const text=node.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
    while((m=re.exec(text))){const key=ALIAS2KEY[m[0].toLowerCase()];if(!key)continue;
      if(!frag)frag=document.createDocumentFragment();
      if(m.index>last)frag.appendChild(document.createTextNode(text.slice(last,m.index)));
      const sp=document.createElement('span');sp.className='term';sp.dataset.g=key;sp.tabIndex=0;sp.setAttribute('role','button');sp.textContent=m[0];frag.appendChild(sp);last=m.index+m[0].length;}
    if(frag){if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));node.parentNode.replaceChild(frag,node);}});
}
function wordsIn(text,max){const plain=String(text).replace(/<[^>]+>/g,' ');let re;try{re=new RegExp('\\b'+TERM_SRC+'\\b','gi');}catch(e){return[];}
  const seen=[];let m;while((m=re.exec(plain))){const k=ALIAS2KEY[m[0].toLowerCase()];if(k&&!seen.includes(k))seen.push(k);if(seen.length>=max)break;}return seen;}

/* ========== guided practice engine ========== */
const pick=a=>a[(Math.random()*a.length)|0];
function mountPractice(host,lesson){
  const steps=lesson.practice||[];
  if(!steps.length){host.innerHTML='<p class="plain">This lesson is concept-only — no practice.</p>';return;}
  host.innerHTML=`<div class="practice"><div class="phead"><h3>Work it through, one step at a time</h3><span class="marks" id="pst"></span></div>
    <div class="pbody"><div class="workpanel" id="pwork"><span class="ph">Your working will build here as you answer…</span></div><div id="psteps"></div></div></div>`;
  const stepsEl=$('#psteps',host),workEl=$('#pwork',host),stEl=$('#pst',host);
  let idx=-1,hints=0,solvable=steps.filter(s=>s.t!=='say').length,solved=0;
  stEl.textContent=isDone(lesson.id)?`✓ done · ★ ${S.stars[lesson.id]}`:`0 / ${solvable} steps`;
  function addLine(h){if(workEl.querySelector('.ph'))workEl.innerHTML='';const d=el('div','wl');d.innerHTML=h;workEl.appendChild(d);}
  function advance(){idx++;if(idx>=steps.length)return complete();const s=steps[idx];
    if(s.t==='say'){stepsEl.appendChild(el('div',null,`<div class="plain" style="margin:16px 0 2px;font-weight:600">${s.h}</div>`));return advance();}
    renderStep(s);}
  function onSolved(s,lineHtml){solved++;stEl.textContent=`${solved} / ${solvable} steps`;if(lineHtml)addLine(lineHtml);advance();}
  function renderStep(s){
    const wrap=el('div','pstep');
    const body=el('div');
    wrap.innerHTML=`<div class="ask">${s.ask}</div>`;wrap.appendChild(body);
    const fb=el('div');wrap.appendChild(fb);
    const hintWrap=el('div','hintwrap');wrap.appendChild(hintWrap);
    const row=el('div','prow');wrap.appendChild(row);
    stepsEl.appendChild(wrap);
    let localHints=0;
    const hintBtn=el('button','btn ghost sm','💡 Hint');
    hintBtn.onclick=()=>{if(!s.hints||localHints>=s.hints.length)return;const lab=['Nudge','First line','Full solution'][localHints]||'Hint';
      hintWrap.appendChild(el('div','hintline',`<b>${lab}:</b> ${s.hints[localHints]}`));localHints++;hints++;
      if(localHints>=s.hints.length)hintBtn.disabled=true;};
    const check=el('button','btn sm','Check ✓');
    row.append(check);if(s.hints)row.append(hintBtn);
    if(s.t==='n'){
      const fields=s.fields&&s.fields.length?s.fields:[['v','answer']];
      const fWrap=el('div','fields');fields.forEach((f,i)=>fWrap.innerHTML+=`<div class="field"><label>${f[1]}</label><input id="ps_${idx}_${i}" inputmode="text" autocomplete="off"></div>`);
      body.appendChild(fWrap);
      check.onclick=()=>{const vals=fields.map((f,i)=>parseNum($('#ps_'+idx+'_'+i,wrap).value));
        if(vals.some(isNaN)){fb.className='fb no';fb.textContent='Fill every box with a number (fractions like 7/3 are fine).';return;}
        const tol=s.tol||0.03;const ok=s.scale?matchScale(vals,s.ans):s.ans.every((a,i)=>approx(vals[i],a,tol));
        if(ok){fb.className='fb ok';fb.innerHTML='✓ '+pick(['Correct!','Nice.','Exactly.','Spot on.']);
          check.disabled=true;hintBtn.disabled=true;onSolved(s,s.line?s.line(vals):'');}
        else{fb.className='fb no';const g=s.diag&&s.diag(vals);fb.innerHTML='<b>Not quite.</b> '+(g||'Check each line and try again.');}};
    }
    else if(s.t==='m'){
      const o=el('div','opts');s.opts.forEach((opt,i)=>o.innerHTML+=`<button class="opt" data-i="${i}">${opt}</button>`);body.appendChild(o);
      let sel=null;$$('.opt',o).forEach(b=>b.onclick=()=>{$$('.opt',o).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i;});
      check.onclick=()=>{if(sel==null){fb.className='fb no';fb.textContent='Pick an option first.';return;}
        const opts=$$('.opt',o);opts.forEach(x=>x.classList.remove('right','wrong'));
        if(sel===s.correct){opts[sel].classList.add('right');fb.className='fb ok';fb.innerHTML='✓ '+pick(['Correct!','Yes.','Right.']);
          check.disabled=true;hintBtn.disabled=true;onSolved(s,s.line?s.line(sel):s.opts[s.correct]);}
        else{opts[sel].classList.add('wrong');fb.className='fb no';const g=s.diag&&s.diag[sel];fb.innerHTML='<b>Not quite.</b> '+(g||'Look again.');}};
    }
    else if(s.t==='ex'){
      const ta=el('textarea');ta.style.cssText='width:100%;min-height:72px;font-size:1rem;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--fg)';
      ta.placeholder='Write one or two sentences…';body.appendChild(ta);
      const reveal=el('button','btn ghost sm','Show model answer');row.append(reveal);
      const showModel=()=>{fb.className='fb ok';fb.innerHTML=`<b>Model answer:</b> ${s.model}`;};
      reveal.onclick=()=>{showModel();if(!check.disabled){check.disabled=true;onSolved(s,'✎ '+s.ask);}};
      check.onclick=()=>{const t=ta.value.toLowerCase();const hits=s.keywords.filter(k=>t.includes(k)).length;
        if(hits>=(s.need||1)){fb.className='fb ok';fb.innerHTML=`✓ Good — you named the key idea.<br><span class="plain">Model: ${s.model}</span>`;check.disabled=true;onSolved(s,'✎ '+s.ask);}
        else{fb.className='fb no';fb.innerHTML='Close — name the key idea more directly, or tap <b>Show model answer</b>.';}};
    }
  }
  function complete(){
    const stars=Math.max(1,3-Math.min(2,Math.floor(hints/2)));
    const fresh=!isDone(lesson.id);recordStar(lesson.id,stars);
    stEl.textContent=`✓ done · ★ ${S.stars[lesson.id]}`;
    const banner=el('div','fb ok');banner.style.marginTop='14px';
    banner.innerHTML=`🎉 <b>Lesson complete!</b> ${hints?`(${hints} hint${hints>1?'s':''} used) `:''}You earned ★ ${stars}. ${moduleComplete(lesson.mod)?'<b>Module finished — nice work!</b>':''}`;
    stepsEl.appendChild(banner);buildSidebar();
    if(fresh&&moduleComplete(lesson.mod))confetti();
  }
  advance();
}

        else f.innerHTML+=`<div class="field"><label>${fd[1]}</label><input id="ex_${qi}_${pi}_${i}" inputmode="text" autocomplete="off"></div>`;});

<div class="line">Best line    θ₁=(⟨x⟩⟨y⟩−⟨xy⟩)/(⟨x⟩²−⟨x²⟩) ,  θ₀=⟨y⟩−θ₁⟨x⟩</div>
