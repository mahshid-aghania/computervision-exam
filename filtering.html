function confetti(){const c=$('#confetti');c.classList.remove('hidden');const ctx=c.getContext('2d');
  const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.scale(dpr,dpr);

    g:.33+Math.random()*.18,s:5+Math.random()*7,c:cols[(Math.random()*cols.length)|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let t=0;(function run(){t++;ctx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;

function grid(vals,cls){ /* vals: 2D array; cls(r,c,v)->extra class */
  const rows=vals.length,cols=vals[0].length;
  let h=`<div class="ngrid" style="grid-template-columns:repeat(${cols},auto)">`;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const extra=cls?cls(r,c,vals[r][c]):'';h+=`<div class="ncell ${extra}">${vals[r][c]}</div>`;}

}

/* (2) 1D slide: correlation / convolution */
DIAGRAMS.conv1d=(box)=>{
  const f=[1,3,4,0,3,4,4,4], h=[1,0,-1]; const N=f.length, out=N-2;
  box.innerHTML=`<div class="plain">The kernel <b>h</b> = [1, 0, −1] slides along the signal <b>f</b>. Read nine... three products, then add.</div>
   <div style="margin:10px 0"><div class="plain" style="margin-bottom:4px">signal f</div><div id="c1f"></div></div>
   <div style="margin:10px 0"><div class="plain" style="margin-bottom:4px">output g (fills in as you slide)</div><div id="c1g"></div></div>
   <div class="controls">${ctl('c1p','kernel position',0,out-1,1,0)}</div>
   <div class="toolrow"><span class="seg"><button id="c1corr" class="on">cross-correlation h ⋆ f</button><button id="c1conv">convolution h ∗ f</button></span></div>
   <div class="readout" id="c1o"></div>`;
  let mode='corr';
  function kern(){return mode==='corr'?h:[...h].reverse();}
  function allOut(){const k=kern();const o=[];for(let i=0;i<out;i++){let s=0;for(let j=0;j<3;j++)s+=k[j]*f[i+j];o.push(s);}return o;}
  function draw(){const p=+$('#c1p',box).value;$('#c1po',box).textContent=p;const k=kern();const o=allOut();
    $('#c1f',box).innerHTML=grid([f],(r,c)=>(c>=p&&c<=p+2)?'hot':'');
    $('#c1g',box).innerHTML=grid([o.map((v,i)=>i<=p?v:'·')],(r,c)=>{if(c>p)return 'zero';const v=o[c];return v>0?'pos':(v<0?'neg':'zero');});
    const terms=[0,1,2].map(j=>`${k[j]}·${f[p+j]}`).join(' + ');
    $('#c1o',box).innerHTML=`<span>g[${p}] = ${terms} = <b>${o[p]}</b></span>
      <span style="width:100%" class="plain">${mode==='corr'?'Correlation uses h as written.':'Convolution flips h to ['+k.join(', ')+'] first — watch the signs change.'}</span>`;}
  $('#c1p',box).oninput=draw;
  $('#c1corr',box).onclick=()=>{mode='corr';$('#c1corr',box).classList.add('on');$('#c1conv',box).classList.remove('on');draw();};
  $('#c1conv',box).onclick=()=>{mode='conv';$('#c1conv',box).classList.add('on');$('#c1corr',box).classList.remove('on');draw();};
  draw();
};

DIAGRAMS.impulse=(box)=>{
  const h=[1,2,3];
  box.innerHTML=`<div class="plain">A signal that is all 0 except a single 1 is an <b>impulse</b>. Convolve it with h = [1, 2, 3] and the output is a copy of the kernel, stamped where the 1 was (flipped).</div>

   <div style="margin:10px 0"><div class="plain">signal (impulse)</div><div id="impf"></div></div>
   <div style="margin:10px 0"><div class="plain">output = h stamped (flipped)</div><div id="impg"></div></div>
   <div class="readout" id="impo"></div>`;

    const f=Array.from({length:N},(_,i)=>i===p?1:0);
    const g=Array.from({length:N},()=>0);const k=[...h].reverse(); // convolution flips
    for(let i=0;i<N;i++){let s=0;for(let j=-1;j<=1;j++){const idx=i+j;if(idx>=0&&idx<N)s+=(f[idx]||0)*k[j+1];}g[i]=s;}

    $('#impo',box).innerHTML=`<span class="plain">Move the single 1 — the kernel copy follows it. This is why convolution with an impulse gives back the kernel (the "impulse response").</span>`;}
  $('#imp',box).oninput=draw;draw();
};

/* (8) Gaussian bell + sampled weights */
DIAGRAMS.bell=(box)=>{
  box.innerHTML=`<svg viewBox="0 0 420 220" id="belg"></svg>
   <div class="controls">${ctl('bels','sigma σ',0.6,3,0.1,1)}</div>
   <div style="margin-top:10px"><div class="plain">sampled weights (normalised so they sum to 1)</div><div id="belw"></div></div>
   <div class="readout" id="belo"></div>`;
  function draw(){const s=+$('#bels',box).value;$('#belso',box).textContent=s;
    const cx=210,base=190,A=150,sc=46;let path='M ';
    for(let px=-200;px<=200;px+=4){const x=px/sc;const y=Math.exp(-x*x/(2*s*s));path+=`${cx+px} ${base-A*y} `;}
    $('#belg',box).innerHTML=`<line x1="10" y1="${base}" x2="410" y2="${base}" stroke="var(--line)"/>
      <line x1="${cx}" y1="20" x2="${cx}" y2="${base}" stroke="var(--line)" stroke-dasharray="3 3"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
      <text x="${cx}" y="16" font-size="11" text-anchor="middle" fill="var(--muted)">peak at the centre</text>`;
    const R=Math.max(1,Math.round(2*s));const raw=[];for(let i=-R;i<=R;i++)raw.push(Math.exp(-i*i/(2*s*s)));
    const sum=raw.reduce((a,b)=>a+b,0);const w=raw.map(v=>fmt(v/sum));

/* (9) photo filter playground (canvas) */
DIAGRAMS.photofilter=(box)=>{
  const W=72,H=72;const img=new Float32Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=35+120*(x/W);
    if((x-24)*(x-24)+(y-26)*(y-26)<150)v=225;            // bright disk
    if(x>46&&x<66&&y>40&&y<64)v= (y%4<2)?70:200;         // stripes block (for edges)
    if(y>8&&y<16)v=20;                                    // dark bar
    img[y*W+x]=Math.max(0,Math.min(255,v));}
  box.innerHTML=`<div class="plain">A real picture, filtered live. Pick a filter, then drag the wipe slider to compare before (left) and after (right).</div>
   <canvas id="pfC" width="640" height="320" style="margin-top:10px;background:var(--surface2)"></canvas>
   <div class="toolrow" id="pfPick"></div>
   <div class="controls">${ctl('pfW','wipe before | after',0,100,1,50)}${ctl('pfS','Gaussian σ',0.6,3,0.1,1.2)}</div>
   <div class="readout" id="pfo"></div>`;
  const filters=['box 3×3','box 5×5','Gaussian','Sobel x','Sobel y','gradient mag','Laplacian','sharpen'];
  let cur='box 3×3';
  $('#pfPick',box).innerHTML=filters.map(f=>`<button class="minibtn${f===cur?' ':''}" data-f="${f}" style="${f===cur?'background:var(--accent);color:var(--accent-ink)':''}">${f}</button>`).join('');
  function conv(src,k,kw){const r=(kw-1)/2;const o=new Float32Array(W*H);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){let s=0;for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){
      const xx=Math.min(W-1,Math.max(0,x+i)),yy=Math.min(H-1,Math.max(0,y+j));s+=src[yy*W+xx]*k[(j+r)*kw+(i+r)];}o[y*W+x]=s;}return o;}
  function gauss(s){const r=Math.max(1,Math.round(2*s));const n=2*r+1;const k=new Float32Array(n*n);let sum=0;
    for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const v=Math.exp(-(i*i+j*j)/(2*s*s));k[(j+r)*n+(i+r)]=v;sum+=v;}
    for(let i=0;i<k.length;i++)k[i]/=sum;return{k,n};}
  function run(){const s=+$('#pfS',box).value;let signed=false;let out;
    if(cur==='box 3×3')out=conv(img,new Array(9).fill(1/9),3);
    else if(cur==='box 5×5')out=conv(img,new Array(25).fill(1/25),5);
    else if(cur==='Gaussian'){const g=gauss(s);out=conv(img,g.k,g.n);}
    else if(cur==='Sobel x'){out=conv(img,[1,0,-1,2,0,-2,1,0,-1],3);signed=true;}
    else if(cur==='Sobel y'){out=conv(img,[1,2,1,0,0,0,-1,-2,-1],3);signed=true;}
    else if(cur==='gradient mag'){const gx=conv(img,[1,0,-1,2,0,-2,1,0,-1],3),gy=conv(img,[1,2,1,0,0,0,-1,-2,-1],3);out=new Float32Array(W*H);for(let i=0;i<W*H;i++)out[i]=Math.hypot(gx[i],gy[i])/2;}
    else if(cur==='Laplacian'){out=conv(img,[0,1,0,1,-4,1,0,1,0],3);signed=true;}
    else out=conv(img,[0,-1,0,-1,5,-1,0,-1,0],3); // sharpen
    return{out,signed};}
  const cvs=$('#pfC',box),ctx=cvs.getContext('2d');
  const off=document.createElement('canvas');off.width=W;off.height=H;const octx=off.getContext('2d');
  function paint(){const{out,signed}=run();const wipe=+$('#pfW',box).value/100;
    ctx.imageSmoothingEnabled=false;
    // after (right source) on whole canvas
    const idA=octx.createImageData(W,H);for(let i=0;i<W*H;i++){let v=signed?128+out[i]:out[i];v=Math.max(0,Math.min(255,v));idA.data[i*4]=idA.data[i*4+1]=idA.data[i*4+2]=v;idA.data[i*4+3]=255;}
    ctx.clearRect(0,0,640,320);
    // draw AFTER across full width
    octx.putImageData(idA,0,0);ctx.drawImage(off,0,0,W,H,0,0,640,320);
    // draw BEFORE clipped to left of wipe
    const idB=octx.createImageData(W,H);for(let i=0;i<W*H;i++){const v=img[i];idB.data[i*4]=idB.data[i*4+1]=idB.data[i*4+2]=v;idB.data[i*4+3]=255;}
    octx.putImageData(idB,0,0);const split=Math.round(640*wipe);
    ctx.save();ctx.beginPath();ctx.rect(0,0,split,320);ctx.clip();ctx.drawImage(off,0,0,W,H,0,0,640,320);ctx.restore();
    ctx.strokeStyle='#ef8a12';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(split,0);ctx.lineTo(split,320);ctx.stroke();
    ctx.font='12px monospace';ctx.fillStyle='#ef8a12';ctx.fillText('before',6,16);ctx.fillText('after',600,16);
    $('#pfo',box).innerHTML=`<span><b>${cur}</b> — ${signed?'this filter gives signed values (grey = 0, bright = positive, dark = negative).':'a smoothing/sharpening filter (brightness stays like a photo).'}</span>`;}
  $$('[data-f]',box).forEach(b=>b.onclick=()=>{cur=b.dataset.f;$$('[data-f]',box).forEach(x=>x.style.cssText='');b.style.cssText='background:var(--accent);color:var(--accent-ink)';paint();});
  $$('#pfW,#pfS',box).forEach(i=>i.oninput=paint);paint();
};

/* (11) noise: differentiate vs smooth-then-differentiate */
DIAGRAMS.noisyedge=(box)=>{
  box.innerHTML=`<div class="plain">A real edge has noise. Differentiating raw noise gives a mess; smoothing first gives one clean peak.</div>
   <div class="toolrow"><span class="seg"><button id="neRaw" class="on">differentiate the noisy signal</button><button id="neSm">smooth, then differentiate</button></span></div>
   <svg viewBox="0 0 420 240" id="neg"></svg><div class="readout" id="neo"></div>`;
  const base=[10,11,9,10,12,48,52,88,91,89,92,90]; let mode='raw';
  function smooth(a){const o=[];for(let i=0;i<a.length;i++){const l=a[Math.max(0,i-1)],c=a[i],r=a[Math.min(a.length-1,i+1)];o.push((l+c+r)/3);}return o;}
  function deriv(a){const o=[];for(let i=0;i<a.length-1;i++)o.push(a[i+1]-a[i]);return o;}
  function draw(){const sig=mode==='raw'?base:smooth(base);const d=deriv(sig);
    const n=d.length,w=360/(n-1);let pts='',dots='';d.forEach((v,i)=>{pts+=`${30+i*w},${160-v*2.4} `;dots+=`<circle cx="${30+i*w}" cy="${160-v*2.4}" r="3" fill="${v>15?'var(--zb)':'var(--muted)'}"/>`;});
    $('#neg',box).innerHTML=`<line x1="20" y1="160" x2="400" y2="160" stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}<text x="24" y="30" font-size="12" fill="var(--muted)">derivative</text>`;
    $('#neo',box).innerHTML=`<span class="plain">${mode==='raw'?'Lots of small spikes from the noise — hard to tell which is the real edge.':'One tall clean peak — that is the edge. Rule: smooth first, then take the derivative (or use a derivative-of-Gaussian, which does both at once).'}</span>`;}
  $('#neRaw',box).onclick=()=>{mode='raw';$('#neRaw',box).classList.add('on');$('#neSm',box).classList.remove('on');draw();};
  $('#neSm',box).onclick=()=>{mode='sm';$('#neSm',box).classList.add('on');$('#neRaw',box).classList.remove('on');draw();};
  draw();
};

/* (14) pyramid: aliasing + memory */
DIAGRAMS.pyramid=(box)=>{
  box.innerHTML=`<div class="plain">To shrink, you throw away pixels. Do it without blurring and stripes turn into fake wavy patterns (aliasing). Blur first and they stay honest.</div>
   <div class="toolrow"><span class="seg"><button id="pyRaw" class="on">shrink only (aliasing)</button><button id="pyBl">blur, then shrink</button></span></div>
   <canvas id="pyC" width="560" height="120" style="margin-top:8px;background:var(--surface2)"></canvas>
   <div class="controls">${ctl('pyN','image size N = 2^p',16,512,1,256)}</div>
   <div class="readout" id="pyo"></div>`;
  const cvs=$('#pyC',box),ctx=cvs.getContext('2d');let mode='raw';
  function base(n){const a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=(Math.floor(i/2)%2===0)?210:40;return a;} // fine stripes
  function down(a){const o=new Float32Array(a.length/2|0);for(let i=0;i<o.length;i++)o[i]=a[2*i];return o;}
  function blur(a){const o=new Float32Array(a.length);for(let i=0;i<a.length;i++){const l=a[Math.max(0,i-1)],c=a[i],r=a[Math.min(a.length-1,i+1)];o[i]=(l+2*c+r)/4;}return o;}
  function draw(){ctx.clearRect(0,0,560,120);let a=base(128);let x=10;const levels=[a];
    for(let L=0;L<3;L++){a=mode==='raw'?down(a):down(blur(a));levels.push(a);}
    levels.forEach((lv,li)=>{const cw=Math.max(1,520/128);const yy=10+li*26;for(let i=0;i<lv.length;i++){const g=Math.round(lv[i]);ctx.fillStyle=`rgb(${g},${g},${g})`;ctx.fillRect(10+i*(512/lv.length)*(128/128)/1,yy,Math.max(1,512/lv.length),18);}});
    $('#pyo',box).textContent='';draw2();}
  function draw2(){const n=+$('#pyN',box).value;$('#pyNo',box).textContent=n;const p=Math.round(Math.log2(n));const levels=p+1;const total=Math.round((4*n*n-1)/3);
    $('#pyo',box).innerHTML=`<span>N = ${n} → levels = p + 1 = <b>${levels}</b></span>
      <span>total pixels = (4N² − 1)/3 = <b>${total.toLocaleString()}</b> ≈ 4/3 · N²</span>
      <span style="width:100%" class="plain">${mode==='raw'?'Top row is the fine stripes; each row below drops every other pixel — the pattern breaks up.':'Blurring before each shrink keeps the stripes smooth and honest (respecting the Nyquist limit).'}</span>`;}
  $('#pyRaw',box).onclick=()=>{mode='raw';$('#pyRaw',box).classList.add('on');$('#pyBl',box).classList.remove('on');draw();};
  $('#pyBl',box).onclick=()=>{mode='bl';$('#pyBl',box).classList.add('on');$('#pyRaw',box).classList.remove('on');draw();};
  $('#pyN',box).oninput=draw2;draw();
};
