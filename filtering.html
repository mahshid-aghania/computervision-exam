    hints:['It sweeps across the whole image.','Each output pixel is computed from nearby input pixels.','A new grid.'],diag:['It makes a whole new image.',null,'Size can stay the same with padding.']}]},

{id:'1.2',mod:1,n:'1.2',title:'Slide, multiply, add',sub:'The one move every filter makes',diagram:'conv1d',
 story:`Here is the single action at the heart of every linear filter, and once you see it you will see it everywhere. We take a short list of weights — the kernel, written <b>h</b> — and we lay it over part of the signal. We multiply each weight by the number underneath it, add those products up, and that one sum becomes one output value. Then we slide the kernel over by one and do it again. Slide, multiply, add; slide, multiply, add. That is it. Let's watch it crawl along a 1D signal first, because 2D is just the same move in two directions.`,
 worked:`<p>Signal <span class="pt">f = [1, 3, 4, 0, 3, 4, 4, 4]</span>, kernel <kbd class="t">h = [1, 0, −1]</kbd> (convolution flips h to [−1, 0, 1]).</p>
  <div class="work"><div class="line">g[0] = −1·1 + 0·3 + 1·4 = 3</div><div class="line">g[1] = −1·3 + 0·4 + 1·0 = −3</div><div class="line">g[2] = −1·4 + 0·0 + 1·3 = −1</div><div class="line">g[3] = −1·0 + 0·3 + 1·4 = 4</div><div class="line">g[4] = −1·3 + 0·4 + 1·4 = 1</div><div class="line">g[5] = −1·4 + 0·4 + 1·4 = 0</div><div class="res">g = [3, −3, −1, 4, 1, 0]</div></div>`,
 formula:{grid:`${MX([['g[n]','=','Σ h[k] · f[n+k]']],{cap:'multiply overlapping values, then add'})}`,
   symbols:[['f','the input signal / image'],['h','the kernel (the weights)'],['g','the output'],['Σ','"add up all of these"']]},
 why:['Lay the kernel over the signal at position n.','Multiply each kernel weight by the signal value beneath it.','Add the products — this single number is the output g[n].','Shift by one and repeat; the output is built one value at a time.'],
 mistakes:['Forgetting to add the products (you must sum, not just multiply).','Letting the kernel hang off the edge without deciding a border rule.','For convolution, forgetting to flip the kernel first.'],
 exam:['"Convolve [1,3,4,0,3,4,4,4] with [1,0,−1]." (answer [3,−3,−1,4,1,0].)','"Describe the slide-multiply-add operation in one sentence."'],
 practice:[say('With me — one output at a time.'),
  {t:'n',ask:'Convolution flips h = [1,0,−1] to [−1,0,1]. Compute g[0] = −1·1 + 0·3 + 1·4.',fields:[['v','g[0]']],ans:[3],
    line:v=>`g[0] = −1·1 + 0·3 + 1·4 = ${fmt(v[0])}`,hints:['Multiply each pair, then add.','−1 + 0 + 4.','= 3.'],diag:v=>null},
  {t:'n',ask:'Now g[1] = −1·3 + 0·4 + 1·0.',fields:[['v','g[1]']],ans:[-3],
    line:v=>`g[1] = −3 + 0 + 0 = ${fmt(v[0])}`,hints:['−3 + 0 + 0.','Watch the sign.','= −3.'],diag:v=>approx(v[0],3)?'Sign slip: −1·3 = −3, so the answer is negative.':null},
  say('Half alone — keep sliding.'),
  {t:'n',ask:'g[3] = −1·0 + 0·3 + 1·4.',fields:[['v','g[3]']],ans:[4],
    line:v=>`g[3] = 0 + 0 + 4 = ${fmt(v[0])}`,hints:['0 + 0 + 4.','','= 4.'],diag:v=>null},
  say('Alone — finish the output.'),
  {t:'n',ask:'Give the last two values g[4] and g[5]. (g[4]=−1·3+0·4+1·4, g[5]=−1·4+0·4+1·4.)',fields:[['a','g[4]'],['b','g[5]']],ans:[1,0],
    line:v=>`g[4] = 1, g[5] = 0 → g = [3, −3, −1, 4, 1, 0]`,hints:['g[4] = −3 + 0 + 4.','g[5] = −4 + 0 + 4.','g[4]=1, g[5]=0.'],diag:v=>null}]},

{id:'1.3',mod:1,n:'1.3',title:'Sizes: half-width, width, output',sub:'Counting what the kernel can reach',diagram:'sizes',
 story:`Exams love to ask about sizes, and the good news is it is just careful counting. A kernel is usually odd-sized so it has a middle. We call the number of cells on each side the half-width, written <b>w</b>, so the full width is <b>2w + 1</b>. When we only keep outputs where the kernel sits fully inside the signal — the "valid" region — a signal of length N gives <b>N − 2w</b> outputs, because the kernel cannot reach the first w and last w positions. If we want the output the same size as the input, we pad the edges by exactly w. Slide the two sliders and these three little rules will become second nature.`,
 worked:`<p>Kernel half-width <kbd class="t">w = 2</kbd> (so width 5) on a signal of <kbd class="t">N = 12</kbd>.</p>
  <div class="work"><div class="line">kernel width = 2w + 1 = 2·2 + 1 = 5</div><div class="line">valid output = N − 2w = 12 − 4 = 8</div><div class="res">padding for "same" size = w = 2</div></div>
  <p class="plain">2D is the same per side: (H − 2w) × (W − 2w).</p>`,
 formula:{grid:`${MX([['width','=','2w + 1'],['valid out','=','N − 2w'],['pad (same)','=','w']],{cap:'1D; in 2D apply to H and W'})}`,
   symbols:[['w','half-width: cells on each side of the centre'],['2w+1','the full kernel width (odd)'],['N','the signal length'],['N−2w','valid output length']]},
 why:['An odd kernel of width 2w+1 has a centre plus w cells each side.','At the very start, w cells would hang off the left; at the end, w off the right.','So the centre can only sit in N − 2w places with the kernel fully inside.','Padding each edge by w restores those lost positions, giving a same-size output.'],
 mistakes:['Forgetting the "+1" — the width is 2w+1, not 2w.','Subtracting w instead of 2w for the valid output (you lose both ends).','Padding by 2w instead of w.'],
 exam:['"Output has N − 16 pixels. Find w and the kernel width." (w = 8, width 17.)','"10×10 image, 5×5 filter, no padding — output size?" (6×6.) "Padding for a 7×7 same filter?" (3.)'],
 practice:[say('With me.'),
  {t:'n',ask:'A kernel of half-width w = 8 has what width (2w+1)?',fields:[['v','width']],ans:[17],
    line:v=>`width = 2·8 + 1 = ${fmt(v[0])}`,hints:['2w + 1.','16 + 1.','17.'],diag:v=>approx(v[0],16)?'Do not forget the +1: 2·8+1 = 17.':null},
  {t:'n',ask:'If the valid output has N − 16 pixels, what is the half-width w? (N − 2w = N − 16.)',fields:[['v','w']],ans:[8],
    line:v=>`2w = 16 → w = ${fmt(v[0])}`,hints:['2w = 16.','Divide by 2.','w = 8.'],diag:v=>approx(v[0],16)?'That is 2w. Halve it: w = 8.':null},
  say('Alone — 2D sizes.'),
  {t:'n',ask:'A 10×10 image with a 5×5 filter, no padding. Output height and width? (w = 2.)',fields:[['a','out H'],['b','out W']],ans:[6,6],
    line:v=>`(10−4) × (10−4) = 6 × 6`,hints:['w = (5−1)/2 = 2.','10 − 2·2 = 6.','6 × 6.'],diag:v=>approx(v[0],8)?'You subtracted w once; subtract 2w = 4. So 6.':null},
  {t:'n',ask:'What padding makes a 7×7 filter keep the same size?',fields:[['v','pad']],ans:[3],
    line:v=>`pad = w = (7−1)/2 = ${fmt(v[0])}`,hints:['pad = w.','w = (7−1)/2.','3.'],diag:v=>approx(v[0],7)?'Pad by the half-width w = 3, not the full width.':null}]},

{id:'1.4',mod:1,n:'1.4',title:'Border modes',sub:'What to do at the edges',diagram:'borders',
 story:`At the very edge of the picture the kernel wants to read pixels that are not there, so we have to decide kindly what to pretend is outside. There are four common choices, and each has its place. "Valid" simply refuses to compute those positions, so the output is a little smaller. "Zero fill" pretends the outside is black, which can darken edges. "Repeat edge" copies the nearest real pixel outward, which is usually the gentlest. "Wrap around" takes pixels from the opposite side, as if the image were a loop. None is wrong — they are tools, and the exam just wants you to know them by name and behaviour.`,
 worked:`<div class="work"><div class="line">valid ......... compute only where the kernel fits → smaller output</div><div class="line">zero fill ..... outside = 0 (can create dark rims)</div><div class="line">repeat edge ... outside = nearest edge pixel (gentle)</div><div class="res">wrap around ... outside = the opposite end (periodic)</div></div>`,
 formula:{grid:`<p>These are policies, not a formula. Padding width is still <b>w</b> on each side; only the <i>values</i> in the pad differ.</p>`,
   symbols:[['valid','no padding; output shrinks by 2w'],['zero','pad with 0'],['repeat','pad with the edge value'],['wrap','pad from the far edge']]},
 why:['The kernel overhangs the image by w at each end.','Those missing neighbours must be given some value to multiply.','Each border mode is just a different rule for inventing those values.','The choice changes only the pixels near the border, not the middle.'],
 mistakes:['Assuming zero-padding is "neutral" — it can darken the edges.','Confusing "repeat edge" (nearest pixel) with "wrap" (opposite side).','Forgetting that "valid" changes the output size.'],
 exam:['"Name four border-handling modes and describe each in a few words."','"Which border mode can introduce a dark rim, and why?" (zero fill.)'],
 practice:[say('Checks.'),
  {t:'m',ask:'Which border mode makes the output smaller?',opts:['zero fill','repeat edge','valid'],correct:2,
    hints:['Smaller = computed nowhere it does not fit.','No padding is added.','Valid.'],diag:['Zero fill keeps the size.','Repeat keeps the size.',null]},
  {t:'m',ask:'"Wrap around" fills the missing left pixels with…',opts:['zeros','copies of the left edge','values from the right end'],correct:2,
    hints:['The image behaves like a loop.','Opposite side.','From the right end.'],diag:['That is zero fill.','That is repeat edge.',null]},
  {t:'m',ask:'Which mode is usually the gentlest (no dark rim, no jump)?',opts:['zero fill','repeat edge','wrap around'],correct:1,
    hints:['Copy the nearest real pixel.','No new darkness, no jump.','Repeat edge.'],diag:['Can darken edges.',null,'Can cause a jump between far sides.']}]},

/* ---------- MODULE 2 ---------- */
{id:'2.1',mod:2,n:'2.1',title:'Cross-correlation h ⋆ f',sub:'Slide the kernel as written',diagram:'conv1d',
 story:`Now we give that slide-multiply-add a proper name. When we lay the kernel over the signal exactly as it is written and sum the products, that is <b>cross-correlation</b>, written h ⋆ f. It is the operation your intuition already did in Module 1 — nothing is flipped. It answers a lovely question: "how much does this patch look like my kernel?" That is why template matching uses it. Keep this one firmly in mind, because the next lesson introduces its twin, convolution, which looks almost identical but flips the kernel first.`,
 worked:`<p>Three pixels <span class="pt">(10, 20, 30)</span>, kernel <kbd class="t">[1, 2, 3]</kbd>, correlation (no flip):</p>
  <div class="work"><div class="line">h ⋆ f = 1·10 + 2·20 + 3·30</div><div class="line">      = 10 + 40 + 90</div><div class="res">      = 140</div></div>`,
 formula:{grid:`${MX([['(h ⋆ f)[n]','=','Σ h[k] · f[n+k]']],{cap:'kernel used as written'})}`,
   symbols:[['⋆','cross-correlation'],['h','the kernel, used as written'],['f','the signal'],['Σ','sum over the kernel positions k']]},
 why:['Place the kernel over the signal at position n, no flipping.','Multiply each weight by the aligned signal value.','Add them up to get one output number.','Because the kernel is not flipped, correlation measures similarity to the kernel shape.'],
 mistakes:['Thinking correlation flips the kernel — it does not (convolution does).','Shifting by the wrong index when you slide.','Forgetting it measures similarity, which is why it is used for matching.'],
 exam:['"Correlate (10,20,30) with [1,2,3]." (answer 140.)','"What question does cross-correlation answer?" (how similar a patch is to the kernel.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Correlation (no flip): 1·10 + 2·20 + 3·30.',fields:[['v','h ⋆ f']],ans:[140],
    line:v=>`= 10 + 40 + 90 = ${fmt(v[0])}`,hints:['Multiply aligned pairs.','10 + 40 + 90.','140.'],diag:v=>approx(v[0],100)?'That is the convolution (flipped). Correlation keeps [1,2,3] as is: 140.':null},
  say('Alone — the sign check.'),
  {t:'m',ask:'Correlation uses the kernel…',opts:['flipped (reversed)','exactly as written','squared'],correct:1,
    hints:['Only convolution flips.','As written.','No flip.'],diag:['That is convolution.',null,'Nothing is squared.']}]},

{id:'2.2',mod:2,n:'2.2',title:'Convolution h ∗ f and the flip',sub:'The twin that reverses the kernel',diagram:'flipk',
 story:`Convolution, written h ∗ f, is almost the same operation — but first you flip the kernel. In 1D that means reversing the list; in 2D it means turning the kernel 180°. Why bother? Because convolution is the one with the beautiful algebra: it is commutative and associative, which lets us combine filters cleanly and makes the whole theory work. For many kernels the flip changes nothing, but for anything with a direction — like a derivative — it flips the sign. Our (10,20,30) example makes it concrete: correlation gave 140, convolution gives 100.`,
 worked:`<p>Pixels <span class="pt">(10, 20, 30)</span>, kernel <kbd class="t">[1, 2, 3]</kbd> flipped to <kbd class="t">[3, 2, 1]</kbd>:</p>
  <div class="work"><div class="line">h ∗ f = 3·10 + 2·20 + 1·30</div><div class="line">      = 30 + 40 + 30</div><div class="res">      = 100   (vs 140 for correlation)</div></div>`,
 formula:{grid:`${MX([['(h ∗ f)[n]','=','Σ h[k] · f[n−k]']],{cap:'note the minus: the kernel is flipped'})}`,
   symbols:[['∗','convolution'],['f[n−k]','the minus sign is the flip'],['commutative','h ∗ f = f ∗ h'],['associative','(a ∗ b) ∗ c = a ∗ (b ∗ c)']]},
 why:['Reverse the kernel (1D) or rotate it 180° (2D).','Now slide-multiply-add as usual.','The flip is what makes convolution commutative and associative.','For a symmetric kernel the flip does nothing, so correlation and convolution agree.'],
 mistakes:['Forgetting to flip — that gives correlation, not convolution.','Flipping only in 1D thinking but not rotating 180° in 2D.','Assuming the two always differ — for symmetric kernels they are equal.'],
 exam:['"Convolve (10,20,30) with [1,2,3]." (answer 100.)','"Why is convolution preferred in theory?" (commutative & associative.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Flip [1,2,3] to [3,2,1], then: 3·10 + 2·20 + 1·30.',fields:[['v','h ∗ f']],ans:[100],
    line:v=>`= 30 + 40 + 30 = ${fmt(v[0])}`,hints:['Flip first, then multiply-add.','30 + 40 + 30.','100.'],diag:v=>approx(v[0],140)?'You did not flip. Convolution uses [3,2,1]: 100.':null},
  say('Alone.'),
  {t:'m',ask:'Convolution is preferred in theory because it is…',opts:['faster','commutative and associative','always positive'],correct:1,
    hints:['Think algebra, not speed.','Order and grouping do not matter.','Commutative & associative.'],diag:['Speed is the same.',null,'It can be negative.']}]},

{id:'2.3',mod:2,n:'2.3',title:'Symmetric kernels & the impulse',sub:'Two facts worth memorising',diagram:'impulse',
 story:`Two small facts here will save you time in the exam. First: if a kernel reads the same forwards and backwards — a symmetric kernel — then flipping it changes nothing, so cross-correlation and convolution give exactly the same answer. Many smoothing kernels are symmetric, so you can relax about which one you are doing. Second: convolving any signal with a single spike (an impulse) simply stamps a copy of the kernel where the spike was. That is why the kernel is also called the "impulse response" — it is literally what the filter does to one dot of light.`,
 worked:`<p>Symmetric kernel: <span class="pt">s = (2,3,1,1,0,0,9)</span>, h = (1,0,1).</p>
  <div class="work"><div class="line">correlation = convolution (h is symmetric)</div><div class="line">g[0] = 1·2 + 0·3 + 1·1 = 3</div><div class="line">g[1] = 1·3 + 0·1 + 1·1 = 4</div><div class="line">g[2]=1, g[3]=1, g[4]=9</div><div class="res">g = [3, 4, 1, 1, 9]  (both the same)</div></div>`,
 formula:{grid:`<p>If h[k] = h[−k] (symmetric) then <b>h ⋆ f = h ∗ f</b>. And <b>f ∗ impulse = f</b> stamps the kernel at the spike.</p>`,
   symbols:[['symmetric','h reads the same reversed'],['impulse','all zeros except a single 1'],['impulse response','the kernel itself = what the filter does to a spike']]},
 why:['Flipping a symmetric list gives back the same list.','So the flipped and unflipped operations are identical.','An impulse picks out exactly one shifted copy of the kernel in the sum.','Hence the output of an impulse is the kernel, placed (flipped) at the spike.'],
 mistakes:['Recomputing both correlation and convolution for a symmetric kernel — they are equal.','Thinking the impulse response is something new — it is just the kernel.','Forgetting convolution flips the stamped copy.'],
 exam:['"s=(2,3,1,1,0,0,9), h=(1,0,1): give correlation and convolution." (both [3,4,1,1,9].)','"What is the impulse response of a filter?" (its kernel.)'],
 practice:[say('With me.'),
  {t:'n',ask:'h = (1,0,1) is symmetric. Compute g[0] = 1·2 + 0·3 + 1·1.',fields:[['v','g[0]']],ans:[3],
    line:v=>`g[0] = 2 + 0 + 1 = ${fmt(v[0])}`,hints:['2 + 0 + 1.','','= 3.'],diag:v=>null},
  {t:'n',ask:'And g[4] = 1·0 + 0·0 + 1·9.',fields:[['v','g[4]']],ans:[9],
    line:v=>`g[4] = 0 + 0 + 9 = ${fmt(v[0])} → g = [3,4,1,1,9]`,hints:['0 + 0 + 9.','','= 9.'],diag:v=>null},
  say('Alone — the fact.'),
  {t:'m',ask:'For a symmetric kernel, correlation and convolution…',opts:['are always different','give the same answer','cannot be computed'],correct:1,
    hints:['Flipping changes nothing.','Same answer.','They agree.'],diag:['Only for non-symmetric kernels.',null,'Both are fine.']},
  {t:'m',ask:'Convolving a signal with a single impulse gives…',opts:['all zeros','a copy of the kernel at the spike','the signal doubled'],correct:1,
    hints:['The kernel is "stamped".','Impulse response = kernel.','A copy of the kernel.'],diag:['The spike keeps one copy.',null,'No doubling.']}]},
/* ---------- MODULE 3 ---------- */
{id:'3.1',mod:3,n:'3.1',title:'Summing, averaging & the box filter',sub:'The simplest blur there is',diagram:'average1d',
 story:`Smoothing is the friendly art of calming a picture down, and the simplest way is to average. If you add up a little neighbourhood of pixels and divide by how many there are, each output is the local average — that is the <b>box filter</b>. Notice the weights all equal 1/n, so they sum to 1; that is the quiet rule that keeps the overall brightness unchanged. A plain summing kernel (all 1s, no divide) would just make everything brighter, which is why we divide. Watch a spiky, noisy signal settle as the 3-wide box slides across it.`,
 worked:`<p>3-tap box average of <span class="pt">[3, 2, 1, 99, 70, 72, 0, 0, 100]</span>:</p>
  <div class="work"><div class="line">(3+2+1)/3   = 2</div><div class="line">(2+1+99)/3  = 34</div><div class="line">(1+99+70)/3 = 56.7</div><div class="res">… = 2, 34, 56.7, 80.3, 47.3, 24, 33.3</div></div>
  <p class="plain">A 3×3 box patch of rows (10,10,90): sum = 330, ÷9 = 36.7.</p>`,
 formula:{grid:`${MX([['1/9','1/9','1/9'],['1/9','1/9','1/9'],['1/9','1/9','1/9']],{cap:'3×3 box: weights sum to 1'})}`,
   symbols:[['box filter','all weights equal'],['÷ n','divide by the count so weights sum to 1'],['sum to 1','keeps the average brightness unchanged']]},
 why:['Add up a neighbourhood of n pixels.','Divide by n to get the average.','Dividing makes the weights sum to 1, so brightness is preserved.','A single spike gets shared among its neighbours, so noise is reduced.'],
 mistakes:['Summing without dividing — that brightens the whole image.','Thinking a box filter removes noise perfectly — it blurs edges too.','Forgetting the weights must sum to 1 for a smoother.'],
 exam:['"3-tap average of [3,2,1,99,70,72,0,0,100]?" (2,34,56.7,80.3,47.3,24,33.3.)','"A 3×3 box on a patch of rows (10,10,90) — value?" (36.7.)'],
 practice:[say('With me.'),
  {t:'n',ask:'First 3-tap average: (3 + 2 + 1) / 3.',fields:[['v','g']],ans:[2],
    line:v=>`(3+2+1)/3 = ${fmt(v[0])}`,hints:['Add, then ÷3.','6/3.','2.'],diag:v=>approx(v[0],6)?'You forgot to divide by 3.':null},
  {t:'n',ask:'Next: (2 + 1 + 99) / 3.',fields:[['v','g']],ans:[34],
    line:v=>`102/3 = ${fmt(v[0])}`,hints:['102/3.','','34.'],diag:v=>null},
  say('Alone — the 2D box.'),
  {t:'n',ask:'A 3×3 box on a patch whose rows are all (10, 10, 90). Sum ÷ 9?',fields:[['v','g']],ans:[36.667],tol:0.02,
    line:v=>`(10+10+90)·3 / 9 = 330/9 = ${fmt(v[0])}`,hints:['Each row sums to 110; three rows = 330.','330/9.','≈ 36.7.'],diag:v=>approx(v[0],110)?'That is one row sum; use all 9 cells ÷9 = 36.7.':null}]},

{id:'3.2',mod:3,n:'3.2',title:'More blur, shift & identity',sub:'Kernels that do nothing, and more',diagram:'average1d',
 story:`A few tidy ideas round out plain smoothing. First, a bigger box averages over more pixels, so it blurs more — size controls strength. Second, meet two special kernels: the <b>identity</b>, a single 1 in the centre with zeros around it, which leaves the image untouched; and a <b>shift</b> kernel, a single 1 placed off-centre, which slides the whole image over. These feel trivial, but they are wonderful sanity checks — if your code does not pass the identity, something is wrong. And they remind you that a kernel's <i>shape</i>, not just its numbers, decides what happens.`,
 worked:`<div class="work"><div class="line">identity  (0 0 0 / 0 1 0 / 0 0 0)  → image unchanged</div><div class="line">shift     (0 0 0 / 1 0 0 / 0 0 0)  → image slides one pixel</div><div class="res">bigger box (5×5 vs 3×3)           → stronger blur</div></div>`,
 formula:{grid:`${MX([['0','0','0'],['0','1','0'],['0','0','0']],{cap:'identity: output = input'})}`,
   symbols:[['identity','centre 1, rest 0 — does nothing'],['shift','a single 1 off-centre — moves the image'],['bigger kernel','averages more pixels → more blur']]},
 why:['The identity multiplies the centre pixel by 1 and all neighbours by 0.','So each output equals its own input — nothing changes.','Moving that single 1 picks a neighbour instead, shifting the image.','A larger box includes more neighbours in each average, so the blur is stronger.'],
 mistakes:['Thinking a bigger kernel is "better" — it just blurs more and loses detail.','Confusing the identity (centre 1) with a shift (off-centre 1).','Expecting a shift to blur — it only moves.'],
 exam:['"What does the kernel (0 0 0 / 0 1 0 / 0 0 0) do?" (nothing — identity.)','"How does kernel size affect blur?" (bigger = more blur.)'],
 practice:[say('Checks.'),
  {t:'m',ask:'The kernel (0 0 0 / 0 1 0 / 0 0 0) is the…',opts:['box filter','identity (does nothing)','Sobel filter'],correct:1,
    hints:['Centre 1, rest 0.','Output = input.','Identity.'],diag:['The box has all equal weights.',null,'Sobel has minus signs.']},
  {t:'m',ask:'A larger box filter (5×5 instead of 3×3)…',opts:['blurs less','blurs more','sharpens'],correct:1,
    hints:['More pixels averaged.','More smoothing.','Blurs more.'],diag:['More pixels = more blur.',null,'Averaging never sharpens.']},
  {t:'m',ask:'A single 1 placed OFF-centre makes a…',opts:['shift of the image','blur','edge detector'],correct:0,
    hints:['It picks a neighbour.','The picture moves over.','A shift.'],diag:[null,'No averaging happens.','No minus signs.']}]},

{id:'3.3',mod:3,n:'3.3',title:'The Gaussian filter',sub:'A smooth, round, weighted blur',diagram:'bell',
 story:`The box filter is blunt — it weights a far neighbour exactly as much as a close one, which can leave blocky artefacts. The <b>Gaussian</b> fixes this by weighting nearby pixels more, following the gentle bell curve. One number, the width <b>σ</b> (sigma), controls how wide the bell is and therefore how much it blurs. In 2D it is beautifully round and, as we will see later, separable. The famous little 3×3 Gaussian is (1 2 1 / 2 4 2 / 1 2 1) divided by 16 — and on our patch of rows (10,10,90) it gives 30, a touch different from the box's 36.7 because it leans on the centre.`,
 worked:`<p>3×3 Gaussian (÷16) on a patch of rows (10, 10, 90):</p>
  <div class="work"><div class="line">column weights: 1+2+1=4, 2+4+2=8, 1+2+1=4</div><div class="line">= (10·4 + 10·8 + 90·4) / 16</div><div class="line">= (40 + 80 + 360) / 16</div><div class="res">= 480 / 16 = 30</div></div>`,
 formula:{grid:`${MX([['1','2','1'],['2','4','2'],['1','2','1']],{cap:'÷ 16 — the 3×3 Gaussian'})}`,
   symbols:[['σ (sigma)','the width of the bell — more σ = more blur'],['G(x)','∝ e^(−x²/2σ²), the bell shape'],['÷16','normalises so weights sum to 1'],['2D','G(x)·G(y): round and separable']]},
 why:['The Gaussian weight falls off smoothly with distance from the centre.','Near pixels count more than far ones, so no blocky edges appear.','σ sets the bell width: small σ barely blurs, large σ blurs a lot.','The 2D Gaussian is the product of two 1D Gaussians — round and separable.'],
 mistakes:['Forgetting to divide by 16 (the weights must sum to 1).','Thinking σ and kernel size are the same — σ is the shape, the kernel is sampled from it.','Using a box when you wanted a smooth, artefact-free blur.'],
 exam:['"3×3 Gaussian on rows (10,10,90)?" (30.)','"Write the 3×3 Gaussian kernel and its divisor." ((1 2 1/2 4 2/1 2 1)/16.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Gaussian column weights: add the three weights in a column, 1 + 2 + 1.',fields:[['v','sum']],ans:[4],
    line:v=>`1 + 2 + 1 = ${fmt(v[0])}`,hints:['Add the column.','','4.'],diag:v=>null},
  {t:'n',ask:'Now the weighted sum ÷16: (10·4 + 10·8 + 90·4) / 16.',fields:[['v','g']],ans:[30],
    line:v=>`(40 + 80 + 360)/16 = 480/16 = ${fmt(v[0])}`,hints:['Columns weigh 4, 8, 4.','480/16.','30.'],diag:v=>approx(v[0],480)?'Divide by 16: 480/16 = 30.':null},
  say('Alone — compare.'),
  {t:'m',ask:'Why prefer a Gaussian over a box of the same size?',opts:['it is faster to type','it weights near pixels more, giving a smoother result with no blocky artefacts','it makes the image brighter'],correct:1,
    hints:['Think about the shape of the weights.','Smooth fall-off, no blockiness.','Smoother result.'],diag:['Speed is similar.',null,'Both keep brightness.']}]},

{id:'3.4',mod:3,n:'3.4',title:'Why Gaussian wins & adding blurs',sub:'Low-pass, and σ² adds',diagram:'bell',
 story:`Two results make the Gaussian the smoother of choice. First, it is a clean <b>low-pass</b> filter: it keeps the slow, large shapes and removes the fast, fine detail, without the ringing a box can cause. Second, there is a rule that feels almost magical and is a gift in exams — if you blur with a Gaussian of width σ₁ and then again with σ₂, the result is a single Gaussian whose variance is the sum: σ² = σ₁² + σ₂². So a blur of σ=3 followed by σ=4 is exactly one blur of σ=5, because 9 + 16 = 25. Variances add, not the sigmas themselves.`,
 worked:`<p>Blur with <kbd class="t">σ₁ = 3</kbd>, then <kbd class="t">σ₂ = 4</kbd>:</p>
  <div class="work"><div class="line">σ² = σ₁² + σ₂²</div><div class="line">   = 3² + 4² = 9 + 16 = 25</div><div class="res">σ = √25 = 5   (one blur of σ = 5)</div></div>`,
 formula:{grid:`${MX([['σ²','=','σ₁² + σ₂²']],{cap:'two Gaussian blurs combine'})}`,
   symbols:[['low-pass','keeps slow shapes, removes fast detail'],['σ²','the variance (σ squared)'],['adds','variances add, not the sigmas'],['√','take the square root at the end']]},
 why:['The Gaussian removes high frequencies smoothly — a clean low-pass.','Convolving two Gaussians gives another Gaussian (a special property).','Its variance is the sum of the two variances, σ₁² + σ₂².','So combine by adding squares, then square-root: here √(9+16) = 5.'],
 mistakes:['Adding the sigmas directly (3 + 4 = 7) — wrong; add the squares.','Forgetting the final square root.','Thinking two blurs are "more than one blur" — they equal a single larger one.'],
 exam:['"σ = 3 then σ = 4 — equivalent single blur?" (σ = 5.)','"Why is the Gaussian called a low-pass filter?" (keeps low frequencies, removes high.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Add the variances: 3² + 4².',fields:[['v','σ²']],ans:[25],
    line:v=>`9 + 16 = ${fmt(v[0])}`,hints:['Square each, then add.','9 + 16.','25.'],diag:v=>approx(v[0],49)?'That is (3+4)²; add the squares separately: 9+16 = 25.':null},
  {t:'n',ask:'Now the combined σ = √25.',fields:[['v','σ']],ans:[5],
    line:v=>`√25 = ${fmt(v[0])}`,hints:['Square root.','','5.'],diag:v=>approx(v[0],25)?'Take the square root: √25 = 5.':null},
  say('Alone — new numbers.'),
  {t:'n',ask:'Blur σ = 6 then σ = 8. Equivalent single σ?',fields:[['v','σ']],ans:[10],
    line:v=>`√(36+64) = √100 = ${fmt(v[0])}`,hints:['36 + 64.','√100.','10.'],diag:v=>approx(v[0],14)?'Not 6+8. Add squares: √(36+64) = 10.':null}]},

/* ---------- MODULE 4 ---------- */
{id:'4.1',mod:4,n:'4.1',title:'Finite differences',sub:'Measuring change pixel to pixel',diagram:'edgederiv',
 story:`Edges are where brightness changes quickly, so to find them we measure change — and the simplest measure of change is a subtraction. The <b>finite difference</b> f[x+1] − f[x] asks "how much did the value jump from here to the next pixel?" Written as a kernel that is just [−1, 1] (or the centred version [−1, 0, 1], which looks one step each way and is less jittery). Where the signal is flat the difference is zero; where it leaps up, the difference is big and positive. Our step signal 10,10,10,50,90,90,90 has its derivative exactly where the brightness climbs: 0,0,40,40,0,0.`,
 worked:`<p>First difference of <span class="pt">[10, 10, 10, 50, 90, 90, 90]</span> (f[x+1] − f[x]):</p>
  <div class="work"><div class="line">10−10=0, 10−10=0</div><div class="line">50−10=40, 90−50=40</div><div class="line">90−90=0, 90−90=0</div><div class="res">derivative = [0, 0, 40, 40, 0, 0]</div></div>`,
 formula:{grid:`${MX([['I_x','≈','f[x+1] − f[x]']],{cap:'kernel [−1, 1] (or centred [−1, 0, 1])'})}`,
   symbols:[['I_x','the change in x (horizontal derivative)'],['[−1, 1]','simple forward difference'],['[−1, 0, 1]','centred difference — smoother'],['flat → 0','no change gives zero']]},
 why:['Brightness change from one pixel to the next is f[x+1] − f[x].','As a sliding kernel this is [−1, 1] applied along the row.','On flat regions the difference is zero; on a rising edge it is large.','The centred version [−1, 0, 1] looks both ways and is less sensitive to single-pixel noise.'],
 mistakes:['Getting the sign backwards (f[x] − f[x+1]) and flipping the edge direction.','Expecting a non-zero derivative on a flat region.','Confusing the forward [−1,1] with the centred [−1,0,1].'],
 exam:['"First derivative of 10,10,10,50,90,90,90?" ([0,0,40,40,0,0].)','"Write the simple and centred difference kernels." ([−1,1] and [−1,0,1].)'],
 practice:[say('With me.'),
  {t:'n',ask:'Finite difference at the jump: 50 − 10.',fields:[['v','diff']],ans:[40],
    line:v=>`50 − 10 = ${fmt(v[0])}`,hints:['Next minus current.','','40.'],diag:v=>null},
  {t:'n',ask:'On a flat part: 90 − 90.',fields:[['v','diff']],ans:[0],
    line:v=>`90 − 90 = ${fmt(v[0])}`,hints:['No change.','','0.'],diag:v=>null},
  say('Alone — the whole derivative.'),
  {t:'n',ask:'Give the full first derivative of [10,10,10,50,90,90,90] (six numbers).',fields:[['a','d0'],['b','d1'],['c','d2'],['d','d3'],['e','d4'],['f','d5']],ans:[0,0,40,40,0,0],
    line:v=>`[0, 0, 40, 40, 0, 0]`,hints:['Subtract each pair.','0,0,40,40,0,0.','Two 40s where it rises.'],diag:v=>null}]},

{id:'4.2',mod:4,n:'4.2',title:'First & second derivative, zero crossing',sub:'Two ways to point at an edge',diagram:'edgederiv',
 story:`There are two ways to pin down an edge, and the exam uses both. The <b>first derivative</b> is largest right at the edge — a tall peak. The <b>second derivative</b> (the difference of the first) does something subtler and rather elegant: it swings from positive to negative and crosses through zero exactly at the edge. That zero-crossing is a precise, sub-pixel way to locate edges and is the idea behind Laplacian edge detectors. Take the first derivative [0,0,40,40,0,0] and difference it once more to get [0,40,0,−40,0] — see how it passes through zero right in the middle, at the edge.`,
 worked:`<p>Second derivative = difference of the first derivative [0, 0, 40, 40, 0, 0]:</p>
  <div class="work"><div class="line">0−0=0, 40−0=40, 40−40=0</div><div class="line">0−40=−40, 0−0=0</div><div class="res">second derivative = [0, 40, 0, −40, 0]</div></div>
  <p class="plain">It crosses zero in the middle — that zero is the edge.</p>`,
 formula:{grid:`<p>1st derivative: a <b>peak</b> at the edge. 2nd derivative: a <b>zero crossing</b> at the edge.</p>`,
   symbols:[['1st derivative','peaks at the edge'],['2nd derivative','difference of the first'],['zero crossing','where 2nd derivative = 0 → the edge'],['sub-pixel','the crossing locates the edge precisely']]},
 why:['The first derivative is biggest where brightness changes fastest — the edge.','Differencing it again gives the second derivative.','Across an edge the second derivative goes +, then −, passing through 0.','That zero crossing marks the edge location precisely.'],
 mistakes:['Looking for a peak in the second derivative — it is a zero crossing you want.','Forgetting the second derivative is just the difference of the first.','Mislabelling the sign pattern around the crossing.'],
 exam:['"Second derivative of 10,10,10,50,90,90,90?" ([0,40,0,−40,0].)','"How does the second derivative locate an edge?" (its zero crossing.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Difference the first derivative: 40 − 0 (second entry of the 2nd derivative).',fields:[['v','d']],ans:[40],
    line:v=>`40 − 0 = ${fmt(v[0])}`,hints:['Next minus current on [0,0,40,40,0,0].','','40.'],diag:v=>null},
  {t:'n',ask:'And the negative swing: 0 − 40.',fields:[['v','d']],ans:[-40],
    line:v=>`0 − 40 = ${fmt(v[0])}`,hints:['','Watch the sign.','−40.'],diag:v=>approx(v[0],40)?'It goes negative: 0 − 40 = −40.':null},
  say('Alone.'),
  {t:'m',ask:'The edge is located by the second derivative where it…',opts:['reaches its peak','crosses zero','is most negative'],correct:1,
    hints:['It swings + to −.','Through zero.','The zero crossing.'],diag:['That is the first derivative.',null,'The crossing, not the extreme.']}]},

{id:'4.3',mod:4,n:'4.3',title:'Sobel: which edges, which way',sub:'x finds vertical, y finds horizontal',diagram:'photofilter',
 story:`Now the named edge filters you must recognise. The <b>Sobel</b> pair are derivative kernels with a little built-in smoothing, which makes them robust. Sobel x has its minus signs on the left/right, so it responds to sideways changes — meaning it finds <b>vertical</b> edges. Sobel y, with minus signs top and bottom, finds <b>horizontal</b> edges. This cross-over catches everyone once: x-derivative → vertical edges. <b>Prewitt</b> is the same idea with equal weights; <b>Roberts</b> is a tiny 2×2 diagonal version. On our patch of rows (10,10,90), Sobel x gives −320 (a strong vertical edge) and Sobel y gives 0 (no horizontal change).`,
 worked:`<p>Sobel x on a patch of rows (10, 10, 90):</p>
  <div class="work"><div class="line">col weights ±(1+2+1) = ±4 on first/last columns</div><div class="line">= 4·10 − 4·90 = 40 − 360 = −320</div><div class="res">Sobel x = −320  ·  Sobel y = 0 (rows identical)</div></div>`,
 formula:{grid:`${MX([['1','0','−1'],['2','0','−2'],['1','0','−1']],{cap:'Sobel x → vertical edges'})}`,
   symbols:[['Sobel x','minus signs left/right → vertical edges'],['Sobel y','minus signs top/bottom → horizontal edges'],['Prewitt','same idea, equal weights (1s)'],['Roberts','a 2×2 diagonal difference']]},
 why:['Sobel x subtracts the right column from the left, so it measures sideways change.','A vertical edge is exactly a sideways change in brightness, so x finds it.','Sobel y subtracts bottom from top, measuring up/down change → horizontal edges.','The extra 2 in the middle row adds a little smoothing, reducing noise.'],
 mistakes:['Swapping them: x finds vertical edges, y finds horizontal (not the other way).','Forgetting the middle-row weighting that distinguishes Sobel from Prewitt.','Expecting Sobel y to respond to a patch whose rows are identical (it gives 0).'],
 exam:['"Sobel x and Sobel y on rows (10,10,90)?" (−320 and 0.)','"Which edges does Sobel x detect?" (vertical.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Sobel x on rows (10,10,90): 4·10 − 4·90.',fields:[['v','g']],ans:[-320],
    line:v=>`40 − 360 = ${fmt(v[0])}`,hints:['Left column weight +4, right −4.','40 − 360.','−320.'],diag:v=>approx(v[0],320)?'Sign: the right (90) column is subtracted, so −320.':null},
  {t:'n',ask:'Sobel y on the SAME patch (all three rows equal to 10,10,90): top row − bottom row.',fields:[['v','g']],ans:[0],
    line:v=>`identical rows → 0`,hints:['Top and bottom rows are equal.','Their difference is 0.','0.'],diag:v=>null},
  say('Alone — the rule.'),
  {t:'m',ask:'The x-derivative (Sobel x) detects…',opts:['horizontal edges','vertical edges','corners only'],correct:1,
    hints:['It measures sideways change.','Sideways change = a vertical edge.','Vertical edges.'],diag:['That is Sobel y.',null,'Edges, not just corners.']}]},

{id:'4.4',mod:4,n:'4.4',title:'Noise, then derivative of Gaussian',sub:'Smooth first, differentiate second',diagram:'noisyedge',
 story:`Derivatives have one weakness: they amplify noise, because a tiny random wiggle looks like a fast change. So if you differentiate a noisy edge directly you get a spiky mess. The cure is simple and worth remembering as a rule: <b>smooth first, then differentiate</b>. Even better, because convolution is associative, you can combine the smoothing and the differentiating into a single kernel — the <b>derivative of Gaussian</b> — which blurs and finds the edge in one pass. The result is one clean peak at the true edge instead of a field of noisy spikes.`,
 worked:`<div class="work"><div class="line">differentiate noisy signal → many false spikes</div><div class="line">smooth (Gaussian) THEN differentiate → one clean peak</div><div class="res">derivative-of-Gaussian = do both in one kernel</div></div>`,
 formula:{grid:`<p>d/dx (G ∗ f) = (d/dx G) ∗ f. Differentiating the <b>Gaussian</b> once gives a ready-made edge kernel.</p>`,
   symbols:[['noise','random wiggles the derivative exaggerates'],['smooth first','blur to calm the noise'],['DoG','derivative of Gaussian — smoothing + derivative in one'],['associative','why the two steps can merge']]},
 why:['A derivative responds to any fast change, including noise.','Smoothing first removes the fast noise but keeps the real edge.','Because convolution is associative, (derivative of Gaussian) ∗ f = derivative of (Gaussian ∗ f).','So one derivative-of-Gaussian kernel does both jobs efficiently.'],
 mistakes:['Differentiating a noisy signal directly and trusting the spikes.','Thinking smoothing destroys the edge — it keeps the real one, drops the noise.','Not realising the two steps can be merged into one kernel.'],
 exam:['"Why smooth before differentiating?" (derivatives amplify noise.)','"What is a derivative-of-Gaussian filter?" (smoothing and differentiation combined.)'],
 practice:[say('Checks.'),
  {t:'m',ask:'Why does a plain derivative struggle with a noisy edge?',opts:['it is too slow','it amplifies the noise into false spikes','it blurs the image'],correct:1,
    hints:['Noise = tiny fast changes.','Derivatives exaggerate fast changes.','It amplifies noise.'],diag:['Speed is fine.',null,'A derivative sharpens, not blurs.']},
  {t:'m',ask:'The reliable recipe for edges in noise is…',opts:['differentiate, then smooth','smooth, then differentiate (or use derivative-of-Gaussian)','differentiate twice'],correct:1,
    hints:['Calm the noise first.','Smooth, then differentiate.','Or merge into one DoG kernel.'],diag:['Order matters — smooth first.',null,'Twice makes it worse.']}]},

{id:'4.5',mod:4,n:'4.5',title:'Gradient: magnitude & direction',sub:'Combining I_x and I_y',diagram:'gradient',
 story:`Edges run in all directions, so we combine the two derivatives into one vector, the <b>gradient</b> (I_x, I_y). Its length tells you how strong the edge is — the <b>magnitude</b> √(I_x² + I_y²) — and its angle tells you which way brightness climbs — the <b>direction</b> atan(I_y / I_x). A neat fact to carry into the exam: the gradient points <i>across</i> the edge, uphill in brightness, so the edge itself runs at ninety degrees to it. The classic numbers: I_x = 3, I_y = 4 give magnitude 5 (a 3-4-5 triangle) and direction about 53.1°.`,
 worked:`<p><kbd class="t">I_x = 3</kbd>, <kbd class="t">I_y = 4</kbd>:</p>
  <div class="work"><div class="line">magnitude = √(3² + 4²) = √(9 + 16) = √25 = 5</div><div class="line">direction = atan(4 / 3)</div><div class="res">          = 53.1°</div></div>`,
 formula:{grid:`${MX([['|∇I|','=','√(I_x² + I_y²)'],['θ','=','atan(I_y / I_x)']],{cap:'strength and angle of the edge'})}`,
   symbols:[['∇I','the gradient vector (I_x, I_y)'],['|∇I|','magnitude = edge strength'],['θ','direction of steepest brightness increase'],['⟂ edge','the edge runs 90° to the gradient']]},
 why:['I_x and I_y are the change sideways and up/down.','Together they form a vector pointing uphill in brightness.','Its length √(I_x²+I_y²) is how steep the change is — the edge strength.','Its angle atan(I_y/I_x) is the direction; the edge lies perpendicular to it.'],
 mistakes:['Using atan(I_x / I_y) instead of atan(I_y / I_x).','Confusing the gradient direction with the edge direction (they are 90° apart).','Forgetting the square root in the magnitude.'],
 exam:['"I_x = 3, I_y = 4 — magnitude and direction?" (5 and 53.1°.)','"How is the edge direction related to the gradient?" (perpendicular to it.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Magnitude: √(3² + 4²).',fields:[['v','|∇I|']],ans:[5],
    line:v=>`√(9+16) = √25 = ${fmt(v[0])}`,hints:['Square, add, root.','√25.','5.'],diag:v=>approx(v[0],7)?'Not 3+4. Use √(9+16) = 5.':null},
  {t:'n',ask:'Direction: atan(4 / 3) in degrees.',fields:[['v','θ°']],ans:[53.13],tol:0.02,
    line:v=>`atan(4/3) = ${fmt(v[0])}°`,hints:['atan of 4/3.','≈ 53°.','53.1°.'],diag:v=>approx(v[0],36.87,0.02)?'That is atan(3/4). Use I_y/I_x = 4/3 → 53.1°.':null},
  say('Alone — the perpendicular fact.'),
  {t:'m',ask:'The edge itself runs…',opts:['along the gradient','perpendicular (90°) to the gradient','opposite to the gradient'],correct:1,
    hints:['The gradient points across the edge.','90° to it.','Perpendicular.'],diag:['The gradient is across, not along.',null,'Perpendicular, not opposite.']}]},

{id:'4.6',mod:4,n:'4.6',title:'Laplacian, LoG, DoG & sharpening',sub:'Second-derivative filters',diagram:'photofilter',
 story:`Let's finish edges with the second-derivative family. The <b>Laplacian</b> (0 1 0 / 1 −4 1 / 0 1 0) adds up change in all directions at once; it responds to edges as zero crossings and, unlike Sobel, it is not separable. Because a raw Laplacian is noisy, we smooth first: the <b>LoG</b> (Laplacian of Gaussian) and the very similar <b>DoG</b> (Difference of Gaussians) are the practical versions. The same idea powers <b>sharpening</b>: take the blurry parts away from the original, or equivalently add a touch of the Laplacian back, and the edges pop. That is exactly the "sharpen" slider in your photo app.`,
 worked:`<div class="work"><div class="line">Laplacian  (0 1 0 / 1 −4 1 / 0 1 0)  — sums all-direction change</div><div class="line">LoG = Laplacian of a Gaussian (smooth first)</div><div class="line">DoG = blur_small − blur_big ≈ LoG</div><div class="res">sharpen = original + a bit of (original − blur)</div></div>`,
 formula:{grid:`${MX([['0','1','0'],['1','−4','1'],['0','1','0']],{cap:'the Laplacian (weights sum to 0)'})}`,
   symbols:[['Laplacian','second derivative in all directions (sum 0)'],['LoG','Laplacian of Gaussian — smoothed'],['DoG','Difference of Gaussians ≈ LoG'],['sharpen','original + (original − blur)']]},
 why:['The Laplacian adds the second derivative in x and y, so it reacts to any curvature.','Its weights sum to zero, so flat areas give no response — only edges do.','Smoothing first (LoG/DoG) tames its noise sensitivity.','Adding the Laplacian back to the image boosts edges — that is sharpening.'],
 mistakes:['Thinking the Laplacian is separable — it is not (Sobel is).','Forgetting its weights sum to 0 (a derivative filter, not a smoother).','Confusing LoG and DoG — they are close approximations of each other.'],
 exam:['"Write the 3×3 Laplacian kernel." ((0 1 0/1 −4 1/0 1 0).)','"How does sharpening relate to blur?" (add back original − blur.)'],
 practice:[say('Checks.'),
  {t:'m',ask:'The Laplacian kernel weights sum to…',opts:['1','0','−4'],correct:1,
    hints:['Add 0+1+0+1−4+1+0+1+0.','A derivative filter sums to 0.','0.'],diag:['Smoothers sum to 1.',null,'That is just the centre.']},
  {t:'m',ask:'Which is NOT separable?',opts:['Gaussian','Sobel','Laplacian'],correct:2,
    hints:['Two of these split into a column × row.','The Laplacian needs the full 2D kernel.','Laplacian.'],diag:['Gaussian is separable.','Sobel is separable.',null]},
  {t:'m',ask:'Sharpening an image can be done by…',opts:['adding (original − blur) back to the original','averaging more','dividing by 2'],correct:0,
    hints:['Boost what the blur removed.','original + (original − blur).','Add back the detail.'],diag:[null,'That blurs more.','That darkens.']}]},
/* ---------- MODULE 5 ---------- */
{id:'5.1',mod:5,n:'5.1',title:'Name that filter in three checks',sub:'The whole family, by sight',diagram:'namefilter',
 story:`Exams love to show a kernel and ask "what is this?" — and three quick checks almost always answer it. Check one: do the weights sum to <b>1</b> or to <b>0</b>? Sum 1 means a smoother (it preserves brightness); sum 0 means a derivative/edge filter. Check two: are there <b>minus signs</b>? Minus signs mean it measures difference, so it is an edge filter. Check three: <b>which way does the sign change</b> — left-to-right means it finds vertical edges, top-to-bottom means horizontal. With those three questions you can place all thirteen named filters: identity, shift, summing, box, Gaussian, binomial [1 4 6 4 1]/16, simple and centred difference, Sobel x/y, Prewitt x/y, Roberts, derivative of Gaussian, Laplacian, and LoG/DoG. Flip through them and let the checks do the work.`,
 worked:`<div class="work"><div class="line">sum = 1, no minus  → smoother (box, Gaussian, binomial)</div><div class="line">sum = 1, single 1  → identity (centre) or shift (off-centre)</div><div class="line">sum = 0, minus L/R  → vertical-edge filter (Sobel x, Prewitt x)</div><div class="res">sum = 0, symmetric minus → Laplacian / LoG</div></div>`,
 formula:{grid:`<p>Check 1: Σweights = 1 (smoother) or 0 (edge). Check 2: minus signs? Check 3: sign-change direction → which edges.</p>`,
   symbols:[['Σ = 1','smoother: box, Gaussian [1 2 1]/4, binomial [1 4 6 4 1]/16'],['Σ = 0','edge: differences, Sobel, Prewitt, Roberts, Laplacian'],['minus L/R','vertical edges (x-derivative)'],['minus T/B','horizontal edges (y-derivative)']]},
 why:['Smoothers must keep brightness, so their weights sum to 1.','Edge filters measure change, so their weights cancel to 0 and carry minus signs.','The axis along which the sign flips tells you which edges it detects.','These three facts separate every named kernel in the course.'],
 mistakes:['Assuming any kernel with a big centre is the identity — check the surrounding weights.','Reading an x-derivative as finding horizontal edges.','Forgetting binomial smoothers (sum 1) versus difference kernels (sum 0).'],
 exam:['"Here is a kernel — name it and say what it does." (apply the three checks.)','"Is (1 0 −1 / 2 0 −2 / 1 0 −1) a smoother or an edge filter, and which edges?" (edge; vertical.)'],
 practice:[say('Classify by the checks.'),
  {t:'m',ask:'A kernel whose weights sum to 0 and that has minus signs is a…',opts:['smoother','edge/derivative filter','identity'],correct:1,
    hints:['Sum 0 = difference.','Minus signs = measuring change.','An edge filter.'],diag:['Smoothers sum to 1.',null,'Identity is a single 1.']},
  {t:'m',ask:'(1 2 1 / 2 4 2 / 1 2 1)/16 — what is it?',opts:['Sobel x','the Gaussian smoother','the Laplacian'],correct:1,
    hints:['Weights sum to 1, no minus signs.','Round, all positive.','Gaussian.'],diag:['Sobel has minus signs.',null,'Laplacian sums to 0.']},
  {t:'m',ask:'(1 0 −1 / 2 0 −2 / 1 0 −1) detects…',opts:['horizontal edges','vertical edges','nothing'],correct:1,
    hints:['Minus signs are left/right.','Sideways change = vertical edge.','Vertical edges (Sobel x).'],diag:['That would need top/bottom minus signs.',null,'It is Sobel x.']}]},

/* ---------- MODULE 6 ---------- */
{id:'6.1',mod:6,n:'6.1',title:'Separable filters: column × row',sub:'When a 2D filter splits in two',diagram:'separable',
 story:`Here is the idea that makes real-time video filters possible on a phone. Some 2D filters are secretly just a column of numbers multiplied by a row of numbers — we say the filter is <b>separable</b>, F = v hᵀ. The quick test: is every row of the kernel a multiple of the first row? If yes, it separates, and you can read off the column and row directly. The Gaussian separates (that is why it is so fast); so does Sobel. Take (1 3 1 / 3 9 3 / 1 3 1): every row is a multiple of (1, 3, 1), so it is the column (1, 3, 1) times the row (1, 3, 1).`,
 worked:`<p>Is (1 3 1 / 3 9 3 / 1 3 1) separable?</p>
  <div class="work"><div class="line">row2 = (3,9,3) = 3·(1,3,1) ✓</div><div class="line">row3 = (1,3,1) = 1·(1,3,1) ✓</div><div class="res">= column (1,3,1) × row (1,3,1)</div></div>`,
 formula:{grid:`${MX([['F','=','v · hᵀ']],{cap:'a column times a row'})}`,
   symbols:[['separable','F = v hᵀ: a column × a row'],['v','the column vector'],['hᵀ','the row vector'],['test','every row is a multiple of the first']]},
 why:['If F = v hᵀ then entry F[i,j] = v[i]·h[j].','So every row i is v[i] times the same row vector h.','Checking "is each row a multiple of row 1?" tests exactly this.','When it passes, v and h can be read straight off (and an SVD gives them in general).'],
 mistakes:['Thinking every filter separates — the Laplacian does not.','Reading the row as a multiple of a column by mistake.','Forgetting the point: separable = compute as two cheap 1D passes.'],
 exam:['"Is (1 3 1/3 9 3/1 3 1) separable? Give the parts." (yes; col (1,3,1) × row (1,3,1).)','"State the rank-1 test for separability." (every row a multiple of the first.)'],
 practice:[say('With me.'),
  {t:'n',ask:'In (1 3 1 / 3 9 3 / 1 3 1), row 2 is (3,9,3). It equals what multiple of (1,3,1)?',fields:[['v','×']],ans:[3],
    line:v=>`(3,9,3) = ${fmt(v[0])}·(1,3,1)`,hints:['3/1.','9/3.','×3.'],diag:v=>null},
  {t:'m',ask:'Since every row is a multiple of (1,3,1), the filter equals…',opts:['column (1,3,1) × row (1,3,1)','it is not separable','column (1,9,1) × row (1,1,1)'],correct:0,
    hints:['Read the shared row and the multipliers.','The multipliers are 1,3,1 — that is the column.','col (1,3,1) × row (1,3,1).'],diag:[null,'It passed the test.','Those do not multiply back.']},
  say('Alone — which one fails?'),
  {t:'m',ask:'Which of these does NOT separate?',opts:['the Gaussian','Sobel x','the Laplacian'],correct:2,
    hints:['Two split into column × row.','The Laplacian needs the full 2D kernel.','Laplacian.'],diag:['Gaussian separates.','Sobel separates.',null]}]},

{id:'6.2',mod:6,n:'6.2',title:'The cost win: k² vs 2k',sub:'Why separable is fast',diagram:'separable',
 story:`Now the payoff in plain arithmetic. A full k×k kernel costs <b>k²</b> multiplies at every pixel. But a separable filter runs as two 1D passes — a row pass then a column pass — costing only <b>2k</b> multiplies per pixel. The speed-up is k²/2k = <b>k/2</b>, which grows with the kernel. For a 31×31 filter that is 961 versus 62 multiplies, about 15.5 times faster — the difference between a laggy filter and a smooth one. Over a whole W×H image you just multiply those per-pixel costs by W·H. This single trick is why your phone can blur video in real time.`,
 worked:`<p>A <kbd class="t">31 × 31</kbd> filter on a 512×512 image:</p>
  <div class="work"><div class="line">direct    = k² = 31² = 961 mults / pixel</div><div class="line">separable = 2k = 2·31 = 62 mults / pixel</div><div class="res">speed-up = k/2 = 961/62 ≈ 15.5×</div></div>`,
 formula:{grid:`${MX([['direct','=','k²'],['separable','=','2k'],['speed-up','=','k/2']],{cap:'multiplies per pixel'})}`,
   symbols:[['k','the kernel width'],['k²','cost of the full 2D filter per pixel'],['2k','cost of two 1D passes per pixel'],['k/2','the speed-up factor']]},
 why:['A k×k kernel multiplies k² values for each output pixel.','A separable filter does a 1D pass of k (rows) then another of k (columns): 2k.','The ratio k²/(2k) = k/2 is the speed-up.','Bigger kernels gain more — the win grows linearly with k.'],
 mistakes:['Writing the speed-up as k² (it is k/2).','Forgetting the whole-image cost multiplies by W·H for both methods.','Trying to separate a non-separable filter (e.g. the Laplacian).'],
 exam:['"31×31 filter: direct, separable, and speed-up?" (961, 62, 15.5×.)','"Why are separable filters faster?" (2k vs k² per pixel.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Direct cost per pixel for a 31×31 filter: k².',fields:[['v','k²']],ans:[961],
    line:v=>`31² = ${fmt(v[0])}`,hints:['31·31.','','961.'],diag:v=>approx(v[0],62)?'That is 2k; k² = 31·31 = 961.':null},
  {t:'n',ask:'Separable cost: 2k.',fields:[['v','2k']],ans:[62],
    line:v=>`2·31 = ${fmt(v[0])}`,hints:['2·31.','','62.'],diag:v=>null},
  {t:'n',ask:'Speed-up = k/2 = 961 / 62.',fields:[['v','×']],ans:[15.5],tol:0.02,
    line:v=>`≈ ${fmt(v[0])}×`,hints:['k/2 = 31/2.','961/62.','15.5.'],diag:v=>null}]},

/* ---------- MODULE 7 ---------- */
{id:'7.1',mod:7,n:'7.1',title:'Downsampling & aliasing',sub:'Why you must blur before you shrink',diagram:'pyramid',
 story:`To make a thumbnail you shrink the image, and the obvious way — just keep every other pixel — hides a trap. If the picture has fine detail, like the stripes on a shirt, throwing away pixels can create fake wavy patterns that were never there. That is <b>aliasing</b>, and it is the same moiré you have seen on TV. The cause is sampling too coarsely for the detail present (the <b>Nyquist</b> limit). The cure is a rule worth tattooing on your memory: <b>blur before you shrink</b>. The blur removes the too-fine detail first, so what remains can be sampled honestly. Toggle the demo and watch the stripes misbehave, then behave.`,
 worked:`<div class="work"><div class="line">shrink only (drop pixels) → fake wavy moiré (aliasing)</div><div class="line">cause: detail finer than the new sampling (Nyquist)</div><div class="res">fix: blur first, THEN drop pixels</div></div>`,
 formula:{grid:`<p>Aliasing happens when detail is finer than the sampling allows (above the <b>Nyquist</b> limit). Low-pass (blur) first.</p>`,
   symbols:[['downsample','keep fewer pixels (shrink)'],['aliasing','fake patterns from too-coarse sampling'],['Nyquist','the detail limit you may keep'],['fix','blur (low-pass) before shrinking']]},
 why:['Shrinking samples the image more coarsely.','Detail finer than the new spacing cannot be represented honestly.','It folds back as false low-frequency patterns — aliasing/moiré.','Blurring first removes that fine detail, so the coarse sampling is safe.'],
 mistakes:['Shrinking by dropping pixels with no blur.','Blaming the screen for moiré instead of the sampling.','Blurring after shrinking — too late; blur before.'],
 exam:['"What causes moiré patterns when shrinking an image?" (aliasing from no blur.)','"State the rule for safe downsampling." (blur, then subsample.)'],
 practice:[say('Checks.'),
  {t:'m',ask:'Keeping every other pixel of a striped image can create…',opts:['a sharper image','fake wavy patterns (aliasing)','more colours'],correct:1,
    hints:['Think moiré on TV.','Detail too fine to sample.','Aliasing.'],diag:['It loses detail, not sharpens.',null,'It is about pattern, not colour.']},
  {t:'m',ask:'The correct order for downsampling is…',opts:['shrink, then blur','blur, then shrink','just shrink'],correct:1,
    hints:['Remove fine detail first.','Blur before dropping pixels.','Blur, then shrink.'],diag:['Too late to blur after.',null,'Shrinking alone aliases.']}]},

{id:'7.2',mod:7,n:'7.2',title:'The Gaussian pyramid',sub:'Levels and the 4/3 memory',diagram:'pyramid',
 story:`Stack those blur-then-shrink steps and you build a <b>Gaussian pyramid</b>: the original at the bottom, then each level a blurred half-size copy of the one below. It is exactly how map apps store zoom levels and how thumbnails are made. Two tidy exam facts: an image of size 2^p has <b>p + 1</b> levels (down to a single pixel), and the whole pyramid costs surprisingly little extra memory — the levels add up to 1 + 1/4 + 1/16 + … which approaches <b>4/3</b> of the original, exactly (4N² − 1)/3 pixels. So a 512×512 image (262,144 pixels, one byte each) makes a pyramid of 349,525 bytes — only a third more.`,
 worked:`<p>A <kbd class="t">512 × 512</kbd> 8-bit image:</p>
  <div class="work"><div class="line">base = 512² = 262,144 pixels (bytes)</div><div class="line">total = (4N² − 1)/3 = (4·262144 − 1)/3</div><div class="res">      = 349,525 bytes  (≈ 4/3 · base)</div></div>
  <p class="plain">256×256 → 9 levels, total 87,381 pixels.</p>`,
 formula:{grid:`${MX([['levels','=','p + 1   (N = 2^p)'],['total','=','(4N² − 1)/3']],{cap:'≈ 4/3 · N²'})}`,
   symbols:[['g₀','the original image'],['g_{i+1}','down(blur(g_i)) — half size'],['p+1','number of levels for a 2^p image'],['4/3 N²','total pixels, exactly (4N²−1)/3']]},
 why:['Each level is half the width and half the height of the one below.','So each level has 1/4 the pixels of the previous.','The sum 1 + 1/4 + 1/16 + … converges to 4/3.','For a finite 2^p image the exact total is (4N² − 1)/3 pixels.'],
 mistakes:['Counting levels as p instead of p + 1 (you reach a single pixel).','Thinking the pyramid doubles memory — it adds only about a third.','Using N² instead of the exact (4N²−1)/3 when asked for the total.'],
 exam:['"512×512 8-bit pyramid: base and total bytes?" (262,144 and 349,525.)','"256×256: number of levels and total pixels?" (9 and 87,381.)'],
 practice:[say('With me.'),
  {t:'n',ask:'For a 256×256 image, N = 2^p with p = 8. Number of levels = p + 1?',fields:[['v','levels']],ans:[9],
    line:v=>`8 + 1 = ${fmt(v[0])}`,hints:['256 = 2^8.','p + 1.','9.'],diag:v=>approx(v[0],8)?'Add one for the final single pixel: 9.':null},
  {t:'n',ask:'Total pixels of the 256×256 pyramid: (4N² − 1)/3 with N = 256.',fields:[['v','pixels']],ans:[87381],
    line:v=>`(4·65536 − 1)/3 = ${fmt(v[0])}`,hints:['N² = 65536.','(262144 − 1)/3.','87,381.'],diag:v=>approx(v[0],65536)?'That is just the base; the pyramid total is (4N²−1)/3 = 87,381.':null},
  say('Alone — the 512 case.'),
  {t:'n',ask:'A 512×512 8-bit image: base bytes and total pyramid bytes.',fields:[['a','base'],['b','total']],ans:[262144,349525],
    line:v=>`base 262,144 · total 349,525`,hints:['512² = 262,144.','(4·262144 − 1)/3.','262,144 and 349,525.'],diag:v=>null}]},

{id:'7.3',mod:7,n:'7.3',title:'Laplacian pyramid & blending',sub:'Keep the detail, rebuild exactly',diagram:'lappyr',
 story:`The Gaussian pyramid throws detail away at each level; the <b>Laplacian pyramid</b> saves it. At each level it stores the difference between the image and a blurred, upsampled version of the next level up: L_i = g_i − up(g_{i+1}). Those differences are the fine detail. The beautiful part is that you can rebuild the original exactly, from the top down: g_i = L_i + up(g_{i+1}). This is the engine behind seamless image <b>blending</b> — think of joining an apple and an orange, or stitching a panorama, where each pyramid level is blended with a feather of the right coarseness so the seam disappears.`,
 worked:`<p>For a <kbd class="t">128 × 128</kbd> image:</p>
  <div class="work"><div class="line">Gaussian levels g0 … g7 (128 down to 1)</div><div class="line">L_i = g_i − up(g_{i+1}),  i = 0 … 6</div><div class="line">keep L0 … L6 and the tiny g7</div><div class="res">rebuild: g_i = L_i + up(g_{i+1})</div></div>`,
 formula:{grid:`${MX([['L_i','=','g_i − up(g_{i+1})'],['g_i','=','L_i + up(g_{i+1})']],{cap:'store differences · rebuild exactly'})}`,
   symbols:[['L_i','the detail at level i'],['up()','upsample the smaller level'],['g_i','the Gaussian level'],['blending','combine two pyramids level by level']]},
 why:['Each Laplacian level is the detail the Gaussian blur removed.','Storing those differences plus the smallest image loses nothing.','Reversing the subtraction rebuilds each level: g_i = L_i + up(g_{i+1}).','Blending at each level with a matched feather hides seams between images.'],
 mistakes:['Forgetting to keep the smallest Gaussian level (you need it to rebuild).','Reversing the roles of L and g in the reconstruction.','Thinking the Laplacian pyramid is lossy — it rebuilds exactly.'],
 exam:['"128×128 Laplacian pyramid: what do you store?" (L0…L6 and g7.)','"How do you reconstruct g_i?" (g_i = L_i + up(g_{i+1}).)'],
 practice:[say('Checks.'),
  {t:'m',ask:'A Laplacian pyramid level stores…',opts:['a blurred copy','the detail: g_i − up(g_{i+1})','the average'],correct:1,
    hints:['It saves what the blur removed.','A difference.','g_i − up(g_{i+1}).'],diag:['That is the Gaussian pyramid.',null,'It is a difference, not an average.']},
  {t:'m',ask:'To rebuild the image you also need…',opts:['nothing else','the smallest Gaussian level g_top','the original'],correct:1,
    hints:['The differences alone are not enough.','You start from the top.','Keep g_top.'],diag:['You need a starting image.',null,'That would defeat the purpose.']},
  say('Alone — sizes.'),
  {t:'n',ask:'Downsampling a 512×512 image once gives what size?',fields:[['a','H'],['b','W']],ans:[256,256],
    line:v=>`256 × 256`,hints:['Half each side.','512/2.','256 × 256.'],diag:v=>null}]},

{id:'7.4',mod:7,n:'7.4',title:'Interpolation: nearest & bilinear',sub:'Zooming in without blocks',diagram:'bilinear',
 story:`When you pinch to zoom, the screen needs values <i>between</i> the stored pixels, so it has to invent them — that is <b>interpolation</b>. The crudest, <b>nearest neighbour</b>, just copies the closest pixel, which gives blocky squares. <b>Bilinear</b> is gentler: it blends the four surrounding pixels by how close the point is to each, using f = a₀ + a₁x + a₂y + a₃xy on the unit square. The centre of four corners is simply their average. With corners 10, 20, 30, 40, the centre is 25, and the point (0.25, 0.5) works out to 22.5. <b>Bicubic</b> goes further, using sixteen neighbours for an even smoother result.`,
 worked:`<p>Unit square, corners f(0,0)=10, f(1,0)=20, f(0,1)=30, f(1,1)=40. Point (0.25, 0.5):</p>
  <div class="work"><div class="line">f = 10(1−x)(1−y) + 20x(1−y) + 30(1−x)y + 40xy</div><div class="line">= 10·.75·.5 + 20·.25·.5 + 30·.75·.5 + 40·.25·.5</div><div class="line">= 3.75 + 2.5 + 11.25 + 5</div><div class="res">= 22.5   (centre (0.5,0.5) = 25)</div></div>`,
 formula:{grid:`${MX([['f','=','a₀ + a₁x + a₂y + a₃xy']],{cap:'bilinear on the unit square'})}`,
   symbols:[['nearest','copy the closest pixel (blocky)'],['bilinear','blend the 4 corners by distance'],['unit square','x, y run 0 → 1 between corners'],['bicubic','uses 16 neighbours — smoothest']]},
 why:['A zoomed point usually falls between stored pixels.','Nearest neighbour copies one pixel, producing blocks.','Bilinear weights each of the 4 corners by how near the point is.','At the centre all weights are 1/4, so the value is the corner average.'],
 mistakes:['Using nearest neighbour and wondering why it looks blocky.','Forgetting the (1−x) and (1−y) weights for the far corners.','Thinking the centre is the max corner — it is the average.'],
 exam:['"Bilinear at (0.25, 0.5) with corners 10,20,30,40?" (22.5.)','"What is the value at the centre of four corners?" (their average, here 25.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Centre value = average of the four corners (10, 20, 30, 40).',fields:[['v','f']],ans:[25],
    line:v=>`(10+20+30+40)/4 = ${fmt(v[0])}`,hints:['All weights are 1/4 at the centre.','100/4.','25.'],diag:v=>null},
  {t:'n',ask:'At (0.25, 0.5): 10·.375 + 20·.125 + 30·.375 + 40·.125.',fields:[['v','f']],ans:[22.5],tol:0.02,
    line:v=>`3.75 + 2.5 + 11.25 + 5 = ${fmt(v[0])}`,hints:['(1−x)(1−y)=.375, x(1−y)=.125, (1−x)y=.375, xy=.125.','Add the four.','22.5.'],diag:v=>null},
  say('Alone.'),
  {t:'m',ask:'Which interpolation gives blocky squares when you zoom in?',opts:['nearest neighbour','bilinear','bicubic'],correct:0,
    hints:['It just copies the closest pixel.','No blending.','Nearest neighbour.'],diag:[null,'Bilinear blends 4 pixels.','Bicubic is smoothest.']}]},

/* ---------- MODULE 8 ---------- */
{id:'8.1',mod:8,n:'8.1',title:'Linear, shift-invariant systems',sub:'Why every filter is a convolution',diagram:'lsi',
 story:`Let's name the deeper reason convolution is everywhere. A filter is <b>linear</b> if scaling and adding inputs scales and adds the outputs (superposition), and <b>shift-invariant</b> if moving the input simply moves the output. A system that is both is called <b>LSI</b>, and a lovely theorem says every LSI system is a convolution — so once you know a filter is linear and shift-invariant, you know it is "multiply by some kernel". That kernel is the system's response to a single impulse, which is why convolving with an impulse returns the signal unchanged: f ∗ δ = f. Convolution is also commutative, associative and distributive, which is what lets us combine and reorder filters freely.`,
 worked:`<div class="work"><div class="line">linear ........... scale & add in → scale & add out</div><div class="line">shift-invariant .. move in → output just moves</div><div class="line">⇒ the system IS a convolution with some kernel h</div><div class="res">f ∗ δ = f   (impulse does nothing)</div></div>`,
 formula:{grid:`<p>LSI ⇒ output = f ∗ h. Properties: <b>commutative</b>, <b>associative</b>, <b>distributive</b>, and <b>f ∗ δ = f</b>.</p>`,
   symbols:[['linear','superposition holds'],['shift-invariant','move input → move output'],['LSI ⇒ convolution','the key theorem'],['δ (impulse)','f ∗ δ = f']]},
 why:['Any input is a sum of shifted, scaled impulses.','Linearity lets the system act on each impulse separately and add.','Shift-invariance means each impulse produces the same response, just shifted.','Adding those shifted responses is exactly a convolution with the impulse response.'],
 mistakes:['Assuming all image operations are LSI — some (like thresholding) are not.','Forgetting f ∗ δ = f (the impulse is the identity of convolution).','Confusing linearity with shift-invariance — a system needs both.'],
 exam:['"Why is every LSI system a convolution?" (superposition of shifted impulse responses.)','"What is f ∗ δ?" (f.)'],
 practice:[say('Checks.'),
  {t:'m',ask:'A system is LSI when it is…',opts:['linear only','linear AND shift-invariant','fast'],correct:1,
    hints:['Two properties.','Superposition and shift.','Both.'],diag:['Also needs shift-invariance.',null,'Speed is unrelated.']},
  {t:'m',ask:'Convolving a signal with an impulse δ gives…',opts:['zero','the signal unchanged (f)','the kernel'],correct:1,
    hints:['δ is the identity of convolution.','f ∗ δ = f.','The signal itself.'],diag:['Not zero.',null,'δ is not a kernel here — it leaves f alone.']}]},

{id:'8.2',mod:8,n:'8.2',title:'Fourier & the convolution theorem',sub:'Filtering seen as frequencies',diagram:'frequency',
 story:`There is a second way to see filtering that unlocks a powerful shortcut. The <b>Fourier</b> idea is that any signal is a sum of sinusoids — slow waves for broad shapes, fast waves for fine detail. The transform that finds those waves is linear, invertible, and turns an impulse into a constant (all frequencies equally). The headline result is the <b>convolution theorem</b>: convolving in space is the same as <i>multiplying</i> in frequency, F{f ∗ h} = F{f}·F{h}. <b>Parseval</b> adds that total energy is the same counted either way, and the zero-frequency (DC) term is just the average brightness. So blurring = keeping low frequencies; sharpening = boosting high ones.`,
 worked:`<p>Power (average of squares) of <span class="pt">f = [1,3,4,0,3,4,4,4]</span> and its derivative output [3,−3,−1,4,1,0]:</p>
  <div class="work"><div class="line">power(f) = (1+9+16+0+9+16+16+16)/8 = 83/8 = 10.4</div><div class="line">power(out) = (9+9+1+16+1+0)/6 = 36/6 = 6</div><div class="res">not equal — the filter changed the energy</div></div>`,
 formula:{grid:`${MX([['F{f ∗ h}','=','F{f} · F{h}']],{cap:'convolution ↔ multiplication'})}`,
   symbols:[['Fourier','a signal = sum of sinusoids'],['convolution theorem','convolve in space = multiply in frequency'],['Parseval','total energy preserved by the transform'],['DC term','the average (zero-frequency) value']]},
 why:['Sinusoids pass through an LSI filter only scaled, never reshaped.','So the natural language of filtering is frequency.','A convolution in space becomes a simple product of spectra.','Parseval ties the two views together by conserving energy.'],
 mistakes:['Thinking the Fourier transform changes the information — it is invertible.','Confusing the DC term with anything but the average.','Assuming a filter preserves power — most do not.'],
 exam:['"State the convolution theorem." (F{f∗h} = F{f}F{h}.)','"Power of f = [1,3,4,0,3,4,4,4] and of its [1,0,−1] output?" (10.4 and 6; not equal.)'],
 practice:[say('With me.'),
  {t:'n',ask:'Power of f = (1+9+16+0+9+16+16+16)/8.',fields:[['v','power']],ans:[10.375],tol:0.02,
    line:v=>`83/8 = ${fmt(v[0])}`,hints:['Square each, add, ÷8.','83/8.','≈ 10.4.'],diag:v=>null},
  {t:'n',ask:'Power of the output [3,−3,−1,4,1,0] = (9+9+1+16+1+0)/6.',fields:[['v','power']],ans:[6],
    line:v=>`36/6 = ${fmt(v[0])}`,hints:['Square each, add, ÷6.','36/6.','6.'],diag:v=>null},
  say('Alone — the theorem.'),
  {t:'m',ask:'Convolution in space corresponds to what in frequency?',opts:['addition','multiplication','subtraction'],correct:1,
    hints:['F{f∗h} = F{f}·F{h}.','A product.','Multiplication.'],diag:['Not addition.',null,'Not subtraction.']}]},

{id:'8.3',mod:8,n:'8.3',title:'Template matching: SSD, CC, NCC',sub:'Finding a patch in a picture',diagram:'template',
 story:`How does a phone find an icon on a screen, or you find Waldo? You slide a small <b>template</b> over the image and score the match at each spot. The simplest score is <b>SSD</b>, the sum of squared differences — it is zero for a perfect match and grows as things differ, so you look for the minimum. Plain <b>cross-correlation</b> scores by multiplying and summing, but it can be fooled by bright regions. <b>NCC</b>, normalised cross-correlation, fixes that by removing each patch's average and scaling by its contrast, so it still works when the lighting changes. Rule of thumb: SSD for identical brightness, NCC when brightness may vary.`,
 worked:`<div class="work"><div class="line">SSD  = Σ (patch − template)²   → 0 means exact match (minimise)</div><div class="line">CC   = Σ patch · template      → can be fooled by bright areas</div><div class="res">NCC  = CC after removing mean & scaling → robust to lighting</div></div>`,
 formula:{grid:`<p>SSD minimised at the match. NCC ∈ [−1, 1], = 1 for a perfect match, and is invariant to brightness and contrast.</p>`,
   symbols:[['SSD','sum of squared differences (minimise)'],['CC','cross-correlation (maximise, but brightness-sensitive)'],['NCC','normalised CC — robust to lighting'],['match','best score over all positions']]},
 why:['At each position, compare the template to the overlapping patch.','SSD measures total squared disagreement — zero when identical.','Cross-correlation rewards large values, so a bright patch can win falsely.','NCC subtracts the mean and divides by the norm, cancelling brightness and contrast.'],
 mistakes:['Maximising SSD instead of minimising it.','Using plain cross-correlation when lighting varies (use NCC).','Forgetting NCC lies in [−1, 1], with 1 the perfect match.'],
 exam:['"Compare SSD, cross-correlation and NCC." (model answer: definitions + when to use.)','"Which score is robust to brightness changes?" (NCC.)'],
 practice:[say('Checks.'),
  {t:'m',ask:'A perfect template match gives an SSD of…',opts:['the largest value','zero','one'],correct:1,
    hints:['SSD measures difference.','No difference → 0.','Zero.'],diag:['SSD is minimised, not maximised.',null,'That is NCC.']},
  {t:'m',ask:'Which score still works when the lighting changes?',opts:['SSD','plain cross-correlation','NCC'],correct:2,
    hints:['It removes the mean and scales.','Normalised.','NCC.'],diag:['SSD is brightness-sensitive.','CC can be fooled by brightness.',null]}]},

{id:'8.4',mod:8,n:'8.4',title:'Recovering signals & integral images',sub:'The lost mean, and fast box sums',diagram:'integral',
 story:`Two final tools. First, a subtlety about derivatives: if you only keep a signal's derivative, you can get its shape back by summing up, but you can never recover its overall level — the <b>mean is lost</b>, because the derivative of a constant is zero. So the best recovery of l = [1,1,2,2,0] from its derivative is the original minus its own mean of 1.2. Second, the <b>integral image</b>: precompute a running sum from the top-left, and then the sum over <i>any</i> rectangle is just four corner lookups — add two, subtract two — no matter how big the box. That trick made early face detectors fast enough to run inside a camera.`,
 worked:`<p>Integral image of rows (1, 2)/(3, 4):</p>
  <div class="work"><div class="line">II(0,0)=1,  II(0,1)=1+2=3</div><div class="line">II(1,0)=1+3=4,  II(1,1)=1+2+3+4=10</div><div class="res">II = (1 3 / 4 10) → any box sum = 4 corners</div></div>
  <p class="plain">l = [1,1,2,2,0], mean 1.2 → best recovery [−0.2, −0.2, 0.8, 0.8, −1.2].</p>`,
 formula:{grid:`<p>box sum = II(D) − II(B) − II(C) + II(A), the four corners. Derivative recovery = signal − its mean (mean is lost).</p>`,
   symbols:[['integral image','running sum from the top-left'],['box sum','4 corner lookups, any size'],['mean lost','a derivative forgets the overall level'],['recovery','integrate, then it is up to a constant']]},
 why:['An integral image stores the sum of everything above-and-left of each pixel.','The sum of any rectangle is then a fixed combination of four of those values.','This is O(1) per box regardless of box size — hence very fast.','Differentiating removes constants, so integrating back leaves the mean undetermined.'],
 mistakes:['Expecting to recover the mean from a derivative — it is gone.','Using the wrong corner signs in the box-sum formula.','Thinking the integral image is slow because the image is big — lookups are constant time.'],
 exam:['"Integral image of (1 2 / 3 4)?" ((1 3 / 4 10).)','"l = [1,1,2,2,0]: derivative and best recovery?" ([0,1,0,−2]; [−0.2,−0.2,0.8,0.8,−1.2].)'],
 practice:[say('With me.'),
  {t:'n',ask:'Integral image, bottom-right corner: II(1,1) = 1 + 2 + 3 + 4.',fields:[['v','II']],ans:[10],
    line:v=>`sum of all four = ${fmt(v[0])}`,hints:['Add every pixel above-and-left.','1+2+3+4.','10.'],diag:v=>null},
  {t:'n',ask:'Give the full integral image of (1 2 / 3 4): four numbers II(0,0), II(0,1), II(1,0), II(1,1).',fields:[['a','00'],['b','01'],['c','10'],['d','11']],ans:[1,3,4,10],
    line:v=>`(1 3 / 4 10)`,hints:['Running sums from top-left.','1, 1+2, 1+3, all.','1, 3, 4, 10.'],diag:v=>null},
  say('Alone — the lost mean.'),
  {t:'n',ask:'Best recovery of l = [1,1,2,2,0] is l minus its mean. What is the mean?',fields:[['v','mean']],ans:[1.2],tol:0.02,
    line:v=>`(1+1+2+2+0)/5 = ${fmt(v[0])}`,hints:['Add them, ÷5.','6/5.','1.2.'],diag:v=>null}]},

{id:'9.1',mod:9,n:'9.1',title:'"Explain why" drills',sub:'Words earn marks too',diagram:null,
 story:`Open-book exams give generous marks for clear reasoning, not just numbers, so let's rehearse saying the ideas plainly. For each prompt below, write a sentence or two in your own words, then reveal the model answer and compare. Do not aim for fancy language — aim for the one key idea stated clearly. If your attempt names that idea, you have the marks. There is also one calculator warm-up on partial derivatives, the kind he opens with. Take your time; explaining well is a skill that grows quickly with a little practice.`,
 worked:`<div class="work"><div class="line">partials of f = x³y + yz + 4z⁻² at (1,2,3):</div><div class="line">∂/∂x = 3x²y = 3·1·2 = 6</div><div class="line">∂/∂y = x³ + z = 1 + 3 = 4</div><div class="res">∂/∂z = y − 8z⁻³ = 2 − 8/27 = 1.70</div></div>`,
 formula:{grid:`<p>These are short-answer drills. Say the one key idea; the model answers show the mark-winning phrase.</p>`,
   symbols:[['explain why','name the key idea in plain words'],['model answer','the phrase the marker looks for'],['partials','∂f/∂x etc., one variable at a time']]},
 why:['Markers reward the key idea, clearly stated.','Writing it yourself first fixes it in memory.','Comparing with the model shows exactly what was missing.','A sentence or two is usually enough for full marks.'],
 mistakes:['Writing a long answer that never names the key idea.','Leaving explain-parts blank to save time — they carry real marks.','Memorising wording without understanding it.'],
 exam:['"Why is a Gaussian preferred over a box filter?" (smooth fall-off, no blocky artefacts / cleaner low-pass.)','"Why must you blur before downsampling?" (to avoid aliasing.)'],
 practice:[say('Warm-up — compute.'),
  {t:'n',ask:'f = x³y + yz + 4z⁻² at (1,2,3). ∂/∂x = 3x²y = ?',fields:[['v','∂/∂x']],ans:[6],
    line:v=>`3·1·2 = ${fmt(v[0])}`,hints:['Differentiate x³y in x → 3x²y.','3·1²·2.','6.'],diag:v=>null},
  {t:'n',ask:'∂/∂z = y − 8z⁻³ at (1,2,3) = 2 − 8/27.',fields:[['v','∂/∂z']],ans:[1.7037],tol:0.03,
    line:v=>`2 − 8/27 = ${fmt(v[0])}`,hints:['d/dz of 4z⁻² is −8z⁻³.','2 − 8/27.','≈ 1.70.'],diag:v=>null},
  say('Explain — write, then reveal.'),
  {t:'ex',ask:'Why is a Gaussian usually preferred over a box filter of the same size?',keywords:['smooth','artefact','artifact','blocky','weight','near','ring','low-pass','low pass'],need:1,
    model:'The Gaussian weights nearby pixels more and falls off smoothly, so it blurs without the blocky artefacts or ringing a box can cause — it is a cleaner low-pass filter.'},
  {t:'ex',ask:'Why must you blur an image before shrinking it?',keywords:['alias','moire','moiré','detail','nyquist','frequency','high'],need:1,
    model:'Shrinking samples more coarsely; detail finer than the new spacing folds back as false patterns (aliasing / moiré). Blurring first removes that high-frequency detail so the coarse sampling is honest.'},
  {t:'ex',ask:'Why does differentiating a noisy signal give poor edges, and what fixes it?',keywords:['noise','amplif','smooth','gaussian','spike'],need:1,
    model:'A derivative amplifies noise because noise looks like fast change, giving many false spikes. Smoothing first (or using a derivative-of-Gaussian) removes the noise and leaves one clean peak at the true edge.'},
